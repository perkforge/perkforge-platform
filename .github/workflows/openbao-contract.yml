name: openbao-contract-offline
on:
  push:
    paths: ['local-lab/openbao/**', 'local-lab/secrets-config/**', 'local-lab/fleet/bundles/secrets-openbao/**', 'local-lab/fleet/bundles/eso-home-portal/**', 'local-lab/tests/test_openbao_secrets.py', '.github/workflows/openbao-contract.yml']
  pull_request:
    paths: ['local-lab/openbao/**', 'local-lab/secrets-config/**', 'local-lab/fleet/bundles/secrets-openbao/**', 'local-lab/fleet/bundles/eso-home-portal/**', 'local-lab/tests/test_openbao_secrets.py', '.github/workflows/openbao-contract.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - name: Download and verify pinned official test inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openbao-test/bin" "$RUNNER_TEMP/openbao-test/charts"
          cd "$RUNNER_TEMP/openbao-test"
          curl -fsSL --retry 3 https://github.com/openbao/openbao-helm/releases/download/openbao-0.30.6/openbao-0.30.6.tgz -o openbao.tgz
          curl -fsSL --retry 3 https://github.com/external-secrets/external-secrets/releases/download/helm-chart-2.14.0/external-secrets-2.14.0.tgz -o eso.tgz
          curl -fsSL --retry 3 https://github.com/openbao/openbao/releases/download/v2.7.2/openbao_2.7.2_linux_amd64.tar.gz -o bao.tar.gz
          curl -fsSL --retry 3 https://github.com/rancher/fleet/releases/download/v0.16.2/fleet-linux-amd64 -o bin/fleet
          sha256sum --check <<'CHECKSUMS'
          76e90c2315a4922b4b0c6c63fd8a00b9f4bdf0cffda160664f8ea5762d59911c  openbao.tgz
          0a6d9e91b1ff50adfdbf24b50b582babfa7c5b7df42b21974ca4b3fb88ee5e34  eso.tgz
          582b1f3c2fdc5afd443b2d57a225ef654de75adea609fdb66731fd582a9cbc96  bao.tar.gz
          3e15a4adfaad2e795993bc938d4122071da40d03190c90e8a6426948f9a19a9a  bin/fleet
          CHECKSUMS
          tar -xzf openbao.tgz -C charts
          tar -xzf eso.tgz -C charts
          tar -xzf bao.tar.gz -C bin
          chmod +x bin/fleet
          echo "$RUNNER_TEMP/openbao-test/bin" >> "$GITHUB_PATH"
          echo "BAO_BIN=$RUNNER_TEMP/openbao-test/bin/bao" >> "$GITHUB_ENV"
          echo "OPENBAO_CHART=$RUNNER_TEMP/openbao-test/charts/openbao" >> "$GITHUB_ENV"
          echo "ESO_CHART=$RUNNER_TEMP/openbao-test/charts/external-secrets" >> "$GITHUB_ENV"
      - name: Test synthetic OpenBao isolation and native rendering
        run: python -m unittest discover -s local-lab/tests -p test_openbao_secrets.py -v
