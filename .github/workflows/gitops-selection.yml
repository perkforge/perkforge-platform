name: gitops-selection-offline
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.impact.outputs.full }}
      sso: ${{ steps.impact.outputs.sso }}
      headlamp: ${{ steps.impact.outputs.headlamp }}
      docs: ${{ steps.impact.outputs.docs }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - run: python3 -m pip install PyYAML==6.0.3
    - name: Test selection policy and full/security fallbacks
      run: |
        python3 scripts/test_ci_impact.py
        python3 scripts/test_ci_suite.py
        python3 scripts/ci_suite.py --family platform --audit
        python3 scripts/ci_suite.py --family sso --audit
    - name: Select conservative offline suites
      id: impact
      env:
        CI_EVENT: ${{ github.event_name }}
        CI_BASE: ${{ github.event.pull_request.base.sha }}
        CI_HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 scripts/ci_impact.py

  docs:
    needs: [changes]
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: docs/architecture/package-lock.json
    - run: python3 -m pip install PyYAML==6.0.3
    - name: Validate documentation and source-only C4
      run: |
        python3 -m unittest discover -s docs/architecture -p 'test_*.py' -v
        npm --prefix docs/architecture ci --ignore-scripts --no-audit --no-fund
        npm --prefix docs/architecture run validate
        npm --prefix docs/architecture run build
  selection:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    # Preserve full API/graph regressions: baseline took 18m42s before this fix.
    timeout-minutes: 30
    env:
      KUBECONFIG: /dev/null
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - run: python3 -m pip install PyYAML==6.0.3
    - name: Verify published Nextcloud-only enrollment pin
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PYTHON'
        import json, subprocess, sys, yaml
        sys.path.insert(0, 'big-bang-bootstrap/tests')
        from fixtures.selection import release_for
        rendered = subprocess.check_output(['kubectl', 'kustomize', 'big-bang-bootstrap/enrollments/local-nextcloud'], text=True)
        source = next(o for o in yaml.safe_load_all(rendered) if o and o['kind'] == 'GitRepository')
        evidence = json.load(open('release-evidence.json'))['dependencies']['nextcloud-enrollment']
        release_for(source, evidence)
        subprocess.run(['bash', 'scripts/verify-release-ref.sh', evidence['repository'], evidence['tag'], evidence['resolvedCommit']], check=True)
        PYTHON
    # Public test fixture resolution, not bootstrap tenant discovery.
    - name: Read reviewed enrollment release selection
      id: enrollment
      run: |
        python3 - <<'PYTHON'
        import json, os, sys, yaml
        sys.path.insert(0, 'big-bang-bootstrap/tests')
        from fixtures.selection import release_for
        source = yaml.safe_load(open('big-bang-bootstrap/enrollments/base/source.yaml'))
        evidence = json.load(open('release-evidence.json'))['dependencies']['enrollment']
        release = release_for(source, evidence)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for key in ('repository', 'tag', 'resolvedCommit'):
                output.write(key + '=' + release[key] + '\n')
        PYTHON
    - name: Reject missing or moved enrollment release before checkout
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_REPOSITORY: ${{ steps.enrollment.outputs.repository }}
        RELEASE_TAG: ${{ steps.enrollment.outputs.tag }}
        RELEASE_COMMIT: ${{ steps.enrollment.outputs.resolvedCommit }}
      run: |
        set -euo pipefail
        scripts/verify-release-ref.sh "$RELEASE_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/checkout@v4
      with:
        repository: ${{ steps.enrollment.outputs.repository }}
        ref: ${{ steps.enrollment.outputs.tag }}
        path: .inputs/enrollment
        fetch-depth: 0
        persist-credentials: false
    # Public test fixture resolution, not bootstrap tenant discovery.
    - name: Read reviewed app release selection
      id: app
      run: |
        python3 - <<'PYTHON'
        import json, os, sys, yaml
        sys.path.insert(0, 'big-bang-bootstrap/tests')
        from fixtures.selection import release_for
        source = yaml.safe_load(open('.inputs/enrollment/tenants/portal/source.yaml'))
        evidence = json.load(open('.inputs/enrollment/release-evidence.json'))['dependencies']['portal']
        release = release_for(source, evidence)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for key in ('repository', 'tag', 'resolvedCommit'):
                output.write(key + '=' + release[key] + '\n')
        PYTHON
    - name: Reject missing or moved app release before checkout
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_REPOSITORY: ${{ steps.app.outputs.repository }}
        RELEASE_TAG: ${{ steps.app.outputs.tag }}
        RELEASE_COMMIT: ${{ steps.app.outputs.resolvedCommit }}
      run: |
        set -euo pipefail
        scripts/verify-release-ref.sh "$RELEASE_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/checkout@v4
      with:
        repository: ${{ steps.app.outputs.repository }}
        ref: ${{ steps.app.outputs.tag }}
        path: .inputs/app
        fetch-depth: 0
        persist-credentials: false
    - name: Check disabled Ansible bootstrap syntax
      env:
        ANSIBLE_LOCAL_TEMP: ${{ runner.temp }}/selection-ansible
      run: ansible-playbook -i big-bang-bootstrap/configuration/ansible/inventory.yaml big-bang-bootstrap/configuration/ansible/bootstrap.yaml --syntax-check
    - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      with:
        version: v3.19.0
    - name: Fetch checksummed public render fixtures only
      run: python3 big-bang-bootstrap/tests/fixtures/fetch_sources.py "$RUNNER_TEMP/minimal-sources"
    - name: Validate declarative context across the pinned review chain
      env:
        PREFLIGHT_SOURCES_DIR: ${{ runner.temp }}/minimal-sources
        CAPACITY_REPORT_DIR: ${{ runner.temp }}/minimal-inventory
        ENROLLMENT_CHECKOUT: ${{ github.workspace }}/.inputs/enrollment
        TENANT_APP_CHECKOUT: ${{ github.workspace }}/.inputs/app
        PORTAL_ENROLLMENT_CHECKOUT: ${{ github.workspace }}/.inputs/enrollment
        PORTAL_APP_CHECKOUT: ${{ github.workspace }}/.inputs/app
        RUN_PORTAL_IDENTITY_TESTS: "1"
        RUN_PLATFORM_CONFIG_TESTS: "1"
      run: |
        python3 scripts/ci_suite.py --family platform --shard residual
        python3 -m unittest discover -s evidence/tests -v
    # Historical released fixture keeps its original path; new layout needs a new release.
    - name: Verify tag-aware bootstrap without Kubernetes access
      env:
        GH_TOKEN: ${{ github.token }}
        ANSIBLE_LOCAL_TEMP: ${{ runner.temp }}/bootstrap-tag-ansible
      run: |
        set -euo pipefail
        # Preserve immutable-ref verification, but reject its incompatible context schema.
        if ansible-playbook -i big-bang-bootstrap/configuration/ansible/inventory.yaml \
          big-bang-bootstrap/configuration/ansible/bootstrap.yaml --limit local \
          -e bootstrap_verify_release=true -e config_tag=v0.1.0 \
          -e gitops_path=./local-lab-big-bang/examples/clusters/local \
          -e config_release_evidence="$GITHUB_WORKSPACE/big-bang-bootstrap/tests/fixtures/platform-v0.1.0.json" \
          > "$RUNNER_TEMP/historical-release-check.log" 2>&1; then
          echo 'Historical release unexpectedly passed the current context contract' >&2
          exit 1
        fi
        if ! grep -Fq 'Published release lacks or mismatches the platform selection annotation contract.' "$RUNNER_TEMP/historical-release-check.log"; then
          cat "$RUNNER_TEMP/historical-release-check.log"
          exit 1
        fi

    - uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.27.3'
        cache-dependency-path: big-bang-bootstrap/tests/security/cel/go.sum
    - name: Check preserved native Flux admission evidence
      working-directory: big-bang-bootstrap/tests/security/cel
      env:
        PREFLIGHT_SOURCES_DIR: ${{ runner.temp }}/minimal-sources
        FLUX_PORTAL_CASE_SCRIPT: ${{ github.workspace }}/big-bang-bootstrap/tests/security/portal_admission_cases.py
        FLUX_PORTAL_OPENAPI: ${{ github.workspace }}/big-bang-bootstrap/tests/fixtures/kubernetes-1.36.5.json
        PORTAL_ENROLLMENT_CHECKOUT: ${{ github.workspace }}/.inputs/enrollment
        PORTAL_APP_CHECKOUT: ${{ github.workspace }}/.inputs/app
        GOMAXPROCS: '2'
        GOMEMLIMIT: 512MiB
        GOFLAGS: -p=2
      run: go test -run TestFluxPortalAdmission -count=1 -v

  # Preserve the original discovery and flags; independent HTTPS fixtures and
  # host/PXE suites run on isolated runners, never against the physical cluster.
  regressions:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: [realm, human, admin, infrastructure, pxe]
    env:
      KUBECONFIG: /dev/null
      RUN_PORTAL_IDENTITY_TESTS: "1"
      RUN_PLATFORM_CONFIG_TESTS: "1"
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - run: python3 -m pip install PyYAML==6.0.3 -r big-bang-bootstrap/configuration/ansible/platform-config/requirements.txt
    - name: Exercise assigned identity regressions
      if: contains(fromJSON('["realm","human","admin"]'), matrix.suite)
      env:
        CI_SUITE: ${{ matrix.suite }}
      run: python3 scripts/ci_suite.py --family platform --shard "$CI_SUITE"
    - name: Preserve infrastructure discovery
      if: matrix.suite == 'infrastructure'
      run: python3 -m unittest discover -s infrastructure/ansible/tests -v
    - name: Preserve PXE discovery
      if: matrix.suite == 'pxe'
      run: python3 -m unittest discover -s pxe/tests -v

  # Separate offline state machines keep application fixtures from lengthening the
  # existing full review-chain job. No kubeconfig, service credentials or live API.
  platform-sso:
    needs: [changes]
    if: needs.changes.outputs.sso == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [clients, apps]
    env:
      KUBECONFIG: /dev/null
      RUN_PLATFORM_CONFIG_TESTS: "1"
      RUN_PLATFORM_SSO_TESTS: "1"
    steps:
    - uses: actions/checkout@v4
    - run: python3 -m pip install PyYAML==6.0.3 -r big-bang-bootstrap/configuration/ansible/platform-config/requirements.txt
    - name: Preserve shared authorization-model checks for targeted SSO changes
      if: needs.changes.outputs.full != 'true' && matrix.suite == 'apps'
      run: python3 -m unittest discover -s big-bang-bootstrap/tests/security -p test_authorization_review.py -v
    - name: Exercise per-app offline SSO state machines and configuration boundaries
      env:
        CI_SUITE: ${{ matrix.suite }}
      run: python3 scripts/ci_suite.py --family sso --shard "$CI_SUITE"
    - name: Verify disabled Nextcloud SSO preparation without API access
      if: matrix.suite == 'apps'
      run: python3 -m unittest discover -s big-bang-bootstrap/tests/security -p test_nextcloud_sso_preparation.py -v

  headlamp-prerequisites:
    needs: [changes]
    if: needs.changes.outputs.headlamp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBECONFIG: /dev/null
      RUN_PLATFORM_SSO_TESTS: "1"
    steps:
    - uses: actions/checkout@v4
    - run: python3 -m pip install PyYAML==6.0.3 -r big-bang-bootstrap/configuration/ansible/platform-config/requirements.txt
    - name: Exercise offline host transactions and isolated HTTPS routing
      run: |
        python3 -m unittest discover -s infrastructure/ansible/tests -p test_api_oidc.py -v
        python3 -m unittest discover -s big-bang-bootstrap/tests/bootstrap -p test_headlamp_routing.py -v
