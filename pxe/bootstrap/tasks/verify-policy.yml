---
- name: Inspect actual effective policy for account and root connection contexts
  ansible.builtin.command:
    argv: ['{{ bootstrap_sshd }}', -T, -C, 'user={{ item }},addr={{ bootstrap_controller_address }},host={{ bootstrap_controller_address }}']
  loop: ['{{ bootstrap_policy_user }}', root]
  register: bootstrap_effective
  changed_when: false
- ansible.builtin.assert:
    that:
      - "'pubkeyauthentication yes' in item.stdout_lines"
      - "'authenticationmethods publickey' in item.stdout_lines"
      - "'passwordauthentication no' in item.stdout_lines"
      - "'kbdinteractiveauthentication no' in item.stdout_lines"
      - "'permitrootlogin no' in item.stdout_lines"
      - "'usepam yes' in item.stdout_lines"
      - "'usedns no' in item.stdout_lines"
  loop: '{{ bootstrap_effective.results }}'
