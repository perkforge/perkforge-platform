---
# Always a new controller-side SSH connection, not Ansible's existing bootstrap channel.
- name: Check fresh human key login and require actual password-sudo
  ansible.builtin.command:
    argv: '{{ bootstrap_human_ssh_argv + ["sudo -k; if sudo -n -v 2>/dev/null; then exit 40; fi; sudo -S -p " ~ "\"\"" ~ " /usr/bin/id -u"] }}'
    stdin: '{{ bootstrap_human_sudo_password }}'
    stdin_add_newline: true
  delegate_to: localhost
  become: false
  register: bootstrap_human_check
  changed_when: false
  no_log: true
- ansible.builtin.assert:
    that:
      - bootstrap_human_check.rc == 0
      - bootstrap_human_check.stdout | trim == '0'
    fail_msg: 'Fresh human key login/password-sudo was not verified. Preserve bootstrap recovery.'
