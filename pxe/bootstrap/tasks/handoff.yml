---
- name: Validate distinct human identity and public-key-only input
  ansible.builtin.assert:
    that:
      - bootstrap_human_user is match('^[a-z][a-z0-9_-]{0,30}$')
      - bootstrap_human_user not in ['root', bootstrap_user, 'UNCONFIGURED']
      - bootstrap_human_public_key.split()[1] != bootstrap_public_key.split()[1]
      - bootstrap_human_public_key is match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)) [A-Za-z0-9+/=]+( [A-Za-z0-9_.@ -]+)?$')
      - bootstrap_human_sudo_password | length > 0
      - "'\n' not in bootstrap_human_sudo_password"
      - "'\r' not in bootstrap_human_sudo_password"
  no_log: true
- name: Refuse overwriting an existing human account during initial handoff
  ansible.builtin.getent:
    database: passwd
    key: '{{ bootstrap_human_user }}'
    fail_key: false
- ansible.builtin.assert:
    that: ansible_facts.getent_passwd[bootstrap_human_user] == none
- name: Create locked human account before protected password delivery
  ansible.builtin.user:
    name: '{{ bootstrap_human_user }}'
    home: '{{ bootstrap_root }}/home/{{ bootstrap_human_user }}'
    create_home: true
    groups: wheel
    append: true
    password: '!'
    shell: /bin/bash
  no_log: true
- name: Set human password through encrypted SSH stdin using target PAM policy
  ansible.builtin.command:
    argv: ['{{ bootstrap_chpasswd }}']
    stdin: '{{ bootstrap_human_user }}:{{ bootstrap_human_sudo_password }}'
    stdin_add_newline: true
  no_log: true
- ansible.builtin.file:
    path: '{{ bootstrap_root }}/home/{{ bootstrap_human_user }}/.ssh'
    state: directory
    owner: '{{ bootstrap_human_user }}'
    group: '{{ bootstrap_human_user }}'
    mode: '0700'
- ansible.builtin.copy:
    dest: '{{ bootstrap_root }}/home/{{ bootstrap_human_user }}/.ssh/authorized_keys'
    content: "{{ bootstrap_human_public_key }}\n"
    owner: '{{ bootstrap_human_user }}'
    group: '{{ bootstrap_human_user }}'
    mode: '0600'
- name: Validate installed human public key before attempting access transition
  ansible.builtin.command:
    argv: ['{{ bootstrap_ssh_keygen }}', -lf, '{{ bootstrap_root }}/home/{{ bootstrap_human_user }}/.ssh/authorized_keys']
  changed_when: false
- ansible.builtin.command:
    argv: ['{{ bootstrap_restorecon }}', -RF, '{{ bootstrap_root }}/home/{{ bootstrap_human_user }}']
  changed_when: false
- ansible.builtin.include_tasks: verify-policy.yml
  vars:
    bootstrap_policy_user: '{{ bootstrap_human_user }}'
- name: Leave bootstrap access in place until fresh checks, never revoke on assertion alone
  ansible.builtin.copy:
    dest: '{{ bootstrap_state_dir }}/state.yml'
    content: |
      account: {{ bootstrap_user }}
      action: handoff
      access: outstanding_root_equivalent
      result: human_configured_not_verified
    owner: '{{ bootstrap_uid }}'
    group: '{{ bootstrap_gid }}'
    mode: '0600'
