---
- name: Require a single public key, not private material/options
  ansible.builtin.assert:
    that:
      - bootstrap_public_key is match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)) [A-Za-z0-9+/=]+( [A-Za-z0-9_.@ -]+)?$')
  no_log: true
- name: Require installed SSH service inactive before configuring first exposure
  ansible.builtin.command:
    argv: ['{{ bootstrap_systemctl }}', is-active, sshd.service]
  register: bootstrap_sshd_state
  failed_when: bootstrap_sshd_state.rc not in [0, 3, 4]
  changed_when: false
- ansible.builtin.assert:
    that: bootstrap_sshd_state.stdout | trim == 'inactive'
- name: Require SSH socket inactive; do not search unrelated socket descriptions
  ansible.builtin.command:
    argv: ['{{ bootstrap_systemctl }}', is-active, sshd.socket]
  register: bootstrap_socket_state
  failed_when: bootstrap_socket_state.rc not in [0, 3, 4]
  changed_when: false
- ansible.builtin.assert:
    that: bootstrap_socket_state.stdout | trim == 'inactive'
- name: Reject enabled exact SSH socket; never match descriptions or unrelated units
  ansible.builtin.command:
    argv: ['{{ bootstrap_systemctl }}', is-enabled, sshd.socket]
  register: bootstrap_socket_enabled
  failed_when: false
  changed_when: false
- ansible.builtin.assert:
    that:
      - bootstrap_socket_enabled.rc in [1, 4]
      - bootstrap_socket_enabled.stdout | trim in ['disabled', 'masked', 'not-found', '']
- name: Refuse any existing account; reruns require ledger/recovery review
  ansible.builtin.getent:
    database: passwd
    key: '{{ bootstrap_user }}'
    fail_key: false
- ansible.builtin.assert:
    that: ansible_facts.getent_passwd[bootstrap_user] == none
- name: Refuse existing owned policy or home paths
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
  loop: ['{{ bootstrap_home }}', '{{ bootstrap_sudo_file }}', '{{ bootstrap_ssh_file }}']
  register: bootstrap_paths
- ansible.builtin.assert:
    that: not item.stat.exists and not item.stat.islnk | default(false)
  loop: '{{ bootstrap_paths.results }}'
- name: Create locked temporary account; PAM/key behavior requires RHEL rehearsal
  ansible.builtin.user:
    name: '{{ bootstrap_user }}'
    home: '{{ bootstrap_home }}'
    create_home: true
    password: '!'
    shell: /bin/bash
  no_log: true
- ansible.builtin.file:
    path: '{{ bootstrap_home }}/.ssh'
    state: directory
    owner: '{{ bootstrap_user }}'
    group: '{{ bootstrap_user }}'
    mode: '0700'
- ansible.builtin.copy:
    dest: '{{ bootstrap_home }}/.ssh/authorized_keys'
    content: "{{ bootstrap_public_key }}\n"
    owner: '{{ bootstrap_user }}'
    group: '{{ bootstrap_user }}'
    mode: '0600'
- name: Validate the installed bootstrap public key before granting root sudo
  ansible.builtin.command:
    argv: ['{{ bootstrap_ssh_keygen }}', -lf, '{{ bootstrap_home }}/.ssh/authorized_keys']
  changed_when: false
- name: Install root-owned key-only policy; never start/reload SSH here
  ansible.builtin.template:
    src: key-only.conf.j2
    dest: '{{ bootstrap_ssh_file }}'
    owner: '{{ bootstrap_uid }}'
    group: '{{ bootstrap_gid }}'
    mode: '0600'
- name: Validate root-equivalent sudoers before installation
  ansible.builtin.template:
    src: sudoers.j2
    dest: '{{ bootstrap_sudo_file }}'
    owner: '{{ bootstrap_uid }}'
    group: '{{ bootstrap_gid }}'
    mode: '0440'
    validate: '{{ bootstrap_visudo }} -cf %s'
- name: Restore SELinux labels on owned installed-host paths
  ansible.builtin.command:
    argv: ['{{ bootstrap_restorecon }}', -RF, '{{ bootstrap_home }}', '{{ bootstrap_ssh_file }}', '{{ bootstrap_sudo_file }}']
  changed_when: false
- name: Check complete installed sshd syntax
  ansible.builtin.command:
    argv: ['{{ bootstrap_sshd }}', -t]
  changed_when: false
- ansible.builtin.include_tasks: verify-policy.yml
  vars:
    bootstrap_policy_user: '{{ bootstrap_user }}'
- ansible.builtin.copy:
    dest: '{{ bootstrap_state_dir }}/state.yml'
    content: |
      account: {{ bootstrap_user }}
      action: setup
      access: outstanding_root_equivalent
      result: configured_not_login_verified
    owner: '{{ bootstrap_uid }}'
    group: '{{ bootstrap_gid }}'
    mode: '0600'
