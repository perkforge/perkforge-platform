---
- name: Stop only existing matching units; absent expired units need no stop
  ansible.builtin.command:
    argv: [systemctl, stop, '{{ item.item }}']
  loop: '{{ current_units.results }}'
  when: "'LoadState=not-found' not in item.stdout"
  changed_when: true
  # Expiry can unload the unit after preflight; the following absence check is authoritative.
  failed_when: false
- name: Inspect stopped or expired identities before clearing any failed state
  ansible.builtin.command:
    argv: [systemctl, show, '{{ item }}', '-p', LoadState, '-p', ActiveState, '-p', MainPID, '-p', InvocationID, '-p', ExecStart, '-p', KillMode]
  loop: '{{ pilot_units }}'
  register: stopped_for_rearm
  changed_when: false
- name: Require absence or exact stopped original invocation before expiry reset
  ansible.builtin.assert:
    that:
      - "'LoadState=not-found' in item.stdout or (config_session.path in item.stdout and 'MainPID=0' in item.stdout_lines and 'KillMode=control-group' in item.stdout_lines)"
      - "'LoadState=not-found' in item.stdout or ('ActiveState=inactive' in item.stdout_lines or 'ActiveState=failed' in item.stdout_lines)"
      - "'LoadState=not-found' in item.stdout or (item.stdout | regex_findall('InvocationID=([0-9a-f]{32})')) == (original_identities[index] | regex_findall('InvocationID=([0-9a-f]{32})'))"
  loop: '{{ stopped_for_rearm.results }}'
  loop_control:
    index_var: index
- name: Clear only a verified expired pilot failure so its transient name can unload
  ansible.builtin.command:
    argv: [systemctl, reset-failed, '{{ item.item }}']
  loop: '{{ stopped_for_rearm.results }}'
  when: "'ActiveState=failed' in item.stdout_lines"
  changed_when: true
- name: Wait for verified old transient unit names to unload; never replace an occupied name
  ansible.builtin.command:
    argv: [systemctl, show, '{{ item }}', '-p', LoadState]
  loop: '{{ pilot_units }}'
  register: unloaded
  changed_when: false
  until: unloaded.stdout == 'LoadState=not-found'
  retries: 5
  delay: 1
- name: Verify reserved listeners gone while guard remains
  ansible.builtin.command: /usr/bin/ss -H -lntu
  register: rearm_stopped_sockets
  changed_when: false
- ansible.builtin.assert:
    that: rearm_stopped_sockets.stdout_lines | select('search', ':(69|4011|8080|2000[0-9])\s') | list | length == 0
- name: Validate and query only original system/libvirt PID tokens
  ansible.builtin.assert:
    that:
      - pilot_record.dnsmasq_baseline.splitlines() | length > 0
      - pilot_record.dnsmasq_baseline.splitlines() | select('match', '^\s*[1-9][0-9]*\s+\S') | list | length == pilot_record.dnsmasq_baseline.splitlines() | length
- ansible.builtin.set_fact:
    rearm_original_pids: '{{ pilot_record.dnsmasq_baseline.splitlines() | map("split") | map("first") | list }}'
  no_log: true
- ansible.builtin.command:
    argv: [ps, -ww, '-p', '{{ rearm_original_pids | join(",") }}', '-o', 'pid=,args=']
  register: rearm_baseline
  changed_when: false
  failed_when: false
  no_log: true
- ansible.builtin.assert:
    that:
      - rearm_baseline.rc == 0
      - rearm_baseline.stdout == pilot_record.dnsmasq_baseline
    fail_msg: 'Original process baseline failed; guard retained, no default-service action.'
- ansible.builtin.include_tasks: verify-activation-copies.yml
- ansible.builtin.command: /usr/sbin/nft -j list table inet perkforge_pxe_pilot
  register: guard_before_recreate
  changed_when: false
- ansible.builtin.assert:
    that: guard_before_recreate.stdout == rearm_guard.content | b64decode
- name: Withdraw old live ledger only after it is archived and old units are absent
  ansible.builtin.file:
    path: '{{ pilot_record.config_dir }}/unit-identities.json'
    state: absent
- name: Recreate only the same two units with explicitly approved no-timeout runtime
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [systemd-run, --quiet, --unit=perkforge-pxe-pilot-dnsmasq.service, --property=Type=exec, --property=Restart=no, --property=RuntimeMaxSec=infinity, --property=KillMode=control-group, --, /usr/sbin/dnsmasq, --keep-in-foreground, '--conf-file={{ config_session.path }}/dnsmasq.conf']
    - [systemd-run, --quiet, --unit=perkforge-pxe-pilot-http.service, --property=Type=exec, --property=Restart=no, --property=RuntimeMaxSec=infinity, --property=KillMode=control-group, --, /usr/sbin/nginx, -p, '{{ pilot_runtime }}/http/', -e, stderr, -c, '{{ config_session.path }}/nginx.conf', -g, 'daemon off;']
  changed_when: true
- name: Capture and validate new identities and actual timer timestamps
  ansible.builtin.command:
    argv: [systemctl, show, '{{ item }}', '-p', InvocationID, '-p', MainPID, '-p', ExecStart, '-p', ActiveState, '-p', ActiveEnterTimestamp, '-p', RuntimeMaxUSec]
  loop: '{{ pilot_units }}'
  environment:
    LC_ALL: C
  register: rearmed_units
  changed_when: false
- ansible.builtin.assert:
    that:
      - "'ActiveState=active' in item.stdout_lines"
      - "'RuntimeMaxUSec=infinity' in item.stdout_lines"
      - item.stdout is search('MainPID=[1-9][0-9]*')
      - item.stdout is search('ActiveEnterTimestamp=.+')
      - item.stdout is search('InvocationID=[0-9a-f]{32}')
      - item.stdout | regex_findall('InvocationID=([0-9a-f]{32})') != original_identities[index] | regex_findall('InvocationID=([0-9a-f]{32})')
      - config_session.path in item.stdout
  loop: '{{ rearmed_units.results }}'
  loop_control:
    index_var: index
- name: Update authoritative shutdown identities atomically
  ansible.builtin.copy:
    content: '{{ rearmed_units.results | map(attribute="stdout") | list | to_nice_json }}'
    dest: '{{ pilot_record.config_dir }}/unit-identities.json'
    owner: root
    group: root
    mode: '0600'
- name: Record actual new lifetime and history location
  ansible.builtin.copy:
    content: '{{ pilot_record | combine({"lifetime_seconds": "infinity", "rearm_archive": rearm_archive.path, "shutdown_required": true, "lifetime_scope": "operator-approved current pilot session"}) | to_nice_json }}'
    dest: '{{ pilot_runtime }}/config/active.json'
    owner: root
    group: root
    mode: '0600'
  no_log: true
- ansible.builtin.command: /usr/sbin/nft -j list table inet perkforge_pxe_pilot
  register: guard_after_recreate
  changed_when: false
- ansible.builtin.assert:
    that: guard_after_recreate.stdout == rearm_guard.content | b64decode
- ansible.builtin.command: systemctl show nginx.service -p LoadState -p ActiveState
  register: default_after_rearm
  changed_when: false
- ansible.builtin.assert:
    that: default_after_rearm.stdout == rearm_default.stdout
- name: Recheck original system/libvirt processes after recreation
  ansible.builtin.command:
    argv: [ps, -ww, '-p', '{{ rearm_original_pids | join(",") }}', '-o', 'pid=,args=']
  register: rearm_final_baseline
  changed_when: false
  failed_when: false
  no_log: true
- ansible.builtin.assert:
    that:
      - rearm_final_baseline.rc == 0
      - rearm_final_baseline.stdout == pilot_record.dnsmasq_baseline
    fail_msg: 'Original process baseline changed; stop only verified pilot units and retain guard.'
- name: Verify reserved listeners present after rearm
  ansible.builtin.command: /usr/bin/ss -H -lntu
  register: rearm_listeners
  changed_when: false
- ansible.builtin.assert:
    that:
      - rearm_listeners.stdout is search(':8080\\s')
      - rearm_listeners.stdout is search(':69\\s')
      - rearm_listeners.stdout is search(':4011\\s')
- name: Readiness output without process arguments
  ansible.builtin.debug:
    msg: '{{ item.item }} REARMED: {{ item.stdout_lines | select("match", "^(ActiveState|MainPID|ActiveEnterTimestamp|RuntimeMaxUSec)=") | join("; ") }}'
  loop: '{{ rearmed_units.results }}'
  loop_control:
    label: '{{ item.item }}'
- ansible.builtin.debug:
    msg: 'REARM COMPLETE: RuntimeMaxUSec=infinity for this session; guard unchanged, configs preserved, shutdown identities updated. EXPLICIT SHUTDOWN AND VERIFICATION REQUIRED. HOLD AT GRUB; no installer/disk approval.'
