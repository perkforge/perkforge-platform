---
- name: Rearm only recorded pilot units for explicitly approved no-timeout session
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    pilot_rearm_approved: false
    pilot_rearm_runtime: infinity
    pilot_runtime: /run/perkforge-pxe-pilot
    pilot_logs: /var/log/perkforge-pxe-pilot
    pilot_units: [perkforge-pxe-pilot-dnsmasq.service, perkforge-pxe-pilot-http.service]
  tasks:
    - ansible.builtin.assert:
        that:
          - pilot_rearm_approved | bool
          - pilot_rearm_runtime == "infinity"
          - not ansible_check_mode
          - inventory_hostname == 'localhost' and ansible_connection == 'local'
          - pilot_runtime == '/run/perkforge-pxe-pilot'
          - pilot_logs == '/var/log/perkforge-pxe-pilot'
        fail_msg: 'Explicit current-session no-timeout rearm approval required. Hold at GRUB; no installer selection.'
    - ansible.builtin.include_tasks: verify-pilot-identity.yml
    - name: Require trusted prior invocation records even if matching units expired
      ansible.builtin.assert:
        that:
          - identity_file.stat.exists
          - recorded_identities | length == pilot_units | length
          - pilot_record.hashes.keys() | sort == ['dnsmasq.conf', 'grub.cfg', 'ingress.nft', 'nginx.conf']
    - ansible.builtin.assert:
        that:
          - item is search('InvocationID=[0-9a-f]{32}')
          - pilot_record.config_dir in item
      loop: '{{ recorded_identities }}'
    - ansible.builtin.set_fact:
        config_session: '{{ {"path": pilot_record.config_dir} }}'
        pilot_review_hashes: '{{ pilot_record.hashes }}'
        pilot_menu_placed: true
        original_identities: '{{ recorded_identities }}'
    - ansible.builtin.include_tasks: verify-activation-copies.yml
    - name: Require current guard exactly matches saved applied table before any stop
      ansible.builtin.slurp:
        src: '{{ pilot_record.config_dir }}/applied-guard.json'
      register: rearm_guard
    - ansible.builtin.command: /usr/sbin/nft -j list table inet perkforge_pxe_pilot
      register: rearm_actual_guard
      changed_when: false
    - ansible.builtin.assert:
        that: rearm_actual_guard.stdout == rearm_guard.content | b64decode
        fail_msg: 'Guard missing/changed: no rearm; preserve current state for inspection.'
    - ansible.builtin.command: systemctl show nginx.service -p LoadState -p ActiveState
      register: rearm_default
      changed_when: false
    - ansible.builtin.assert:
        that:
          - "'LoadState=masked' in rearm_default.stdout_lines"
          - "'ActiveState=inactive' in rearm_default.stdout_lines"
    - name: Allocate protected history; never overwrite prior invocation records
      ansible.builtin.tempfile:
        state: directory
        path: '{{ pilot_record.config_dir }}'
        prefix: rearm-history-
      register: rearm_archive
    - ansible.builtin.copy:
        src: '{{ pilot_runtime }}/config/active.json'
        remote_src: true
        dest: '{{ rearm_archive.path }}/active-before.json'
        owner: root
        group: root
        mode: '0600'
    - name: Preserve original identity ledger before stopping any unit
      ansible.builtin.copy:
        src: '{{ pilot_record.config_dir }}/unit-identities.json'
        remote_src: true
        dest: '{{ rearm_archive.path }}/unit-identities-before.json'
        owner: root
        group: root
        mode: '0600'
    - name: Stop and recreate only recorded units; failure leaves guard in place
      block:
        - ansible.builtin.include_tasks: rearm-units.yml
      rescue:
        - name: Inspect protected identity again before bounded failure cleanup
          ansible.builtin.include_tasks: verify-pilot-identity.yml
        - name: Stop only matching pilot units after incomplete rearm
          ansible.builtin.command:
            argv: [systemctl, stop, '{{ item.item }}']
          loop: '{{ current_units.results }}'
          when: "'LoadState=not-found' not in item.stdout"
          changed_when: true
        - ansible.builtin.fail:
            msg: 'Rearm failed. Only identity-verified pilot units stopped; guard retained. Preserve history and inspect; no installer or automatic retry.'
