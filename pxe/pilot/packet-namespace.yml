---
- name: Create one previously absent fixture namespace
  ansible.builtin.command:
    argv: [/usr/bin/ip, netns, add, '{{ fixture_namespace }}']
  changed_when: true
- name: Record namespace mount identity before using it
  ansible.builtin.stat:
    path: '/run/netns/{{ fixture_namespace }}'
    follow: false
    get_checksum: false
  register: namespace_identity
- name: Require a recorded identity
  ansible.builtin.assert:
    that: namespace_identity.stat.exists
- ansible.builtin.set_fact:
    namespace_owned: '{{ namespace_owned | combine({fixture_namespace: namespace_identity.stat.inode}) }}'
