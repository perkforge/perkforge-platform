---
- ansible.builtin.include_tasks: verify-pilot-identity.yml
- name: Stop only verified dedicated units; never use PID files or killall
  ansible.builtin.command:
    argv: [systemctl, stop, '{{ item.item }}']
  loop: '{{ current_units.results }}'
  when: "'LoadState=not-found' not in item.stdout"
  changed_when: true
- name: Verify dedicated unit processes gone
  ansible.builtin.command:
    argv: [systemctl, show, '{{ item }}', '-p', MainPID, '-p', ActiveState]
  loop: '{{ pilot_units }}'
  register: stopped_units
  changed_when: false
  failed_when: "'MainPID=0' not in stopped_units.stdout or 'ActiveState=active' in stopped_units.stdout"
- name: Require reserved listeners gone before withdrawing guard
  ansible.builtin.command: /usr/bin/ss -H -lntu
  register: stopped_sockets
  changed_when: false
- ansible.builtin.assert:
    that: stopped_sockets.stdout_lines | select('search', ':(69|4011|8080|2000[0-9])\s') | list | length == 0
    fail_msg: 'Reserved listener remains; keep ingress guard and inspect.'
- name: Verify existing system/libvirt dnsmasq processes unchanged
  ansible.builtin.command: ps -ww -C dnsmasq -o pid=,args=
  register: stopped_baseline
  changed_when: false
  failed_when: false
  no_log: true
- name: Report baseline query failure safely and retain guard
  ansible.builtin.assert:
    that: stopped_baseline.rc == 0
    fail_msg: 'Shutdown baseline query failed, exit={{ stopped_baseline.rc }}. Dedicated units were stopped; retain guard and inspect.'
- name: Require preserved system/libvirt identities without printing arguments
  ansible.builtin.assert:
    that: stopped_baseline.stdout == pilot_record.dnsmasq_baseline
    fail_msg: 'Shutdown baseline identity mismatch. Retain guard and protected evidence for review; do not restart existing services.'
- ansible.builtin.command: systemctl show nginx.service -p LoadState -p ActiveState
  register: preserved_default
  changed_when: false
- ansible.builtin.assert:
    that:
      - "'LoadState=masked' in preserved_default.stdout_lines"
      - "'ActiveState=inactive' in preserved_default.stdout_lines"
- name: Inspect current tables; do not infer absence from a failed query
  ansible.builtin.command: /usr/sbin/nft -j list tables
  register: shutdown_tables
  changed_when: false
- ansible.builtin.set_fact:
    guard_present: "{{ (shutdown_tables.stdout | from_json).nftables | selectattr('table', 'defined') | map(attribute='table') | selectattr('family', 'equalto', 'inet') | selectattr('name', 'equalto', 'perkforge_pxe_pilot') | list | length > 0 }}"
- name: Remove only unchanged recorded guard, after verified stop
  when: guard_present
  block:
    - ansible.builtin.slurp:
        src: '{{ pilot_record.config_dir }}/applied-guard.json'
      register: recorded_guard
    - ansible.builtin.command: /usr/sbin/nft -j list table inet perkforge_pxe_pilot
      register: actual_guard
      changed_when: false
    - ansible.builtin.assert:
        that: actual_guard.stdout == recorded_guard.content | b64decode
        fail_msg: 'Guard changed or ownership not recorded; retain it and inspect.'
    - ansible.builtin.command: /usr/sbin/nft delete table inet perkforge_pxe_pilot
      changed_when: true
- ansible.builtin.command: /usr/sbin/nft -j list tables
  register: remaining_tables
  changed_when: false
- ansible.builtin.assert:
    that: "(remaining_tables.stdout | from_json).nftables | selectattr('table', 'defined') | map(attribute='table') | selectattr('family', 'equalto', 'inet') | selectattr('name', 'equalto', 'perkforge_pxe_pilot') | list | length == 0"
- ansible.builtin.debug:
    msg: 'Pilot units/processes/listeners gone; recorded guard absent; system/libvirt/default nginx preserved. Runtime/log records retained, indefinite TFTP menu retained. No node action.'
