---
- ansible.builtin.include_tasks: status.yml
- name: Stop only exact owned invocations; preserve all media/images/credentials/evidence
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, stop, '{{ item.item }}']
  when: "'LoadState=not-found' not in item.stdout"
  loop: '{{ rehearsal_status_units.results | reverse | list }}'
  changed_when: true
- name: Verify no owned unit process remains
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, show, '{{ item }}', '-p', LoadState, '-p', MainPID, '-p', ActiveState]
  loop: '{{ rehearsal_units }}'
  register: rehearsal_stopped_units
  changed_when: false
- ansible.builtin.assert:
    that: "'LoadState=not-found' in item.stdout or ('MainPID=0' in item.stdout and ('ActiveState=inactive' in item.stdout or 'ActiveState=failed' in item.stdout))"
  loop: '{{ rehearsal_stopped_units.results }}'
- name: Verify namespace processes gone before removing only matching namespaces
  ansible.builtin.command:
    argv: [/usr/bin/ip, netns, pids, '{{ item.item }}']
  when: item.stat.exists
  loop: '{{ rehearsal_status_namespaces.results }}'
  register: rehearsal_namespace_pids
  changed_when: false
- ansible.builtin.assert:
    that: item.rc == 0 and item.stdout | trim == ''
  when: not item.skipped | default(false)
  loop: '{{ rehearsal_namespace_pids.results }}'
- name: Remove exact empty namespaces; their bridge/tap/veth/nft objects go with them
  ansible.builtin.command:
    argv: [/usr/bin/ip, netns, delete, '{{ item.item }}']
  when: item.stat.exists
  loop: '{{ rehearsal_status_namespaces.results }}'
  changed_when: true
- ansible.builtin.stat:
    path: '/run/netns/{{ item }}'
    follow: false
    get_checksum: false
  loop: ['{{ rehearsal_server_namespace }}', '{{ rehearsal_guest_namespace }}']
  register: rehearsal_residual_namespaces
- ansible.builtin.assert:
    that: not item.stat.exists
  loop: '{{ rehearsal_residual_namespaces.results }}'
- ansible.builtin.set_fact:
    rehearsal_phase: '{{ rehearsal_phase if rehearsal_phase in ["verified_stopped", "negative_verified_stopped"] else "stopped" }}'
- ansible.builtin.include_tasks: save.yml
- ansible.builtin.debug:
    msg: 'Verified owned units stopped and namespaces absent. No host firewall table, physical interface or historical VM touched. Run root/disks/credential custody retained; deletion requires separate review.'
