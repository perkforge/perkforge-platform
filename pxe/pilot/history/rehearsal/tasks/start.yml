---
- name: Require explicit test-credential generation and RHEL agreement decisions
  ansible.builtin.assert:
    that:
      - rehearsal_credential_generation_approved | bool
      - rehearsal_rhel_agreement_approved | bool
      - rehearsal_iso.startswith('/') and rehearsal_iso | realpath == rehearsal_iso
    fail_msg: 'Start needs separate disposable credential/VM/network/RHEL agreement approval; never inherit it from plan review.'
- name: Inspect host headroom before creating any resource or key
  ansible.builtin.slurp:
    src: /proc/meminfo
  register: rehearsal_meminfo
- ansible.builtin.set_fact:
    rehearsal_available_kib: '{{ (rehearsal_meminfo.content | b64decode | regex_findall("(?m)^MemAvailable:\\s+([0-9]+) kB$"))[0] | int }}'
- ansible.builtin.assert:
    that: rehearsal_available_kib | int >= (rehearsal_memory_mib | int + 2048) * 1024
    fail_msg: 'Insufficient native memory headroom: need guest4GiB plus2GiB. Do not stop existing workloads or overcommit automatically.'
- name: Inspect required installed tools/accounts; no dependencies installed
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [/usr/bin/qemu-system-x86_64, --version]
    - [/usr/bin/qemu-img, --version]
    - [/usr/bin/qemu-io, --version]
    - [/usr/bin/ip, -Version]
    - [/usr/sbin/dnsmasq, --version]
    - [/usr/sbin/nginx, -v]
    - [/usr/sbin/nft, --version]
    - [/usr/bin/systemd-run, --version]
    - [/usr/bin/xorriso, -version]
    - [/usr/bin/getent, passwd, libvirt-qemu]
    - [/usr/bin/getent, group, kvm]
    - [/usr/bin/getent, passwd, dnsmasq]
    - [/usr/bin/getent, passwd, www-data]
  changed_when: false
- name: Require available KVM only if explicitly selected
  ansible.builtin.stat:
    path: /dev/kvm
  register: rehearsal_kvm
  when: rehearsal_accel == 'kvm'
- ansible.builtin.assert:
    that: rehearsal_kvm.stat.exists and rehearsal_kvm.stat.ischr
    fail_msg: 'KVM absent. No silent slow fallback; select reviewed TCG only with realistic duration expectations.'
  when: rehearsal_accel == 'kvm'
- name: Verify exact media identity before any extraction or disk creation
  ansible.builtin.stat:
    path: '{{ rehearsal_iso }}'
    follow: false
    checksum_algorithm: sha256
  register: rehearsal_media
- ansible.builtin.assert:
    that:
      - rehearsal_media.stat.isreg and not rehearsal_media.stat.islnk
      - rehearsal_media.stat.size == 11059986432
      - rehearsal_media.stat.checksum == rehearsal_iso_sha256
- name: Require pinned local RHEL10 validator, without installing or fetching anything
  ansible.builtin.stat:
    path: '{{ playbook_dir }}/../local/tools/pykickstart-3.78.tar.gz'
    checksum_algorithm: sha256
    follow: false
  register: rehearsal_validator_archive
- ansible.builtin.assert:
    that:
      - rehearsal_validator_archive.stat.isreg and not rehearsal_validator_archive.stat.islnk
      - rehearsal_validator_archive.stat.checksum == 'f9752920e48408a21588cf734a49cab6f4bdf7ab80c3262099a775bc9abb1895'
- name: Require enough local space for fresh media plus worst-case disposable disks
  ansible.builtin.command:
    argv: [/usr/bin/df, --output=avail, -B1, /var/lib]
  register: rehearsal_disk_space
  changed_when: false
- ansible.builtin.assert:
    that: rehearsal_disk_space.stdout_lines[-1] | trim | int >= 96636764160
    fail_msg: 'Need at least90GiB free before this fixture; no cleanup/deletion of existing files authorized.'
- name: Require namespace names absent
  ansible.builtin.command: /usr/bin/ip netns list
  register: rehearsal_namespaces_before
  changed_when: false
- ansible.builtin.assert:
    that: item not in (rehearsal_namespaces_before.stdout_lines | map('regex_replace', ' .*$', '') | list)
  loop: ['{{ rehearsal_server_namespace }}', '{{ rehearsal_guest_namespace }}']
- name: Require dedicated transient unit names absent
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, show, '{{ item }}', '-p', LoadState, '--value']
  loop: '{{ rehearsal_units }}'
  register: rehearsal_units_before
  changed_when: false
- ansible.builtin.assert:
    that: item.stdout == 'not-found'
  loop: '{{ rehearsal_units_before.results }}'
- name: Inspect trusted distribution firmware targets, not existing guest NVRAM
  ansible.builtin.stat:
    path: '{{ item | realpath }}'
    checksum_algorithm: sha256
  loop: [/usr/share/OVMF/OVMF_CODE_4M.ms.fd, /usr/share/OVMF/OVMF_VARS_4M.ms.fd]
  register: rehearsal_firmware
- ansible.builtin.assert:
    that:
      - item.item | realpath is match('^/usr/share/OVMF/[A-Za-z0-9_.-]+$')
      - item.stat.isreg and item.stat.uid == 0
  loop: '{{ rehearsal_firmware.results }}'
- name: Inspect fixed root-controlled parent before creating it
  ansible.builtin.stat:
    path: /var/lib/perkforge-pxe-rehearsal
    follow: false
  register: rehearsal_parent
- ansible.builtin.assert:
    that: not rehearsal_parent.stat.exists or (rehearsal_parent.stat.isdir and not rehearsal_parent.stat.islnk and rehearsal_parent.stat.uid == 0 and rehearsal_parent.stat.mode == '0711')
- ansible.builtin.file:
    path: /var/lib/perkforge-pxe-rehearsal
    state: directory
    owner: root
    group: root
    mode: '0711'
- name: Atomically allocate new run root; a concurrent/repeated start must fail
  ansible.builtin.command:
    argv: [/usr/bin/mkdir, -m0711, '{{ rehearsal_root }}']
  changed_when: true
- ansible.builtin.set_fact:
    rehearsal_run_allocated: true
- ansible.builtin.include_tasks: save.yml
- name: Create only dedicated runtime/serving/credential/disk paths
  ansible.builtin.file:
    path: '{{ rehearsal_root }}/{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
  loop:
    - {path: config, owner: root, group: root, mode: '0700'}
    - {path: credentials, owner: root, group: root, mode: '0700'}
    - {path: media, owner: root, group: root, mode: '0711'}
    - {path: media/http, owner: root, group: root, mode: '0711'}
    - {path: media/http/rhel-10.2, owner: root, group: root, mode: '0700'}
    - {path: media/tftp, owner: root, group: root, mode: '0700'}
    - {path: vm, owner: libvirt-qemu, group: kvm, mode: '0700'}
    - {path: firmware, owner: root, group: root, mode: '0755'}
    - {path: logs, owner: root, group: root, mode: '0711'}
    - {path: state, owner: root, group: root, mode: '0711'}
    - {path: logs/vm, owner: libvirt-qemu, group: kvm, mode: '0700'}
    - {path: logs/router, owner: dnsmasq, group: nogroup, mode: '0700'}
    - {path: logs/dnsmasq, owner: dnsmasq, group: nogroup, mode: '0700'}
    - {path: logs/http, owner: www-data, group: www-data, mode: '0700'}
    - {path: state/router, owner: dnsmasq, group: nogroup, mode: '0700'}
    - {path: state/dnsmasq, owner: dnsmasq, group: nogroup, mode: '0700'}
    - {path: state/http, owner: www-data, group: www-data, mode: '0700'}
- ansible.builtin.file:
    path: '{{ rehearsal_root }}/state/http/{{ item }}'
    state: directory
    owner: www-data
    group: www-data
    mode: '0700'
  loop: [client-body, proxy, fastcgi, uwsgi, scgi]
- name: Generate disposable fixture-only keys after all start approvals/preflight
  ansible.builtin.command:
    argv: [/usr/bin/ssh-keygen, -q, -t, ed25519, -N, '', -C, 'rehearsal-{{ item }}-{{ rehearsal_run_id }}', -f, '{{ rehearsal_root }}/credentials/rehearsal-{{ item }}']
    creates: '{{ rehearsal_root }}/credentials/rehearsal-{{ item }}'
  loop: [bootstrap, human]
  no_log: true
- name: Generate/persist disposable guest password only in protected root credential path
  ansible.builtin.set_fact:
    rehearsal_test_password: "{{ lookup('ansible.builtin.password', rehearsal_root + '/credentials/human.password', length=32, chars=['ascii_letters', 'digits']) }}"
    cacheable: false
  no_log: true
- name: Extract verified media into this empty dedicated tree; no mounts or symlinks
  ansible.builtin.command:
    argv: [/usr/bin/xorriso, -no_rc, -abort_on, FAILURE, -return_with, SORRY, '32', -hardlinks, 'off', -acl, 'off', -xattr, 'off', -follow, 'off', -overwrite, 'off', -indev, '{{ rehearsal_iso }}', -osirrox, 'on:concat_split_off:auto_chmod_off', -extract, /, '{{ rehearsal_root }}/media/http/rhel-10.2']
  changed_when: true
- name: Reject any extracted symlink/device/socket before reading or serving media
  ansible.builtin.command:
    argv: [/usr/bin/find, '{{ rehearsal_root }}/media/http', -xdev, '!', -type, d, '!', -type, f, -print, -quit]
  register: rehearsal_media_types
  changed_when: false
- ansible.builtin.assert:
    that: rehearsal_media_types.stdout == ''
- name: Copy reviewed EFI/kernel/initrd into the dedicated TFTP tree
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [/usr/bin/cp, -R, --no-dereference, '{{ rehearsal_root }}/media/http/rhel-10.2/EFI', '{{ rehearsal_root }}/media/tftp/EFI']
    - [/usr/bin/mkdir, -m0700, '{{ rehearsal_root }}/media/tftp/images']
    - [/usr/bin/cp, -R, --no-dereference, '{{ rehearsal_root }}/media/http/rhel-10.2/images/pxeboot', '{{ rehearsal_root }}/media/tftp/images/pxeboot']
  changed_when: true
- ansible.builtin.slurp:
    src: '{{ rehearsal_root }}/media/tftp/EFI/BOOT/grub.cfg'
  register: rehearsal_vendor_grub
- ansible.builtin.set_fact:
    rehearsal_linux_candidates: '{{ rehearsal_vendor_grub.content | b64decode | regex_findall("(?m)^\\s*(linux(?:efi)?)\\s+") | unique }}'
    rehearsal_initrd_candidates: '{{ rehearsal_vendor_grub.content | b64decode | regex_findall("(?m)^\\s*(initrd(?:efi)?)\\s+") | unique }}'
- ansible.builtin.assert:
    that: rehearsal_linux_candidates | length == 1 and rehearsal_initrd_candidates | length == 1
- ansible.builtin.set_fact:
    rehearsal_linux_command: '{{ rehearsal_linux_candidates[0] }}'
    rehearsal_initrd_command: '{{ rehearsal_initrd_candidates[0] }}'
- name: Prepare standard configuration using synthetic identities only
  ansible.builtin.include_tasks: render.yml
- name: Validate final disposable Kickstart with pinned upstream RHEL10 parser
  ansible.builtin.command:
    argv: [/usr/bin/python3, '{{ playbook_dir }}/../local/tools/pykickstart-3.78/tools/ksvalidator.py', -v, RHEL10, '{{ rehearsal_root }}/media/http/rhel-10.2/perkforge-rehearsal/install.ks']
  environment:
    PYTHONPATH: '{{ playbook_dir }}/../local/tools/pykickstart-3.78'
  changed_when: false
- name: Make all serving media root-owned read-only; credentials are outside these roots
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [/usr/bin/find, '{{ rehearsal_root }}/media', -xdev, -type, f, -exec, /usr/bin/chmod, '0444', '{}', +]
    - [/usr/bin/find, '{{ rehearsal_root }}/media', -xdev, -type, d, -exec, /usr/bin/chmod, '0555', '{}', +]
  changed_when: true
- name: Create new disposable target/baseline/canary images only
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [/usr/bin/qemu-img, create, -f, qcow2, '{{ rehearsal_root }}/vm/target.qcow2', 64G]
    - [/usr/bin/qemu-io, -f, qcow2, -c, 'write -P 0x5a 0 4096', '{{ rehearsal_root }}/vm/target.qcow2']
    - [/usr/bin/qemu-img, convert, -f, qcow2, -O, qcow2, '{{ rehearsal_root }}/vm/target.qcow2', '{{ rehearsal_root }}/vm/baseline.qcow2']
    - [/usr/bin/qemu-img, create, -f, raw, '{{ rehearsal_root }}/vm/canary.raw', 1G]
    - [/usr/bin/qemu-io, -f, raw, -c, 'write -P 0x6b 0 4096', '{{ rehearsal_root }}/vm/canary.raw']
  changed_when: true
- ansible.builtin.file:
    path: '{{ rehearsal_root }}/vm/{{ item }}'
    owner: libvirt-qemu
    group: kvm
    mode: '0600'
  loop: [target.qcow2, baseline.qcow2, canary.raw]
- ansible.builtin.stat:
    path: '{{ rehearsal_root }}/vm/canary.raw'
    checksum_algorithm: sha256
  register: rehearsal_canary_before
- ansible.builtin.copy:
    content: "{{ rehearsal_canary_before.stat.checksum }}\n"
    dest: '{{ rehearsal_root }}/config/canary.sha256'
    mode: '0600'
- name: Copy fresh firmware state; never mutate distribution or existing guest NVRAM
  ansible.builtin.copy:
    remote_src: true
    src: '{{ item.src }}'
    dest: '{{ rehearsal_root }}/{{ item.dest }}'
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
  loop:
    - {src: /usr/share/OVMF/OVMF_CODE_4M.ms.fd, dest: firmware/CODE.fd, owner: root, group: root, mode: '0444'}
    - {src: /usr/share/OVMF/OVMF_VARS_4M.ms.fd, dest: vm/VARS.fd, owner: libvirt-qemu, group: kvm, mode: '0600'}
- name: Create isolated namespaces and persist exact mount identities
  ansible.builtin.include_tasks: namespace.yml
  loop: ['{{ rehearsal_server_namespace }}', '{{ rehearsal_guest_namespace }}']
  loop_control:
    loop_var: rehearsal_namespace
- name: Configure links ONLY inside owned namespaces, no physical uplink/default route
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [/usr/bin/ip, -n, '{{ rehearsal_server_namespace }}', link, add, fixture0, type, veth, peer, name, upstream0, netns, '{{ rehearsal_guest_namespace }}']
    - [/usr/bin/ip, -n, '{{ rehearsal_guest_namespace }}', link, add, bridge0, type, bridge]
    - [/usr/bin/ip, -n, '{{ rehearsal_guest_namespace }}', link, set, upstream0, master, bridge0]
    - [/usr/bin/ip, -n, '{{ rehearsal_guest_namespace }}', tuntap, add, tap0, mode, tap, user, libvirt-qemu]
    - [/usr/bin/ip, -n, '{{ rehearsal_guest_namespace }}', link, set, tap0, master, bridge0]
    - [/usr/bin/ip, -n, '{{ rehearsal_server_namespace }}', address, add, 192.0.2.10/24, dev, fixture0]
    - [/usr/bin/ip, -n, '{{ rehearsal_guest_namespace }}', address, add, 192.0.2.1/24, dev, bridge0]
    - [/usr/bin/ip, -n, '{{ rehearsal_server_namespace }}', link, set, lo, up]
    - [/usr/bin/ip, -n, '{{ rehearsal_guest_namespace }}', link, set, lo, up]
    - [/usr/bin/ip, -n, '{{ rehearsal_server_namespace }}', link, set, fixture0, up]
    - [/usr/bin/ip, -n, '{{ rehearsal_guest_namespace }}', link, set, bridge0, up]
    - [/usr/bin/ip, -n, '{{ rehearsal_guest_namespace }}', link, set, upstream0, up]
    - [/usr/bin/ip, -n, '{{ rehearsal_guest_namespace }}', link, set, tap0, up]
  changed_when: true
- name: Check then apply the proven guard INSIDE server namespace only
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [/usr/bin/ip, netns, exec, '{{ rehearsal_server_namespace }}', /usr/sbin/nft, -c, -f, '{{ rehearsal_root }}/config/ingress.nft']
    - [/usr/bin/ip, netns, exec, '{{ rehearsal_server_namespace }}', /usr/sbin/nft, -f, '{{ rehearsal_root }}/config/ingress.nft']
  changed_when: true
- name: Launch isolated foreground services and VM; no host default units modified
  ansible.builtin.include_tasks: unit.yml
  loop: '{{ rehearsal_launches }}'
  loop_control:
    loop_var: rehearsal_unit
- ansible.builtin.set_fact:
    rehearsal_phase: installing
- ansible.builtin.include_tasks: save.yml
