---
- name: Launch one foreground process in its isolated namespace
  ansible.builtin.command:
    argv: '{{ rehearsal_unit.argv }}'
  changed_when: true
- name: Capture systemd invocation immediately; PID alone is not ownership
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, show, '{{ rehearsal_unit.name }}', '-p', InvocationID, '--value']
  register: rehearsal_unit_identity
  changed_when: false
- ansible.builtin.assert:
    that: rehearsal_unit_identity.stdout is match('^[0-9a-f]{32}$')
- ansible.builtin.set_fact:
    rehearsal_owned_units: '{{ rehearsal_owned_units | combine({rehearsal_unit.name: rehearsal_unit_identity.stdout}) }}'
- ansible.builtin.include_tasks: save.yml
