---
- name: Create only this previously absent private namespace
  ansible.builtin.command:
    argv: [/usr/bin/ip, netns, add, '{{ rehearsal_namespace }}']
  changed_when: true
- ansible.builtin.stat:
    path: '/run/netns/{{ rehearsal_namespace }}'
    follow: false
    get_checksum: false
  register: rehearsal_namespace_identity
- ansible.builtin.assert:
    that: rehearsal_namespace_identity.stat.exists
- ansible.builtin.set_fact:
    rehearsal_owned_namespaces: '{{ rehearsal_owned_namespaces | combine({rehearsal_namespace: rehearsal_namespace_identity.stat.inode}) }}'
- ansible.builtin.include_tasks: save.yml
