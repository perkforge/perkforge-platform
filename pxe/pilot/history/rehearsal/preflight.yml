---
# Read-only native capability report; creates no VM/key/service/network/resource.
- name: Native rehearsal capability snapshot only
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - ansible.builtin.slurp:
        src: /proc/meminfo
      register: preflight_memory
    - ansible.builtin.stat:
        path: /dev/kvm
        follow: true
      register: preflight_kvm
    - ansible.builtin.command: /usr/bin/nproc
      register: preflight_cpus
      changed_when: false
    - ansible.builtin.command: /usr/bin/df --output=avail -B1 /var/lib
      register: preflight_space
      changed_when: false
    - ansible.builtin.command:
        argv: '{{ item }}'
      loop:
        - [/usr/bin/qemu-system-x86_64, --version]
        - [/usr/bin/qemu-img, --version]
        - [/usr/bin/qemu-io, --version]
      register: preflight_versions
      changed_when: false
    - ansible.builtin.stat:
        path: '{{ item }}'
      loop: [/usr/share/OVMF/OVMF_CODE_4M.ms.fd, /usr/share/OVMF/OVMF_VARS_4M.ms.fd]
      register: preflight_firmware
    - ansible.builtin.set_fact:
        preflight_available_kib: '{{ (preflight_memory.content | b64decode | regex_findall("(?m)^MemAvailable:\\s+([0-9]+) kB$"))[0] | int }}'
    - ansible.builtin.debug:
        msg:
          - 'Snapshot only, not VM execution approval or proof KVM can initialize.'
          - 'Available memory KiB={{ preflight_available_kib }}; need >=6291456 for4GiB guest +2GiB host margin.'
          - 'KVM character device present={{ preflight_kvm.stat.exists and preflight_kvm.stat.ischr | default(false) }}; permissions/hardware acceleration remain action-time checks.'
          - 'Logical CPUs={{ preflight_cpus.stdout }}; fixture requests4vCPU.'
          - 'Available /var/lib bytes={{ preflight_space.stdout_lines[-1] | trim }}; fixture requires >=96636764160.'
          - 'UEFI firmware pair present={{ preflight_firmware.results | selectattr("stat.exists") | list | length == 2 }}.'
          - '{{ preflight_versions.results | map(attribute="stdout_lines") | list }}'
