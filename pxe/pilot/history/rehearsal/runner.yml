# PARKED incomplete custom VM runner. Not part of the active worker-1 path.
# Preserve for later review; no execution is authorized.
---
- name: Disposable isolated RHEL installer rehearsal; never physical provisioning
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files: [rehearsal.example.yml]
  vars:
    ansible_python_interpreter: /usr/bin/python3
    rehearsal_root: '/var/lib/perkforge-pxe-rehearsal/{{ rehearsal_run_id }}'
    rehearsal_server_namespace: 'pfr-{{ rehearsal_run_id }}-s'
    rehearsal_guest_namespace: 'pfr-{{ rehearsal_run_id }}-v'
    rehearsal_units:
      - 'perkforge-rehearsal-{{ rehearsal_run_id }}-router.service'
      - 'perkforge-rehearsal-{{ rehearsal_run_id }}-dnsmasq.service'
      - 'perkforge-rehearsal-{{ rehearsal_run_id }}-http.service'
      - 'perkforge-rehearsal-{{ rehearsal_run_id }}-vm.service'
    rehearsal_iso_sha256: e15cb333529c332e76e4b1b946efe3515c99f996546675aec18e8effdf2540a5
    rehearsal_owned_namespaces: {}
    rehearsal_owned_units: {}
    rehearsal_phase: preparing
    rehearsal_outcome: unverified
    rehearsal_run_allocated: false
  tasks:
    - name: Gate every native action; check mode never simulates a VM or kernel state
      ansible.builtin.assert:
        that:
          - rehearsal_execution_approved | bool
          - not ansible_check_mode
          - inventory_hostname == 'localhost' and ansible_connection == 'local'
          - rehearsal_action in ['start', 'status', 'resume', 'stop']
          - rehearsal_run_id is match('^[a-z0-9][a-z0-9-]{7,23}$')
          - rehearsal_root == '/var/lib/perkforge-pxe-rehearsal/' + rehearsal_run_id
          - rehearsal_memory_mib | int == 4096 and rehearsal_vcpus | int == 4
          - rehearsal_accel in ['kvm', 'tcg']
          - rehearsal_scenario in ['install', 'wrong_serial', 'wrong_capacity']
          - rehearsal_wait_seconds | int >= 60 and rehearsal_wait_seconds | int <= 10800
        fail_msg: 'STOP: isolated rehearsal default off; require separately approved native resource/credential/license batch and explicit inputs. No physical install path.'
    - name: Require root controller process for namespace SSH; never invoke sudo wrappers
      ansible.builtin.command: /usr/bin/id -u
      register: rehearsal_uid
      changed_when: false
    - ansible.builtin.assert:
        that: rehearsal_uid.stdout == '0'
        fail_msg: 'Run only the separately approved native root Ansible invocation; no privilege bypass.'
    - name: Inspect fixed run path without symlink traversal
      ansible.builtin.stat:
        path: '{{ rehearsal_root }}'
        follow: false
      register: rehearsal_existing
    - ansible.builtin.assert:
        that:
          - not rehearsal_existing.stat.islnk | default(false)
          - rehearsal_action != 'start' or not rehearsal_existing.stat.exists
          - rehearsal_action == 'start' or rehearsal_existing.stat.exists
        fail_msg: 'Preserve existing/partial state. start never overwrites; use reviewed status/resume/stop.'
    - name: Load only protected matching state for existing sessions
      when: rehearsal_action != 'start'
      block:
        - ansible.builtin.stat:
            path: '{{ rehearsal_root }}/state.yml'
            follow: false
          register: rehearsal_state_file
        - ansible.builtin.assert:
            that:
              - rehearsal_existing.stat.isdir and rehearsal_existing.stat.uid == 0 and rehearsal_existing.stat.mode == '0711'
              - rehearsal_state_file.stat.isreg and not rehearsal_state_file.stat.islnk
              - rehearsal_state_file.stat.uid == 0 and rehearsal_state_file.stat.mode == '0600'
        - ansible.builtin.slurp:
            src: '{{ rehearsal_root }}/state.yml'
          register: rehearsal_state_raw
        - ansible.builtin.set_fact:
            rehearsal_saved: '{{ rehearsal_state_raw.content | b64decode | from_yaml }}'
        - ansible.builtin.assert:
            that:
              - rehearsal_saved.version == 1
              - rehearsal_saved.run_id == rehearsal_run_id
              - rehearsal_saved.root == rehearsal_root
              - rehearsal_saved.namespaces.keys() | difference([rehearsal_server_namespace, rehearsal_guest_namespace]) | length == 0
              - rehearsal_saved.units.keys() | difference(rehearsal_units) | length == 0
        - ansible.builtin.set_fact:
            rehearsal_owned_namespaces: '{{ rehearsal_saved.namespaces }}'
            rehearsal_owned_units: '{{ rehearsal_saved.units }}'
            rehearsal_phase: '{{ rehearsal_saved.phase }}'
            rehearsal_outcome: '{{ rehearsal_saved.outcome | default("unverified") }}'
            rehearsal_run_allocated: true
    - name: Execute one explicit lifecycle action
      block:
        - ansible.builtin.include_tasks: rehearsal/start.yml
          when: rehearsal_action == 'start'
        - ansible.builtin.include_tasks: rehearsal/status.yml
          when: rehearsal_action in ['status', 'resume']
        - ansible.builtin.include_tasks: rehearsal/verify.yml
          when: rehearsal_action in ['start', 'resume'] and rehearsal_phase not in ['verified_stopped', 'negative_verified_stopped']
        - ansible.builtin.include_tasks: rehearsal/stop.yml
          when: rehearsal_action == 'stop'
      rescue:
        - ansible.builtin.set_fact:
            rehearsal_phase: failed_or_unknown
            rehearsal_outcome: failed
        - ansible.builtin.include_tasks: rehearsal/save.yml
          when: rehearsal_run_allocated | bool
        - name: Attempt bounded cleanup only through matching recorded identities
          when: rehearsal_run_allocated | bool and (rehearsal_owned_namespaces | length > 0 or rehearsal_owned_units | length > 0)
          block:
            - ansible.builtin.include_tasks: rehearsal/stop.yml
          rescue:
            - ansible.builtin.debug:
                msg: 'Cleanup incomplete/identity mismatch; preserve exact state and inspect. No broad kill/delete.'
        - ansible.builtin.fail:
            msg: 'Rehearsal failed. Preserve state/disks/console. No blind restart, cleanup or physical action. Use identity-checked status/stop after review.'
