---
- name: Inspect fixture units before touching them
  ansible.builtin.command:
    argv: [systemctl, show, '{{ item }}', '-p', LoadState, '-p', ExecStart, '-p', MainPID, '-p', InvocationID]
  loop: '{{ fixture_units }}'
  register: cleanup_units
  changed_when: false
- name: Refuse to stop a unit without this run's unique root-controlled path
  ansible.builtin.assert:
    that:
      - "'LoadState=not-found' in item.stdout or (fixture_dir.path in item.stdout and '/usr/bin/ip netns exec pfpxe-s' in item.stdout)"
    fail_msg: 'Cleanup identity mismatch: STOP; inspect exact units/namespaces manually. No broad kill/delete.'
  loop: '{{ cleanup_units.results }}'
- name: Match recorded invocation IDs when startup reached identity capture
  ansible.builtin.assert:
    that: "'LoadState=not-found' in item.stdout or ('InvocationID=' ~ fixture_invocations.results[index].stdout) in item.stdout"
  when: fixture_invocations is defined and fixture_invocations.results | length == fixture_units | length
  loop: '{{ cleanup_units.results }}'
  loop_control:
    index_var: index
- name: Stop only this attempt's verified dedicated units
  ansible.builtin.command:
    argv: [systemctl, stop, '{{ item.item }}']
  when: "'LoadState=not-found' not in item.stdout"
  loop: '{{ cleanup_units.results }}'
  changed_when: true
- name: Verify dedicated units are inactive or absent after stop
  ansible.builtin.command:
    argv: [systemctl, show, '{{ item }}', '-p', LoadState, '-p', ActiveState]
  loop: '{{ fixture_units }}'
  register: stopped_units
  changed_when: false
  failed_when: "'LoadState=not-found' not in stopped_units.stdout and 'ActiveState=inactive' not in stopped_units.stdout and 'ActiveState=failed' not in stopped_units.stdout"
- name: Inspect identities of namespaces recorded by this run
  ansible.builtin.stat:
    path: '/run/netns/{{ item.key }}'
    follow: false
    get_checksum: false
  loop: '{{ namespace_owned | dict2items }}'
  register: cleanup_namespaces
- name: Refuse namespace deletion on identity mismatch
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.inode == item.item.value
  loop: '{{ cleanup_namespaces.results }}'
- name: Require all owned namespace processes gone before deletion
  ansible.builtin.command:
    argv: [/usr/bin/ip, netns, pids, '{{ item.key }}']
  register: remaining_pids
  changed_when: false
  failed_when: remaining_pids.rc != 0 or remaining_pids.stdout | trim != ''
  loop: '{{ namespace_owned | dict2items }}'
- name: Delete only verified owned empty namespaces; veth and local nft table disappear with them
  ansible.builtin.command:
    argv: [/usr/bin/ip, netns, delete, '{{ item.key }}']
  loop: '{{ namespace_owned | dict2items }}'
  changed_when: true
- name: Inspect residual namespace names
  ansible.builtin.command: /usr/bin/ip netns list
  register: residual_namespaces
  changed_when: false
- name: Fail visibly if even an unrecorded partial namespace remains
  ansible.builtin.assert:
    that: item not in (residual_namespaces.stdout_lines | map('regex_replace', ' .*$', '') | list)
    fail_msg: 'Fixture namespace remains. Evidence retained; inspect identity before any cleanup or retry.'
  loop: '{{ fixture_namespaces }}'
- ansible.builtin.debug:
    msg: 'Verified namespace cleanup; no host firewall table was used. Retained root-controlled synthetic evidence: {{ fixture_dir.path }}'
