---
- name: Inspect root-controlled transaction record without following symlinks
  ansible.builtin.stat:
    path: '{{ pilot_runtime }}/config/active.json'
    follow: false
  register: active_record
- ansible.builtin.assert:
    that:
      - active_record.stat.isreg | default(false)
      - not active_record.stat.islnk | default(false)
      - active_record.stat.uid == 0 and active_record.stat.mode == '0600'
    fail_msg: 'No trusted transaction record. STOP and inspect; no broad cleanup.'
- ansible.builtin.slurp:
    src: '{{ pilot_runtime }}/config/active.json'
  register: active_data
  no_log: true
- ansible.builtin.set_fact:
    pilot_record: '{{ active_data.content | b64decode | from_json }}'
  no_log: true
- ansible.builtin.assert:
    that:
      - pilot_record.units == pilot_units
      - pilot_record.config_dir is match('^/run/perkforge-pxe-pilot/config/session-[A-Za-z0-9_-]+$')
- name: Inspect exact dedicated units before any stop
  ansible.builtin.command:
    argv: [systemctl, show, '{{ item }}', '-p', LoadState, '-p', ExecStart, '-p', InvocationID, '-p', MainPID, '-p', KillMode]
  loop: '{{ pilot_units }}'
  register: current_units
  changed_when: false
- ansible.builtin.assert:
    that:
      - "'LoadState=not-found' in item.stdout or (pilot_record.config_dir in item.stdout and 'KillMode=control-group' in item.stdout)"
    fail_msg: 'Unit identity mismatch; leave it untouched and inspect.'
  loop: '{{ current_units.results }}'
- name: Inspect recorded invocation identities if startup reached that checkpoint
  ansible.builtin.stat:
    path: '{{ pilot_record.config_dir }}/unit-identities.json'
    follow: false
  register: identity_file
- ansible.builtin.assert:
    that:
      - identity_file.stat.isreg | default(false)
      - identity_file.stat.uid == 0 and identity_file.stat.mode == '0600'
      - not identity_file.stat.islnk | default(false)
  when: identity_file.stat.exists
- ansible.builtin.slurp:
    src: '{{ pilot_record.config_dir }}/unit-identities.json'
  register: identity_data
  when: identity_file.stat.exists
- ansible.builtin.set_fact:
    recorded_identities: '{{ identity_data.content | b64decode | from_json }}'
  when: identity_file.stat.exists
- ansible.builtin.assert:
    that:
      - recorded_identities | length == pilot_units | length
      - "'LoadState=not-found' in item.stdout or (item.stdout | regex_findall('InvocationID=([0-9a-f]{32})')) == (recorded_identities[index] | regex_findall('InvocationID=([0-9a-f]{32})'))"
    fail_msg: 'Invocation changed; no stop or firewall removal.'
  loop: '{{ current_units.results }}'
  loop_control:
    index_var: index
  when: identity_file.stat.exists
