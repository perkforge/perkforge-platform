apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../shared
- ../../apps/openbao
- ../../enrollments/dev
- ../../providers/rke2
- ../../profiles/il2
- ../../bigbang
configMapGenerator:
- name: values-cluster
  namespace: bigbang
  files:
  - values.yaml
generatorOptions:
  disableNameSuffixHash: true
commonAnnotations:
  example.perkforge.io/cluster: dev
  example.perkforge.io/environment: dev
  example.perkforge.io/profile: il2
