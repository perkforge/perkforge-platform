apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenant-enrollments
spec:
  suspend: true
  interval: 5m
  timeout: 5m
  path: ./clusters/dev-il5
  sourceRef:
    kind: GitRepository
    name: tenant-enrollments
  serviceAccountName: tenant-enrollment-admin # Generic platform-owned contract, not provisioned.
  prune: false
  wait: true
