apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bigbang
spec:
  suspend: false # Effective only after separate approval to resume the root.
  install:
    createNamespace: false # Ansible owns namespaces.
    remediation: {retries: 0, remediateLastFailure: false}
  upgrade:
    remediation: {retries: 0, remediateLastFailure: false}
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Namespace
          name: headlamp
        patch: |-
          $patch: delete
          apiVersion: v1
          kind: Namespace
          metadata:
            name: headlamp
# Ansible owns both namespaces; neither Helm installer gets cluster-wide rights.
