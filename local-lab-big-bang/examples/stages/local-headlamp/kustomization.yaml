apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bigbang
resources:
- ../../shared
- ../../providers/rke2
- ../../profiles/il2
- ../../bigbang
configMapGenerator:
- name: values-cluster
  files: [values.yaml]
generatorOptions:
  disableNameSuffixHash: true
commonAnnotations:
  example.perkforge.io/cluster: local
  example.perkforge.io/environment: local
  example.perkforge.io/profile: il2
patches:
- path: release.yaml
- target:
    kind: GitRepository
    name: bigbang-chart
  patch: |-
    - op: replace
      path: /spec/suspend
      value: false
- target:
    kind: Namespace
    name: bigbang
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: bigbang
