# Second stage: leave Headlamp private while identity starts. No other apps.
addons:
  keycloak:
    enabled: true
    flux:
      serviceAccountName: keycloak-installer
      storageNamespace: bigbang
      install:
        createNamespace: false
        remediation: {retries: 0, remediateLastFailure: false}
      upgrade:
        remediation: {retries: 0, remediateLastFailure: false}
    values:
      routes:
        inbound:
          keycloak: {enabled: false} # Existing Traefik, no Istio gateway.
      upstream:
        imagePullSecrets: [{name: private-registry}]
        nodeSelector: {kubernetes.io/hostname: cks-worker}
        resources:
          requests: {cpu: 250m, memory: 768Mi}
          limits: {cpu: '1', memory: 1536Mi}
        # One replica: local cache, no discovery/RBAC or second cache workload.
        extraEnv: |
          - {name: KC_HOSTNAME, value: 'https://keycloak-local-il2.local-lab.test/auth'}
          - {name: KC_CACHE, value: local}
          - {name: JAVA_OPTS_KC_HEAP, value: '-Xms128m -Xmx768m'}
        http: {managementRelativePath: '/'}
        extraInitContainers: |
          - name: database-ready
            image: registry1.dso.mil/ironbank/opensource/postgres/postgresql:18.6
            command: [/bin/sh, -ec]
            args:
            - 'i=0; until pg_isready -h keycloak-postgresql -U keycloak -d keycloak; do i=$((i+1)); test "$i" -lt 100 || exit 1; sleep 3; done'
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {cpu: 50m, memory: 64Mi}
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
        cache: {stack: custom}
        metrics: {enabled: false}
        database: {username: keycloak}
        serviceAccount: {automountServiceAccountToken: false}
        rbac: {create: false}
      postgresql:
        global:
          imagePullSecrets: [private-registry]
          postgresql:
            auth:
              username: postgres # Native image initializes this as superuser.
              password: ''
              postgresPassword: ''
        primary:
          nodeSelector: {kubernetes.io/hostname: cks-worker}
          persistence: {existingClaim: keycloak-postgres}
          initdb: {scriptsConfigMap: keycloak-postgres-init}
          extraEnvVars:
          - {name: POSTGRES_DB, value: keycloak}
          - name: KEYCLOAK_DB_PASSWORD
            valueFrom:
              secretKeyRef: {name: keycloak-database-existing, key: password}
          customReadinessProbe:
            exec:
              command: [/bin/sh, -ec, 'exec pg_isready -U postgres -d keycloak -h 127.0.0.1 -p 5432']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
