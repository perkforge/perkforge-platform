# Ingress default-deny for identity workloads; only Traefik -> HTTP and KC -> DB.
# Node-origin kubelet probes remain allowed by Kubernetes NetworkPolicy semantics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: identity-ingress, namespace: keycloak}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {app.kubernetes.io/name: rke2-traefik}
    ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-from-keycloak, namespace: keycloak}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgresql}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app.kubernetes.io/name: keycloak}
    ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: headlamp-from-traefik, namespace: headlamp}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {app.kubernetes.io/name: rke2-traefik}
    ports: [{protocol: TCP, port: 4466}]
