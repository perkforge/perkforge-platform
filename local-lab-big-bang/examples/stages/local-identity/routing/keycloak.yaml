apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-identity
  namespace: keycloak
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts: [keycloak-local-il2.local-lab.test]
    secretName: keycloak-local-tls
  rules:
  - host: keycloak-local-il2.local-lab.test
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service: {name: keycloak-keycloak-http, port: {number: 8080}}
