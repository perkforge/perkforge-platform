- name: Illustrate pinned Flux prerequisite and paused root seed only
  hosts: bootstrap_clusters
  gather_facts: false
  vars:
    bigbang_tag: 3.35.1
    bigbang_expected_commit: 02efc8b0d259ee0cd2c31ea857d50a4021cf6d8e
  tasks:
  - name: Report selected entrypoint without contacting Kubernetes
    ansible.builtin.debug:
      msg: "{{ inventory_hostname }} -> {{ gitops_path }}; environment={{ deployment_environment }}, profile={{ impact_profile }}, apply={{ bootstrap_apply | bool }}"
  - name: Bootstrap requires separate live approval and complete target inputs
    when: bootstrap_apply | bool
    block:
    - name: Refuse placeholders and ambiguous selection
      ansible.builtin.assert:
        that:
        - ansible_play_hosts_all | length == 1
        - config_commit is match('^[0-9a-f]{40}$')
        - target_kubeconfig != '/UNCONFIGURED/kubeconfig'
        - target_context != 'UNCONFIGURED'
        - expected_cluster_uid != 'UNCONFIGURED'
        - flux_checkout != '/UNCONFIGURED/pinned-bigbang'
    - name: Check target cluster identity before mutation
      ansible.builtin.command:
        argv:
        - kubectl
        - --kubeconfig
        - '{{ target_kubeconfig }}'
        - --context
        - '{{ target_context }}'
        - get
        - namespace
        - kube-system
        - -o
        - jsonpath={.metadata.uid}
      register: cluster_identity
      changed_when: false
    - name: Refuse a different cluster
      ansible.builtin.assert:
        that: cluster_identity.stdout == expected_cluster_uid
    - name: Obtain the selected Big Bang release tag for Flux prerequisites
      ansible.builtin.git:
        repo: https://repo1.dso.mil/big-bang/bigbang.git
        version: '{{ bigbang_tag }}'
        dest: '{{ flux_checkout }}'
        force: false
      register: bigbang_source
    - name: Refuse a release tag that no longer resolves to the reviewed commit
      ansible.builtin.assert:
        that: bigbang_source.after == bigbang_expected_commit
    - name: Apply only the pinned Flux prerequisites
      ansible.builtin.command:
        argv:
        - kubectl
        - --kubeconfig
        - '{{ target_kubeconfig }}'
        - --context
        - '{{ target_context }}'
        - apply
        - -k
        - '{{ flux_checkout }}/base/flux'
      register: flux_apply
      changed_when: "'created' in flux_apply.stdout or 'configured' in flux_apply.stdout"
    - name: Wait for required Flux CRDs before creating their resources
      ansible.builtin.command:
        argv:
        - kubectl
        - --kubeconfig
        - '{{ target_kubeconfig }}'
        - --context
        - '{{ target_context }}'
        - wait
        - --for=condition=Established
        - --timeout=120s
        - crd/gitrepositories.source.toolkit.fluxcd.io
        - crd/kustomizations.kustomize.toolkit.fluxcd.io
        - crd/helmreleases.helm.toolkit.fluxcd.io
      changed_when: false
    - name: Wait for the four pinned Flux controllers
      ansible.builtin.command:
        argv:
        - kubectl
        - --kubeconfig
        - '{{ target_kubeconfig }}'
        - --context
        - '{{ target_context }}'
        - wait
        - --namespace
        - flux-system
        - --for=condition=Available
        - --timeout=120s
        - deployment/source-controller
        - deployment/kustomize-controller
        - deployment/helm-controller
        - deployment/notification-controller
      changed_when: false
    - name: Apply the paused source and named-cluster root seed
      ansible.builtin.command:
        argv:
        - kubectl
        - --kubeconfig
        - '{{ target_kubeconfig }}'
        - --context
        - '{{ target_context }}'
        - apply
        - -f
        - '-'
        stdin: "{{ lookup('ansible.builtin.template', 'seed.yaml.j2') }}"
      register: seed_apply
      changed_when: "'created' in seed_apply.stdout or 'configured' in seed_apply.stdout"
