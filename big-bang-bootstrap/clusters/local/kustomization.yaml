apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../configuration/defaults
- ../../configuration/packages/headlamp
- ../../configuration/packages/keycloak
- ../../enrollments/local
- ../../providers/rke2
- ../../profiles/il2
- ../../configuration/packages/bigbang
configMapGenerator:
- name: values-cluster
  namespace: bigbang
  files:
  - values.yaml
generatorOptions:
  disableNameSuffixHash: true
commonAnnotations:
  example.perkforge.io/cluster: local
  example.perkforge.io/environment: local
  example.perkforge.io/profile: il2
