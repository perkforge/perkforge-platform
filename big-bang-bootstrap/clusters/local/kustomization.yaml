apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../configuration/defaults
- ../../configuration/packages/longhorn
- ../../providers/rke2
- ../../profiles/il2
- ../../configuration/packages/bigbang
configMapGenerator:
- name: values-cluster
  namespace: bigbang
  files:
  - values.yaml
generatorOptions:
  disableNameSuffixHash: true
commonAnnotations:
  platform.perkforge.io/cluster: local
  platform.perkforge.io/environment: local
  platform.perkforge.io/profile: il2
