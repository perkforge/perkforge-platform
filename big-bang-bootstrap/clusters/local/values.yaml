# Physical local package inputs; credentials remain external.
domain: perkforge.home.arpa
addons:
  headlamp:
    values:
      upstream:
        replicaCount: 1
      routes:
        inbound:
          headlamp:
            hosts:
            - headlamp.perkforge.home.arpa
      bbtests:
        cypress:
          envs:
            cypress_url: https://headlamp.perkforge.home.arpa
  keycloak:
    values:
      routes:
        inbound:
          keycloak:
            hosts:
            - keycloak.perkforge.home.arpa
      bbtests:
        cypress:
          envs:
            cypress_url: https://keycloak.perkforge.home.arpa
      upstream:
        extraEnv: '- {name: KC_HOSTNAME, value: ''https://keycloak.perkforge.home.arpa/auth''}

          - {name: KC_CACHE, value: local}

          - {name: JAVA_OPTS_KC_HEAP, value: ''-Xms128m -Xmx768m''}

          '
        nodeSelector:
          kubernetes.io/hostname: REPLACE_WITH_WORKER_NODE
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: '1'
            memory: 1536Mi
      postgresql:
        primary:
          nodeSelector:
            kubernetes.io/hostname: REPLACE_WITH_WORKER_NODE
