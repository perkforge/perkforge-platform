# Explicit owner-approved Portal log-view release; no human membership mutations.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-portal-log-acceptance
- ../../configuration/authorization/sso/grafana/orgs/portal-log-view
patches:
- target: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease, name: bigbang}
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value: {kind: ConfigMap, name: values-portal-log-oauth, valuesKey: values.yaml}
