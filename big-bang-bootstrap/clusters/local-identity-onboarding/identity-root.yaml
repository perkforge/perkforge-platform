apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-portal-foundation-root
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  path: ./generated/identity-foundation/portal
  sourceRef: {kind: GitRepository, name: tenant-enrollments}
  serviceAccountName: platform-reconciler
  prune: false
  force: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-portal
  namespace: flux-system
spec:
  interval: 5m
  timeout: 6m
  path: ./clusters/local-identity-portal
  sourceRef: {kind: GitRepository, name: tenant-enrollments}
  serviceAccountName: identity-declaration-reconciler
  prune: false
  force: false
  wait: false
  suspend: false
  healthChecks:
  - {apiVersion: kustomize.toolkit.fluxcd.io/v1, kind: Kustomization, name: identity-portal-foundation, namespace: flux-system}
  - {apiVersion: kustomize.toolkit.fluxcd.io/v1, kind: Kustomization, name: identity-portal-attest, namespace: flux-system}
  - {apiVersion: kustomize.toolkit.fluxcd.io/v1, kind: Kustomization, name: identity-portal-memberships, namespace: flux-system}
  dependsOn:
  - name: identity-portal-foundation-controls
    readyExpr: >-
      dep.spec.commonMetadata.annotations['platform.perkforge.io/foundation-sha256'] == 'e6898a166b8152c85003b63672a2ed739e4c476a403889b63a32476035da3397'
      && dep.metadata.generation == dep.status.observedGeneration
      && dep.status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
