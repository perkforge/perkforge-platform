# Future explicit stage; never selected by publication alone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-metrics-limited-pilot-ui
- ../../configuration/packages/harbor/data-services
commonAnnotations:
  platform.perkforge.io/cluster: local
  platform.perkforge.io/environment: local
  platform.perkforge.io/profile: il2
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: platform-cnpg
    namespace: bigbang
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: platform-cnpg
      namespace: bigbang
    spec:
      values:
        config:
          data:
            WATCH_NAMESPACE: gitlab,tenant-home-nextcloud,harbor
      postRenderers:
      - kustomize:
          patches:
          - target:
              kind: Deployment
              name: platform-cnpg
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata: {name: platform-cnpg, namespace: cnpg-system}
              spec:
                template:
                  spec:
                    containers:
                    - name: manager
                      env:
                      - name: WATCH_NAMESPACE
                        value: gitlab,tenant-home-nextcloud,harbor
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: harbor-valkey
    namespace: bigbang
  patch: |
    - op: replace
      path: /spec/suspend
      value: false
