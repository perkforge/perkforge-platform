# Additive platform notification mount after exact-record ESO verification.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-portal-alerts
patches:
- target: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease, name: bigbang, namespace: bigbang}
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: grafana-platform-alerts-values
        valuesKey: values.yaml
        optional: false
