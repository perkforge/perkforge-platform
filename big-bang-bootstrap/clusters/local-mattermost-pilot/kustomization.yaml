# Select only after reviewed namespace/ESO/TLS/network and exact payload verification.
# Preserve integrated Portal, Nextcloud and all platform alert rules/routes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-deployment-notifications
patches:
- target: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease, name: bigbang, namespace: bigbang}
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: mattermost-runtime-values
        valuesKey: values.yaml
        optional: false
    - op: add
      path: /spec/postRenderers/0/kustomize/patches/-
      value:
        target: {kind: Namespace, name: mattermost}
        patch: |-
          $patch: delete
          apiVersion: v1
          kind: Namespace
          metadata: {name: mattermost}
    - op: add
      path: /spec/postRenderers/0/kustomize/patches/-
      value:
        target: {kind: Namespace, name: mattermost-operator}
        patch: |-
          $patch: delete
          apiVersion: v1
          kind: Namespace
          metadata: {name: mattermost-operator}
