# Optional suspended candidate only; no existing selection points here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-velero
- ../../configuration/external-secrets/runtime
patches:
- target: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease, name: bigbang, namespace: bigbang}
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: external-secrets-native-values
        valuesKey: values.yaml
        optional: false
- target: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease, name: bigbang, namespace: bigbang}
  patch: |-
    - op: add
      path: /spec/postRenderers/0/kustomize/patches/-
      value:
        target: {kind: Namespace, name: external-secrets}
        patch: |-
          $patch: delete
          apiVersion: v1
          kind: Namespace
          metadata: {name: external-secrets}
commonAnnotations:
  platform.perkforge.io/cluster: local
  platform.perkforge.io/environment: local
  platform.perkforge.io/profile: il2
