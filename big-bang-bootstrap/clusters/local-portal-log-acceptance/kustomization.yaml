# Controlled org2 machine acceptance; tenant OAuth and human memberships stay off.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-scoped-logging-mattermost
- ../../configuration/observability/log-boundary/phase-b
patches:
- target: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease, name: bigbang}
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value: {kind: ConfigMap, name: values-portal-log-query, valuesKey: values.yaml}
    - op: add
      path: /spec/valuesFrom/-
      value: {kind: ConfigMap, name: values-portal-log-datasource, valuesKey: values.yaml}
    - op: add
      path: /spec/valuesFrom/-
      value: {kind: ConfigMap, name: values-portal-log-dashboard, valuesKey: values.yaml}
