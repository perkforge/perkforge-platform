# Unselected. Operator-created immutable prerequisites are required before selection.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-external-secrets
patches:
- target: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease, name: bigbang, namespace: bigbang}
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: external-secrets-network-values
        valuesKey: values.yaml
        optional: false
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: external-secrets-activation-values
        valuesKey: values.yaml
        optional: false
commonAnnotations:
  platform.perkforge.io/cluster: local
  platform.perkforge.io/environment: local
  platform.perkforge.io/profile: il2
