# Optional logging backend only; no metrics/Grafana activation or access expansion.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-metrics-crds
- ../../configuration/observability/logging-pilot
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: bigbang
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: values-logging-pilot
        valuesKey: values.yaml
    - op: add
      path: /spec/postRenderers/0/kustomize/patches/-
      value:
        target: {kind: Namespace, name: logging}
        patch: |-
          $patch: delete
          apiVersion: v1
          kind: Namespace
          metadata: {name: logging}
    - op: add
      path: /spec/postRenderers/0/kustomize/patches/-
      value:
        target: {kind: Namespace, name: alloy}
        patch: |-
          $patch: delete
          apiVersion: v1
          kind: Namespace
          metadata: {name: alloy}
commonAnnotations:
  platform.perkforge.io/cluster: local
  platform.perkforge.io/environment: local
  platform.perkforge.io/profile: il2
