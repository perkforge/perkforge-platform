# Separately approved lab UI: prepare dedicated TLS/DNS/access before selection.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-metrics-limited-pilot
- ../../configuration/observability/grafana-ui
commonAnnotations:
  platform.perkforge.io/cluster: local
  platform.perkforge.io/environment: local
  platform.perkforge.io/profile: il2
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: bigbang
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: values-grafana-lab-ui
        valuesKey: values.yaml
