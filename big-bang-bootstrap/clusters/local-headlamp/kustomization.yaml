apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local
configMapGenerator:
- name: values-app-stage
  namespace: bigbang
  behavior: replace
  files:
  - values.yaml
generatorOptions:
  disableNameSuffixHash: true
commonAnnotations:
  platform.perkforge.io/cluster: local
  platform.perkforge.io/environment: local
  platform.perkforge.io/profile: il2
