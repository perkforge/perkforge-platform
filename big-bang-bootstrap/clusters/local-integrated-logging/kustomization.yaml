# Platform-admin-only pilot; release, protected inputs and live acceptance required.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-mattermost-pilot
- ../../configuration/observability/integrated-logging
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: bigbang
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: values-integrated-logging
        valuesKey: values.yaml
    - op: add
      path: /spec/postRenderers/0/kustomize/patches/-
      value:
        target: {kind: Namespace, name: logging}
        patch: |-
          $patch: delete
          apiVersion: v1
          kind: Namespace
          metadata: {name: logging}
    - op: add
      path: /spec/postRenderers/0/kustomize/patches/-
      value:
        target: {kind: Namespace, name: alloy}
        patch: |-
          $patch: delete
          apiVersion: v1
          kind: Namespace
          metadata: {name: alloy}
