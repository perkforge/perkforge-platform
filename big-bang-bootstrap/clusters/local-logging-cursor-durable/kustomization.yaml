apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-portal-log-view
- ../../configuration/observability/alloy-cursors/stage-1
patches:
- target: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease, name: bigbang}
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value: {kind: ConfigMap, name: values-alloy-cursors, valuesKey: values.yaml}
