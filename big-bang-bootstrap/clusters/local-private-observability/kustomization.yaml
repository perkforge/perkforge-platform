apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-logging-cursor-durable
- ../../configuration/authorization/sso/grafana/orgs/private-sharing
patches:
- target: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease, name: bigbang}
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value: {kind: ConfigMap, name: values-grafana-private-sharing, valuesKey: values.yaml}
