# Source review only; all new packages remain disabled and paused.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-gitlab-runner
- ../../configuration/observability
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: bigbang
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value:
        kind: ConfigMap
        name: values-observability-review
        valuesKey: values.yaml
commonAnnotations:
  platform.perkforge.io/cluster: local
  platform.perkforge.io/environment: local
  platform.perkforge.io/profile: il2
