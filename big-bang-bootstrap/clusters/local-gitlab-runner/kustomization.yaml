# Dormant or disabled review stage; explicit immutable-release selection required.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-gitlab-app
configMapGenerator:
- name: values-gitlab-runner-activation
  namespace: bigbang
  files:
  - values.yaml
generatorOptions:
  disableNameSuffixHash: true
patches:
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: bigbang
  patch: "- op: add\n  path: /spec/valuesFrom/-\n  value:\n    kind: ConfigMap\n \
    \   name: values-gitlab-runner-activation\n    valuesKey: values.yaml\n"
commonAnnotations:
  platform.perkforge.io/cluster: local
  platform.perkforge.io/environment: local
  platform.perkforge.io/profile: il2
