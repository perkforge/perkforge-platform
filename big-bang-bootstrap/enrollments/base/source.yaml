# Generic platform-owned enrollment repository; no individual tenant knowledge.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tenant-enrollments
spec:
  suspend: true
  interval: 10m
  url: https://github.com/perkforge/perkforge-platform-tenants.git
  ref:
    # Published enrollment release containing portal tag selection.
    tag: v1.0.0
  secretRef:
    name: tenant-enrollments-read # Reference only; not provisioned.
