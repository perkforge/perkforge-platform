# Trusted platform Git may enroll protected repositories. Never mount this
# identity or give tenant repositories control over these Flux objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: enrollment-root-writer, namespace: flux-system}
rules:
- apiGroups: [source.toolkit.fluxcd.io]
  resources: [gitrepositories]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [kustomize.toolkit.fluxcd.io]
  resources: [kustomizations]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: enrollment-root-writer, namespace: flux-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: enrollment-root-writer}
subjects:
- {kind: ServiceAccount, name: platform-reconciler, namespace: flux-system}
