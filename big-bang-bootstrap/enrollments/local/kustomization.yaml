apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
- ../base
- reconcile.yaml
patches:
- target: {kind: GitRepository, name: tenant-enrollments}
  patch: |-
    - op: remove
      path: /spec/secretRef
- target: {kind: GitRepository, name: tenant-enrollments}
  patch: |-
    - op: replace
      path: /spec/suspend
      value: false
- target: {kind: Kustomization, name: tenant-enrollments}
  patch: |-
    - op: replace
      path: /spec/suspend
      value: false
