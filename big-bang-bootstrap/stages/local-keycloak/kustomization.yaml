apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-headlamp
- ../../apps/keycloak
configMapGenerator:
- name: values-identity
  namespace: bigbang
  files: [values.yaml]
generatorOptions:
  disableNameSuffixHash: true
patches:
- path: release.yaml
commonAnnotations:
  example.perkforge.io/cluster: local
  example.perkforge.io/environment: local
  example.perkforge.io/profile: il2
