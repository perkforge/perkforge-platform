apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: headlamp-release-storage, namespace: bigbang}
rules:
- apiGroups: ['']
  resources: [secrets] # Explicit Helm storageNamespace; no headlamp Secret API grant.
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: headlamp-release-storage, namespace: bigbang}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: headlamp-release-storage}
subjects:
- {kind: ServiceAccount, name: headlamp-installer, namespace: bigbang}
