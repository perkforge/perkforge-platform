apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../local-keycloak
configMapGenerator:
- name: values-identity
  namespace: bigbang
  behavior: merge
  files: [sso.yaml]
generatorOptions:
  disableNameSuffixHash: true
patches:
- target: {kind: HelmRelease, name: bigbang, namespace: bigbang}
  patch: |-
    - op: add
      path: /spec/valuesFrom/-
      value: {kind: ConfigMap, name: values-identity, valuesKey: sso.yaml}
commonAnnotations:
  example.perkforge.io/cluster: local
  example.perkforge.io/environment: local
  example.perkforge.io/profile: il2
