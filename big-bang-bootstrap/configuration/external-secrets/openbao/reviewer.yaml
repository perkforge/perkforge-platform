# Separate security prerequisite, not included in the ESO controller installation.
# OpenBao uses its existing rotating projected pod token, never a saved reviewer JWT.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: openbao-eso-token-reviewer}
rules:
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: openbao-eso-token-reviewer}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbao-eso-token-reviewer
subjects:
- kind: ServiceAccount
  name: openbao
  namespace: openbao
