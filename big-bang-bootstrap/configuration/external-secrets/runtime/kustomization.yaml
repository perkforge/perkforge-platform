apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Values only. Store/auth/CRD/foundation stages are separate, not side effects.
configMapGenerator:
- name: external-secrets-native-values
  namespace: bigbang
  files: [values.yaml=native-values.yaml]
generatorOptions:
  disableNameSuffixHash: true
