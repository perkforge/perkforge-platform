# Initial Kubernetes-token login only; no OIDC client or admin grant is created.
addons:
  headlamp:
    enabled: true
    flux:
      serviceAccountName: headlamp-installer
      storageNamespace: bigbang
      install:
        createNamespace: false
        remediation:
          retries: 0
          remediateLastFailure: false
      upgrade:
        remediation:
          retries: 0
          remediateLastFailure: false
      suspend: false
    values:
      bigbang:
        rbac:
          enabled: false
          clusterRoleBindings: []
      upstream:
        imagePullSecrets:
        - name: private-registry
        replicaCount: 1
        nodeSelector:
          storage.perkforge.io/worker: 'true'
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      routes:
        inbound:
          headlamp:
            enabled: false
    includeDefaultDependsOn: false
