# Active only after explicit release promotion; package credentials are external.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bigbang
spec:
  suspend: false
  interval: 10m
  timeout: 15m
  releaseName: bigbang
  targetNamespace: bigbang
  serviceAccountName: platform-reconciler
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: bigbang-chart
  valuesFrom:
  - kind: ConfigMap
    name: values-shared
    valuesKey: values.yaml
  - kind: ConfigMap
    name: values-headlamp
    valuesKey: values.yaml
    optional: true
  - kind: ConfigMap
    name: values-rancher
    valuesKey: values.yaml
    optional: true
  - kind: ConfigMap
    name: values-longhorn
    valuesKey: values.yaml
    optional: true
  - kind: ConfigMap
    name: values-openbao
    valuesKey: values.yaml
    optional: true
  - kind: ConfigMap
    name: values-keycloak
    valuesKey: values.yaml
    optional: true
  - kind: ConfigMap
    name: values-keycloak
    valuesKey: database.yaml
    optional: true
  - kind: ConfigMap
    name: values-provider
    valuesKey: values.yaml
  - kind: ConfigMap
    name: values-impact
    valuesKey: values.yaml
  - kind: ConfigMap
    name: values-cluster
    valuesKey: values.yaml
  - kind: ConfigMap
    name: values-app-stage
    valuesKey: values.yaml
  install:
    createNamespace: false
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Namespace
          name: headlamp
        patch: '$patch: delete

          apiVersion: v1

          kind: Namespace

          metadata: {name: headlamp}'
      - target:
          kind: Namespace
          name: keycloak
        patch: '$patch: delete

          apiVersion: v1

          kind: Namespace

          metadata: {name: keycloak}'
      # Owner-admin foundation owns this existing data-bearing namespace.
      # Remove only the umbrella template; never adopt it or grant namespace RBAC.
      - target:
          kind: Namespace
          name: gitlab
        patch: '$patch: delete

          apiVersion: v1

          kind: Namespace

          metadata: {name: gitlab}'
      # Runner foundation owns this namespace before chart activation.
      - target:
          kind: Namespace
          name: gitlab-runner
        patch: '$patch: delete

          apiVersion: v1

          kind: Namespace

          metadata: {name: gitlab-runner}'
      # Local metrics have no Flux-to-Grafana notification route or credential copy.
      # Native Grafana/foundation dashboards retain their existing owners.
      - target:
          group: "notification.toolkit.fluxcd.io"
          version: v1beta3
          kind: Alert
          namespace: monitoring
          name: grafana
        patch: |-
          $patch: delete
          apiVersion: notification.toolkit.fluxcd.io/v1beta3
          kind: Alert
          metadata: {name: grafana, namespace: monitoring}
      - target:
          group: "notification.toolkit.fluxcd.io"
          version: v1beta3
          kind: Provider
          namespace: monitoring
          name: grafana
        patch: |-
          $patch: delete
          apiVersion: notification.toolkit.fluxcd.io/v1beta3
          kind: Provider
          metadata: {name: grafana, namespace: monitoring}
      - target:
          group: ""
          version: v1
          kind: Secret
          namespace: monitoring
          name: grafana-flux-auth
        patch: |-
          $patch: delete
          apiVersion: v1
          kind: Secret
          metadata: {name: grafana-flux-auth, namespace: monitoring}
      - target:
          group: ""
          version: v1
          kind: ConfigMap
          namespace: monitoring
          name: flux-grafana-dashboards
        patch: |-
          $patch: delete
          apiVersion: v1
          kind: ConfigMap
          metadata: {name: flux-grafana-dashboards, namespace: monitoring}
      - target:
          group: helm.toolkit.fluxcd.io
          version: v2
          kind: HelmRelease
          name: rancher
        patch: "- op: add\n  path: /spec/valuesFrom/-\n  value:\n    kind: Secret\n\
          \    name: rancher-bootstrap-values\n    valuesKey: values.yaml\n    optional:\
          \ false"
