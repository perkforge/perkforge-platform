# Active only after explicit release promotion; package credentials are external.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bigbang
spec:
  suspend: false
  interval: 10m
  timeout: 15m
  releaseName: bigbang
  targetNamespace: bigbang
  serviceAccountName: platform-reconciler
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: bigbang-chart
  valuesFrom:
  - kind: ConfigMap
    name: values-shared
    valuesKey: values.yaml
  - kind: ConfigMap
    name: values-headlamp
    valuesKey: values.yaml
    optional: true
  - kind: ConfigMap
    name: values-rancher
    valuesKey: values.yaml
    optional: true
  - kind: ConfigMap
    name: values-longhorn
    valuesKey: values.yaml
    optional: true
  - kind: ConfigMap
    name: values-openbao
    valuesKey: values.yaml
    optional: true
  - kind: ConfigMap
    name: values-keycloak
    valuesKey: values.yaml
    optional: true
  - kind: ConfigMap
    name: values-keycloak
    valuesKey: database.yaml
    optional: true
  - kind: ConfigMap
    name: values-provider
    valuesKey: values.yaml
  - kind: ConfigMap
    name: values-impact
    valuesKey: values.yaml
  - kind: ConfigMap
    name: values-cluster
    valuesKey: values.yaml
  install:
    createNamespace: false
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Namespace
          name: headlamp
        patch: '$patch: delete

          apiVersion: v1

          kind: Namespace

          metadata: {name: headlamp}'
      - target:
          kind: Namespace
          name: keycloak
        patch: '$patch: delete

          apiVersion: v1

          kind: Namespace

          metadata: {name: keycloak}'
      - target:
          group: helm.toolkit.fluxcd.io
          version: v2
          kind: HelmRelease
          name: rancher
        patch: "- op: add\n  path: /spec/valuesFrom/-\n  value:\n    kind: Secret\n\
          \    name: rancher-bootstrap-values\n    valuesKey: values.yaml\n    optional:\
          \ false"
