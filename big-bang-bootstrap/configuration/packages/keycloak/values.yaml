# Initial master bootstrap administration only; realm/API configuration stays separate.
addons:
  keycloak:
    enabled: true
    git:
      tag: 7.3.2-bb.1
    values:
      upstream:
        # Security patch on the compatible chart; image metadata verified separately.
        image:
          tag: 26.8.1
          digest: sha256:3796d06a0a7b530ed0425644b27780411a585272ed40540c4ca942da31e8da36
        replicas: 1
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        secrets: null
        extraEnvFrom: "- secretRef:\n    name: keycloak-bootstrap-existing\n"
        database:
          password: ''
          existingSecret: keycloak-database-existing
          existingSecretKey: password
          username: keycloak
        imagePullSecrets:
        - name: private-registry
        nodeSelector:
          storage.perkforge.io/worker: 'true'
        extraEnv: '- {name: KC_HOSTNAME, value: ''https://keycloak.perkforge.home.arpa/auth''}

          - {name: KC_CACHE, value: local}

          - {name: JAVA_OPTS_KC_HEAP, value: ''-Xms128m -Xmx768m''}

          '
        http:
          managementRelativePath: /
        extraInitContainers: "- name: database-ready\n  image: registry1.dso.mil/ironbank/opensource/postgres/postgresql:18.6\n\
          \  command: [/bin/sh, -ec]\n  args:\n  - 'i=0; until pg_isready -h keycloak-postgresql\
          \ -U keycloak -d keycloak; do i=$((i+1)); test \"$i\" -lt 100 || exit 1;\
          \ sleep 3; done'\n  resources:\n    requests: {cpu: 10m, memory: 32Mi}\n\
          \    limits: {cpu: 50m, memory: 64Mi}\n  securityContext:\n    runAsUser:\
          \ 1001\n    runAsGroup: 1001\n    runAsNonRoot: true\n    allowPrivilegeEscalation:\
          \ false\n    readOnlyRootFilesystem: true\n    capabilities: {drop: [ALL]}\n"
        cache:
          stack: custom
        metrics:
          enabled: false
        serviceAccount:
          automountServiceAccountToken: false
        rbac:
          create: false
      routes:
        inbound:
          keycloak:
            enabled: false
      postgresql:
        global:
          imagePullSecrets:
          - private-registry
          postgresql:
            auth:
              username: postgres
              password: ''
              postgresPassword: ''
        primary:
          nodeSelector:
            storage.perkforge.io/worker: 'true'
          persistence:
            existingClaim: keycloak-postgres
          initdb:
            scriptsConfigMap: keycloak-postgres-init
          extraEnvVars:
          - name: POSTGRES_DB
            value: keycloak
          - name: KEYCLOAK_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-database-existing
                key: password
          customReadinessProbe:
            exec:
              command:
              - /bin/sh
              - -ec
              - exec pg_isready -U postgres -d keycloak -h 127.0.0.1 -p 5432
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
    flux:
      serviceAccountName: keycloak-installer
      storageNamespace: bigbang
      install:
        createNamespace: false
        remediation:
          retries: 0
          remediateLastFailure: false
      upgrade:
        remediation:
          retries: 0
          remediateLastFailure: false
      suspend: false
      timeout: 10m
    includeDefaultDependsOn: false
