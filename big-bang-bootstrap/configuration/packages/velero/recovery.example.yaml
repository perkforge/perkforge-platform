# Private operator inputs, not proof of approval or successful application recovery.
velero_recovery_run: false
velero_recovery_scope: '' # velero-backup-v1, velero-paused-schedule-v1 or velero-restore-v1
velero_recovery_action: backup
velero_recovery_name: ''
velero_source_namespace: '' # One approved tenant namespace, never a platform namespace.
velero_target_namespace: '' # Separate existing empty, quota/identity-prepared namespace for restore.
velero_backup_name: '' # Exact existing copied-data Backup for restore.
velero_schedule_cron: '' # Required only for paused-schedule. Cadence/RPO not chosen here.
velero_rollback_window_hours: 0 # Must be shorter than48h; pin/extend known-good points before expiry.
velero_recovery_versions:
  app_image_digest: ''
  chart_artifact_digest: ''
  app_git_commit: ''
  platform_git_commit: ''
  enrollment_git_commit: ''
  database_version: ''
  schema_version: ''
velero_backup_hooks: [] # Native pre/post exec hooks, onError:Fail, scoped to source namespace.
velero_restore_hooks: [] # Native postHooks, onError:Fail, scoped to TARGET namespace in1.18.
velero_database_scope: dedicated # Shared DB requires selective DB-native recovery, not this volume restore.
velero_restore_owners: [] # Exact target Flux Kustomizations/HelmReleases, already suspended by approved procedure.
# Also supply the protected context/state inputs from deployment.example.yaml.
# This file never pauses/unpauses an app owner, changes routing or enables a Schedule.
