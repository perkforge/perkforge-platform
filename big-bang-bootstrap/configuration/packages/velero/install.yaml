# Default and check modes contact no API.
- name: Install local Velero through one reviewed staged rollout
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
  - deployment/defaults.yaml
  tasks:
  - ansible.builtin.assert:
      that:
      - velero_install_apply is boolean
      - velero_install_stage in ['foundation', 'backend', 'activate']
  - name: Load only the explicitly approved live operation
    ansible.builtin.include_tasks: deployment/install-run.yaml
    when: velero_install_apply and not ansible_check_mode
