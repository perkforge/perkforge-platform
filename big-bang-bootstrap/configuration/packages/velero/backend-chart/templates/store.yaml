apiVersion: v1
kind: ServiceAccount
metadata: {name: velero-store, namespace: velero-store}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: velero-store, namespace: velero-store}
data:
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/objects"
    db_engine = "sqlite"
    metadata_fsync = true
    data_fsync = true
    metadata_snapshots_dir = "/data/meta-snapshots"
    metadata_auto_snapshot_interval = "1h"
    replication_factor = 1
    rpc_bind_addr = "127.0.0.1:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret_file = "/runtime/rpcSecret"
    bootstrap_peers = []
    [s3_api]
    s3_region = {{ .Values.region | quote }}
    api_bind_addr = "[::]:3900"
    [admin]
    api_bind_addr = "127.0.0.1:3903"
    admin_token_file = "/runtime/adminToken"
---
apiVersion: v1
kind: Service
metadata: {name: velero-store, namespace: velero-store}
spec:
  selector: {app: velero-store}
  ports: [{name: s3, port: 3900, targetPort: 3900}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: velero-store, namespace: velero-store}
spec:
  replicas: 1
  serviceName: velero-store
  selector: {matchLabels: {app: velero-store}}
  template:
    metadata: {labels: {app: velero-store}}
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      serviceAccountName: velero-store
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      initContainers:
      - name: private-files
        image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: [sh, -ec]
        args: ['umask 077; cp /protected/rpcSecret /runtime/rpcSecret; cp /protected/adminToken /runtime/adminToken; chmod 600 /runtime/rpcSecret /runtime/adminToken; mkdir -p /data/meta /data/objects']
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
        volumeMounts:
        - {name: protected, mountPath: /protected, readOnly: true}
        - {name: runtime, mountPath: /runtime}
        - {name: data, mountPath: /data}
      containers:
      - name: garage
        image: docker.io/dxflrs/garage:v2.5.0@sha256:23b16d34e0348d9aca9b960a7429a7e6d494974b5288bfb8f6c3ab856895f71e
        command: [/garage]
        args: [-c, /etc/garage/garage.toml, server]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: '1', memory: 2Gi}}
        ports: [{name: s3, containerPort: 3900}]
        readinessProbe: {tcpSocket: {port: s3}, initialDelaySeconds: 10, periodSeconds: 10}
        volumeMounts:
        - {name: config, mountPath: /etc/garage, readOnly: true}
        - {name: runtime, mountPath: /runtime, readOnly: true}
        - {name: data, mountPath: /data}
      volumes:
      - {name: config, configMap: {name: velero-store}}
      - {name: protected, secret: {secretName: velero-store-private, defaultMode: 288}}
      - {name: runtime, emptyDir: {medium: Memory, sizeLimit: 64Ki}}
      - name: data
        persistentVolumeClaim:
          claimName: {{ required "foundation claimName is required" .Values.claimName | quote }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velero-store
  namespace: velero-store
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: velero-store-velero-store-clients@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts: [{{ required "a dedicated HTTPS host is required" .Values.host | quote }}]
    secretName: velero-store-tls
  rules:
  - host: {{ required "a dedicated HTTPS host is required" .Values.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: velero-store, port: {name: s3}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: velero-store-isolation, namespace: velero-store}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {app.kubernetes.io/name: rke2-traefik}}
    ports: [{protocol: TCP, port: 3900}]
  egress: []

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: velero-store-clients, namespace: velero-store}
spec:
  ipAllowList:
    sourceRange:
{{ required "exact platform clientCIDRs are required" .Values.clientCIDRs | toYaml | indent 4 }}
