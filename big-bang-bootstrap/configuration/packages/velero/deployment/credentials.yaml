# Supplied existing files only. No key generation, TLS issuance, registry login or rotation.
- ansible.builtin.assert:
    that:
      - velero_secret_files.keys() | sort == ['access_key','admin','ca_cert','registry','repository_password','rpc','secret_key','tls_cert','tls_key']
- ansible.builtin.stat:
    path: '{{ item.value }}'
    follow: false
  loop: '{{ velero_secret_files | dict2items }}'
  register: secret_files
  no_log: true
- ansible.builtin.assert:
    that:
      - item.item.value is match('^/') and item.item.value | realpath == item.item.value
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == lookup('env','USER')
      - item.stat.mode == '0600'
  loop: '{{ secret_files.results }}'
  no_log: true
- ansible.builtin.command:
    argv: [openssl, verify, -CAfile, '{{ velero_secret_files.ca_cert }}', -purpose, sslserver, -verify_hostname, '{{ velero_store_hostname }}', '{{ velero_secret_files.tls_cert }}']
  changed_when: false
- ansible.builtin.command:
    argv: [openssl, x509, -checkend, '86400', -noout, -in, '{{ velero_secret_files.tls_cert }}']
  changed_when: false
- ansible.builtin.command:
    argv: [openssl, x509, -pubkey, -noout, -in, '{{ velero_secret_files.tls_cert }}']
  changed_when: false
  register: leaf_public
- ansible.builtin.command:
    argv: [openssl, pkey, -pubout, -in, '{{ velero_secret_files.tls_key }}']
  changed_when: false
  register: key_public
  no_log: true
- ansible.builtin.assert:
    that:
      - leaf_public.stdout == key_public.stdout
      - lookup('file',velero_secret_files.rpc) | trim is match('^[a-fA-F0-9]{64}$')
      - lookup('file',velero_secret_files.admin) | trim is match('^[A-Za-z0-9_-]{32,256}$')
      - lookup('file',velero_secret_files.access_key) | trim is match('^GK[a-fA-F0-9]{24}$')
      - lookup('file',velero_secret_files.secret_key) | trim is match('^[a-fA-F0-9]{64}$')
      - lookup('file',velero_secret_files.repository_password) | trim | length >= 32
      - (lookup('file',velero_secret_files.registry) | from_json).auths is mapping
  no_log: true
- vars:
    velero_cloud_credentials: |
      [default]
      aws_access_key_id={{ lookup("file",velero_secret_files.access_key) | trim }}
      aws_secret_access_key={{ lookup("file",velero_secret_files.secret_key) | trim }}
  ansible.builtin.set_fact:
    owned_objects:
    - apiVersion: v1
      kind: Secret
      metadata: {name: velero-store-private, namespace: velero-store, labels: {perkforge.io/owner: velero-platform-v1}}
      immutable: true
      type: Opaque
      data:
        rpcSecret: '{{ lookup("file",velero_secret_files.rpc) | trim | b64encode }}'
        adminToken: '{{ lookup("file",velero_secret_files.admin) | trim | b64encode }}'
    - apiVersion: v1
      kind: Secret
      metadata: {name: velero-store-tls, namespace: velero-store, labels: {perkforge.io/owner: velero-platform-v1}}
      immutable: true
      type: kubernetes.io/tls
      data:
        tls.crt: '{{ lookup("file",velero_secret_files.tls_cert) | b64encode }}'
        tls.key: '{{ lookup("file",velero_secret_files.tls_key) | b64encode }}'
    - apiVersion: v1
      kind: Secret
      metadata: {name: velero-cloud-credentials, namespace: velero, labels: {perkforge.io/owner: velero-platform-v1}}
      immutable: true
      type: Opaque
      data:
        cloud: '{{ velero_cloud_credentials | b64encode }}'
    - apiVersion: v1
      kind: Secret
      metadata: {name: velero-repo-credentials, namespace: velero, labels: {perkforge.io/owner: velero-platform-v1}}
      immutable: true
      type: Opaque
      data:
        repository-password: '{{ lookup("file",velero_secret_files.repository_password) | trim | b64encode }}'
    - apiVersion: v1
      kind: Secret
      metadata: {name: private-registry, namespace: velero, labels: {perkforge.io/owner: velero-platform-v1}}
      immutable: true
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ lookup("file",velero_secret_files.registry) | b64encode }}'
    cacheable: false
  no_log: true
- ansible.builtin.include_tasks: create-owned.yaml
  vars: {owned_secret: true}
- ansible.builtin.set_fact:
    owned_objects: []
    owned_before: {}
    owned_after: {}
    key_public: {}
    cacheable: false
  no_log: true
