# Local-admin management stage; activation needs a newly selected release,
# separately approved prerequisites and protected TLS/bootstrap inputs.
packages:
  rancher:
    enabled: true
    sourceType: helmRepo
    namespace:
      name: cattle-system
      create: false
    helmRelease:
      namespace: bigbang
    helmRepo:
      repoName: rancher-official
      chartName: rancher
      tag: 2.15.2
    wrapper:
      enabled: false
    bbCommonValues: false
    passBigBangValues: false
    includeDefaultDependsOn: false
    flux:
      suspend: false
      serviceAccountName: rancher-installer
      storageNamespace: bigbang
      timeout: 10m
      install:
        createNamespace: false
        remediation: {retries: 0}
      upgrade:
        remediation: {retries: 0}
    values:
      hostname: rancher.perkforge.home.arpa
      replicas: 1
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {memory: 4Gi}
      # Uninstall cleanup is a separate reviewed action, not a Helm side effect.
      postDelete:
        enabled: false
      features: continuous-delivery=false
      agentTLSMode: strict
      privateCA: true
      additionalTrustedCAs: true
      ingress:
        ingressClassName: traefik
        tls:
          source: secret
          secretName: tls-rancher-ingress
      # Bootstrap password comes from a required external values Secret,
      # appended to the generated HelmRelease by the outer post-renderer.
