# Add one verified owner subscriber without changing the existing publisher.
- name: Add approved exact-topic owner subscription
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ntfy_subscriber_apply: false
    ntfy_native_image: docker.io/binwiederhier/ntfy:v2.37.2@sha256:1875ddcf815c8a3c981d6d78c67a93452d0abba79b1ab9520b1f5f5238902bd7
  tasks:
  - ansible.builtin.assert:
      that:
      - ntfy_subscriber_prepare | default(false) | bool
      - ntfy_subscriber is match('^[a-z][a-z0-9-]{0,63}$')
      - ntfy_subscriber_subject is match('^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$')
      - ntfy_subscriber_role in ['tenant-admin', 'tenant-developer', 'platform-engineer']
      - ntfy_subscriber != ntfy_publisher
      - ntfy_owner_record is match('^[a-z0-9][a-z0-9-]*(/[a-z0-9][a-z0-9-]*)*$')
      - ntfy_owner_record != ntfy_record
      - ntfy_runtime_dir is match('^/[A-Za-z0-9_./-]+$')
      - ntfy_runtime_dir == (ntfy_runtime_dir | realpath)
      - ntfy_record is match('^[a-z0-9][a-z0-9-]*(/[a-z0-9][a-z0-9-]*)*$')
      - ntfy_bao_server is match('^https://[a-z0-9.-]+(:[0-9]+)?$')
  - ansible.builtin.uri:
      url: '{{ ntfy_bao_server }}/v1/sys/health'
      ca_path: '{{ ntfy_bao_ca_file }}'
      use_proxy: false
      use_netrc: false
      follow_redirects: none
    register: health
  - ansible.builtin.assert:
      that: health.json.cluster_id == ntfy_bao_cluster_id and not health.json.sealed
  - name: Read native ownership metadata only
    ansible.builtin.command:
      argv: [kubectl, -n, '{{ ntfy_namespace }}', exec, ntfy-0, --, ntfy, user, list]
    register: native_users
    changed_when: false
  - ansible.builtin.assert:
      that:
      - native_users.stdout | regex_findall('(?m)^user ([a-z][a-z0-9-]*) ') == [ntfy_publisher]
      - "'(role: user, tier: none, server config)' in native_users.stdout"
  - no_log: true
    block:
    - ansible.builtin.set_fact:
        headers: {X-Vault-Token: '{{ lookup("file", ntfy_bao_token_file) | trim }}'}
    - ansible.builtin.uri:
        url: '{{ ntfy_bao_server }}/v1/platform/data/{{ ntfy_record }}'
        headers: '{{ headers }}'
        ca_path: '{{ ntfy_bao_ca_file }}'
        use_proxy: false
        use_netrc: false
        follow_redirects: none
      register: current
    - ansible.builtin.uri:
        url: '{{ ntfy_bao_server }}/v1/platform/data/{{ ntfy_owner_record }}'
        headers: '{{ headers }}'
        ca_path: '{{ ntfy_bao_ca_file }}'
        use_proxy: false
        use_netrc: false
        follow_redirects: none
        status_code: 404
    - ansible.builtin.set_fact:
        base: '{{ current.json.data.data["server.yml"] | from_yaml }}'
        prior: '{{ lookup("file", ntfy_runtime_dir + "/validation.json") | from_json }}'
    - ansible.builtin.assert:
        that:
        - prior.accounts | length == 1
        - prior.accounts[0].username == ntfy_publisher
        - prior.accounts[0].topics == [ntfy_topic]
        - base['auth-users'] == [ntfy_publisher + ':' + prior.accounts[0].password_hash + ':user']
        - base['auth-tokens'] == [ntfy_publisher + ':' + prior.accounts[0].token + ':context-alerts']
        - base['auth-access'] == [ntfy_publisher + ':' + ntfy_topic + ':write-only']
        - base['auth-default-access'] == 'deny-all'
    - ansible.builtin.shell: 'umask 077; openssl rand -hex 32 > {{ ntfy_runtime_dir }}/subscriber.password'
      args: {creates: '{{ ntfy_runtime_dir }}/subscriber.password'}
    - ansible.builtin.shell: 'umask 077; printf tk_ > {{ ntfy_runtime_dir }}/subscriber.token; openssl rand -hex 15 | cut -c1-29 >> {{ ntfy_runtime_dir }}/subscriber.token'
      args: {creates: '{{ ntfy_runtime_dir }}/subscriber.token'}
    - ansible.builtin.command:
        argv: [podman, run, -i, --rm, --pull=never, --network, none, --entrypoint, ntfy, '{{ ntfy_native_image }}', user, hash]
        stdin: "{{ lookup('file', ntfy_runtime_dir + '/subscriber.password') }}\n{{ lookup('file', ntfy_runtime_dir + '/subscriber.password') }}"
      register: hash_result
      changed_when: false
    - ansible.builtin.set_fact:
        subscriber:
          username: '{{ ntfy_subscriber }}'
          kind: subscriber
          role: '{{ ntfy_subscriber_role }}'
          subject_id: '{{ ntfy_subscriber_subject }}'
          approved: true
          topics: ['{{ ntfy_topic }}']
          password_hash: '{{ hash_result.stdout | trim }}'
          token: '{{ lookup("file", ntfy_runtime_dir + "/subscriber.token") | trim }}'
    - ansible.builtin.set_fact:
        ntfy_accounts: '{{ prior.accounts + [subscriber] }}'
    - ansible.builtin.copy:
        dest: '{{ ntfy_runtime_dir }}/subscriber-validation.json'
        mode: '0600'
        content: '{{ {"accounts": ntfy_accounts, "previous_managed": [ntfy_publisher], "existing_users": [ntfy_publisher], "approved_removals": [], "approved_entitlements": prior.approved_entitlements | combine({ntfy_subscriber_subject: {"kind": "subscriber", "role": ntfy_subscriber_role, "topics": [ntfy_topic]}})} | to_json }}'
    - ansible.builtin.command:
        argv: [python3, '{{ playbook_dir }}/validate.py', '{{ ntfy_runtime_dir }}/subscriber-validation.json']
      changed_when: false
    - ansible.builtin.set_fact:
        config: '{{ base | combine(lookup("template", "../native-auth.yaml.j2") | from_yaml) | to_nice_yaml }}'
    - ansible.builtin.copy:
        dest: '{{ ntfy_runtime_dir }}/subscriber-server.yml'
        mode: '0600'
        content: '{{ config }}'
    - name: Preserve owner credential separately, without publisher capability
      when: ntfy_subscriber_apply | bool
      ansible.builtin.uri:
        url: '{{ ntfy_bao_server }}/v1/platform/data/{{ ntfy_owner_record }}'
        method: POST
        headers: '{{ headers }}'
        ca_path: '{{ ntfy_bao_ca_file }}'
        use_proxy: false
        use_netrc: false
        follow_redirects: none
        body_format: json
        body: {options: {cas: 0}, data: {username: '{{ ntfy_subscriber }}', token: '{{ subscriber.token }}', topic: '{{ ntfy_topic }}'}}
    - name: Update only the reviewed config version; never overwrite concurrent changes
      when: ntfy_subscriber_apply | bool
      ansible.builtin.uri:
        url: '{{ ntfy_bao_server }}/v1/platform/data/{{ ntfy_record }}'
        method: POST
        headers: '{{ headers }}'
        ca_path: '{{ ntfy_bao_ca_file }}'
        use_proxy: false
        use_netrc: false
        follow_redirects: none
        body_format: json
        body: {options: {cas: '{{ current.json.data.metadata.version | int }}'}, data: {server.yml: '{{ config }}'}}
    always:
    - ansible.builtin.set_fact: {headers: {}, current: {}, base: {}, prior: {}, ntfy_accounts: [], subscriber: {}, config: '', hash_result: {}}
