# Approved local pilot inputs; no secret values. Templates remain reusable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ntfy
  namespace: ntfy
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: ntfy
data:
  server.yml: 'base-url: "https://ntfy.perkforge.home.arpa"

    listen-http: ''-''

    listen-https: '':8443''

    key-file: /tls/tls.key

    cert-file: /tls/tls.crt

    auth-file: /data/auth.db

    auth-default-access: deny-all

    cache-file: /data/cache.db

    cache-duration: "24h"

    attachment-cache-dir: ''''

    upstream-base-url: ''''

    web-root: disable

    enable-signup: false

    log-level: WARN

    '
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: ntfy
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: ntfy-ntfy-tls@kubernetescrd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ntfy
  ports:
  - name: https
    port: 8443
    targetPort: https
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntfy
  namespace: ntfy
spec:
  serviceName: ntfy
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
    spec:
      nodeSelector:
        storage.perkforge.io/worker: 'true'
      serviceAccountName: ntfy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ntfy
        image: docker.io/binwiederhier/ntfy:v2.37.2@sha256:1875ddcf815c8a3c981d6d78c67a93452d0abba79b1ab9520b1f5f5238902bd7
        command:
        - /bin/sh
        - -ec
        args:
        - umask 077; exec ntfy serve --config /etc/ntfy/server.yml
        ports:
        - name: https
          containerPort: 8443
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: https
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: https
          initialDelaySeconds: 20
          periodSeconds: 20
        volumeMounts:
        - name: config
          mountPath: /etc/ntfy
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: ntfy-config
      - name: tls
        secret:
          secretName: ntfy-local-tls
          defaultMode: 288
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: 1Gi
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: ntfy-tls
  namespace: ntfy
spec:
  serverName: ntfy.perkforge.home.arpa
  insecureSkipVerify: false
  rootCAs:
  - secret: ntfy-backend-ca
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy
  namespace: ntfy
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - ntfy.perkforge.home.arpa
    secretName: ntfy-local-tls
  rules:
  - host: ntfy.perkforge.home.arpa
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ntfy
            port:
              number: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ntfy-isolation
  namespace: ntfy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  policyTypes:
  - Ingress
  - Egress
  egress: []
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: rke2-traefik
    ports:
    - protocol: TCP
      port: 8443
