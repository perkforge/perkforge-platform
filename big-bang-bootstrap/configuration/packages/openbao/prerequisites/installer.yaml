apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-installer
  namespace: bigbang
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-chart-installer
  namespace: openbao
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts
  - services
  - configmaps
  - pods
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - traefik.io
  resources:
  - ingressroutetcps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-chart-installer
  namespace: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-chart-installer
subjects:
- kind: ServiceAccount
  name: openbao-installer
  namespace: bigbang
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-release-storage
  namespace: bigbang
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-release-storage
subjects:
- kind: ServiceAccount
  name: openbao-installer
  namespace: bigbang
