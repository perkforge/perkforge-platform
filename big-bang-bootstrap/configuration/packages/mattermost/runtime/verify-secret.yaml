# Called inside no_log custody block. Exact match or absent only; never adopt drift.
- ansible.builtin.command:
    argv: [kubectl, -n, mattermost, get, secret, '{{ consumer.name }}', --ignore-not-found, -o, json]
  register: mm_synced
  changed_when: false
- ansible.builtin.assert:
    that: mm_allow_absent | bool or mm_synced.stdout != ''
- when: mm_synced.stdout != ''
  block:
  - ansible.builtin.assert:
      that:
      - (mm_synced.stdout | from_json).type == consumer.type
      - (mm_synced.stdout | from_json).data.keys() | sort == consumer.fields.keys() | sort
  - ansible.builtin.assert:
      that: (mm_synced.stdout | from_json).data[field.key] | b64decode == mm_expected[field.value]
    loop: '{{ consumer.fields | dict2items }}'
    loop_control: {loop_var: field}
