# Inactive profile; versions inherited exclusively from the selected Big Bang release.
# No root selection; licensing/operator trust and live acceptance remain gated.
addons:
  mattermostOperator:
    enabled: false
    # Stock image uses global informers, including Secrets. Restrict writes, not reads.
    # Namespace Roles/Bindings are owned by prerequisites/runtime-rbac.yaml.
    postRenderers:
    - kustomize:
        patches:
        - target:
            group: rbac.authorization.k8s.io
            version: v1
            kind: ClusterRole
            name: mattermost-operator
          patch: |-
            - op: replace
              path: /rules
              value:
              - apiGroups: ['']
                resources: [pods, services, configmaps, secrets, serviceaccounts, persistentvolumeclaims]
                verbs: [get, list, watch]
              - apiGroups: [apps]
                resources: [deployments, replicasets]
                verbs: [get, list, watch]
              - apiGroups: [batch]
                resources: [jobs]
                verbs: [get, list, watch]
              - apiGroups: [networking.k8s.io]
                resources: [ingresses, ingressclasses]
                verbs: [get, list, watch]
              - apiGroups: [rbac.authorization.k8s.io]
                resources: [roles, rolebindings]
                verbs: [get, list, watch]
              - apiGroups: [mattermost.com]
                resources: [clusterinstallations, mattermostrestoredbs]
                verbs: [get, list, watch]
              - apiGroups: [installation.mattermost.com]
                resources: [mattermosts]
                verbs: [get, list, watch]
              # Upstream non-ALB reconciliation still cleans up its named class.
              - apiGroups: [networking.k8s.io]
                resources: [ingressclasses]
                resourceNames: [mattermost]
                verbs: [delete]
    flux:
      suspend: true
      serviceAccountName: mattermost-operator-installer
      storageNamespace: mattermost-operator
      install: {createNamespace: false, remediation: {retries: 0}}
      upgrade: {remediation: {retries: 0}}
    values:
      imagePullSecrets: [{name: private-registry}]
      istio: {enabled: false}
      networkPolicies: {enabled: false}
  mattermost:
    enabled: false
    flux:
      suspend: true
      serviceAccountName: mattermost-installer
      storageNamespace: mattermost
      install: {createNamespace: false, remediation: {retries: 0}}
      upgrade: {remediation: {retries: 0}}
    values:
      global:
        imagePullSecrets: [{name: private-registry}]
      waitJob: {enableImagePullSecrets: true}
      domain: UNCONFIGURED.invalid
      istio: {enabled: false}
      ingress: {enabled: false, host: chat.UNCONFIGURED.invalid}
      monitoring: {enabled: false}
      networkPolicies: {enabled: false}
      sso: {enabled: false}
      bbtests: {enabled: false}
      enterprise: {enabled: false, existingSecret: '', license: ''}
      postgresql: {install: false, auth: {password: null}}
      minio: {install: false}
      elasticsearch: {enabled: false}
      database: {secret: mattermost-database}
      fileStore:
        secret: mattermost-filestore
        url: UNCONFIGURED-object-store.invalid
        bucket: mattermost
      resources:
        requests: {cpu: 2, memory: 4Gi}
        limits: {cpu: 2, memory: 4Gi}
