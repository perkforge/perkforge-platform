# Blocked inactive profile; no root selection. Licensing/operator trust unresolved.
addons:
  mattermostOperator:
    enabled: false
    git:
      repo: https://repo1.dso.mil/big-bang/product/packages/mattermost-operator.git
      path: ./chart
      tag: 1.25.9-bb.4
    flux:
      suspend: true
      serviceAccountName: mattermost-operator-installer
      storageNamespace: mattermost-operator
      install: {createNamespace: false, remediation: {retries: 0}}
      upgrade: {remediation: {retries: 0}}
    values:
      bb-common:
        istio: {enabled: false}
        networkPolicies: {enabled: false}
  mattermost:
    enabled: false
    # External fileStore Secret below; suppress legacy umbrella bundled MinIO defaults.
    objectStorage: null
    git:
      repo: https://repo1.dso.mil/big-bang/product/packages/mattermost.git
      path: ./chart
      tag: 12.0.1-bb.2
    flux:
      suspend: true
      serviceAccountName: mattermost-installer
      storageNamespace: mattermost
      install: {createNamespace: false, remediation: {retries: 0}}
      upgrade: {remediation: {retries: 0}}
    values:
      global:
        domain: UNCONFIGURED.invalid
        imagePullSecrets: [{name: private-registry}]
      bb-common:
        istio: {enabled: false}
        networkPolicies: {enabled: false}
      ingress: {enabled: false, host: chat.UNCONFIGURED.invalid}
      monitoring: {enabled: false}
      sso: {enabled: false}
      bbtests: {enabled: false}
      enterprise: {enabled: false, existingSecret: '', license: ''}
      postgresql: {install: false, auth: {password: null}}
      elasticsearch: {enabled: false}
      database: {secret: mattermost-database}
      fileStore:
        secret: mattermost-filestore
        url: UNCONFIGURED-object-store.invalid
        bucket: mattermost
      resources:
        requests: {cpu: 2, memory: 4Gi}
        limits: {cpu: 2, memory: 4Gi}
