# The data-stage deny remains. Admit only trusted ingress and named internal consumers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: harbor-web-from-traefik, namespace: harbor}
spec:
  podSelector:
    matchLabels: {app: harbor, release: harbor}
    matchExpressions: [{key: component, operator: In, values: [core, portal]}]
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {app.kubernetes.io/name: rke2-traefik}}
    ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: harbor-internal-tls, namespace: harbor}
spec:
  podSelector: {matchLabels: {app: harbor, release: harbor}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app: harbor, release: harbor}
        matchExpressions: [{key: component, operator: In, values: [core, jobservice, registry]}]
    ports: [{protocol: TCP, port: 8443}, {protocol: TCP, port: 5443}]
