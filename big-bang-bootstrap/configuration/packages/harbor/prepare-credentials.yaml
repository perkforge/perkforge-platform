# Source-only helper; execution requires separately approved protected operator inputs.
# Inputs: exact contract Secret-name -> key -> absolute private input path mapping.
# Password files are exact bytes, WITHOUT trailing newlines. TLS files are existing PEM.
# Two profiles: data before PostgreSQL; application after public CNPG CA export.
- name: Assemble protected Harbor credentials without generation or API access
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    harbor_credentials_run: false
    harbor_credentials_scope: UNAPPROVED
    harbor_credentials_profile: data
    harbor_private_root: /UNCONFIGURED/private
    harbor_credentials_manifest: /UNCONFIGURED/private/data-credentials.json
    harbor_credentials_inputs: {}
    harbor_expected_namespace_uid: UNCONFIGURED
    # SHA256 DER fingerprints of every separately approved public trust anchor.
    # Application requires the CNPG anchor among them, obtained after DB bootstrap.
    harbor_public_ca_sha256: []
    harbor_database_ca_sha256: UNCONFIGURED
    harbor_valkey_ca_sha256: UNCONFIGURED
    harbor_identity_ca_sha256: UNCONFIGURED
  tasks:
  - ansible.builtin.debug:
      msg: 'Default/check mode reads no private inputs and contacts no API. Explicit assembly never generates, rotates or delivers credentials.'
  - when: harbor_credentials_run | bool and not ansible_check_mode
    no_log: true
    block:
    - ansible.builtin.assert:
        that:
        - harbor_credentials_profile in ['data','application']
        - harbor_credentials_scope == 'harbor-' + harbor_credentials_profile + '-private-assembly-v1'
        - harbor_expected_namespace_uid is match('^[a-zA-Z0-9-]{8,64}$') and harbor_expected_namespace_uid != 'UNCONFIGURED'
    - ansible.builtin.include_tasks: tasks/contracts.yaml
    - ansible.builtin.set_fact:
        harbor_contract: '{{ harbor_contracts[harbor_credentials_profile] }}'
        harbor_manifest_items: []
        cacheable: false
    - ansible.builtin.assert:
        that:
        - harbor_credentials_inputs.keys() | sort == harbor_contract.keys() | sort
    - ansible.builtin.assert:
        that: item.value.keys() | sort == harbor_contract[item.key]['keys'] | sort
      loop: '{{ harbor_credentials_inputs | dict2items }}'
    - ansible.builtin.command:
        argv: [id, -u]
      changed_when: false
      register: harbor_effective_uid
    - ansible.builtin.include_tasks: tasks/guard-path.yaml
      vars:
        harbor_guard_path: '{{ item }}'
        harbor_guard_optional: false
      loop: "{{ harbor_credentials_inputs.values() | map('dict2items') | flatten | map(attribute='value') | unique | list }}"
    - ansible.builtin.include_tasks: tasks/guard-path.yaml
      vars:
        harbor_guard_path: '{{ harbor_credentials_manifest }}'
        harbor_guard_optional: true
    - ansible.builtin.include_tasks: tasks/assemble-object.yaml
      loop: '{{ harbor_contract | dict2items }}'
      loop_control:
        loop_var: harbor_object
    - ansible.builtin.set_fact:
        harbor_manifest: "{{ {'apiVersion':'v1','kind':'List','items':harbor_manifest_items} }}"
        cacheable: false
    - ansible.builtin.assert:
        that: harbor_manifest | harbor_manifest_valid(harbor_contract, harbor_expected_namespace_uid, harbor_credentials_profile, harbor_public_ca_sha256, harbor_database_ca_sha256, harbor_valkey_ca_sha256, harbor_identity_ca_sha256)
    - ansible.builtin.stat:
        path: '{{ harbor_credentials_manifest }}'
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: harbor_output_metadata
    - when: harbor_output_metadata.stat.exists
      block:
      - ansible.builtin.slurp:
          src: '{{ harbor_credentials_manifest }}'
        register: harbor_existing_output
      - ansible.builtin.assert:
          that: (harbor_existing_output.content | b64decode | from_json) == harbor_manifest
          fail_msg: Existing private output differs. Refusing replacement or rotation.
    - ansible.builtin.copy:
        dest: '{{ harbor_credentials_manifest }}'
        content: '{{ harbor_manifest | to_nice_json }}'
        mode: '0600'
        force: false
    - ansible.builtin.include_tasks: tasks/guard-path.yaml
      vars:
        harbor_guard_path: '{{ harbor_credentials_manifest }}'
        harbor_guard_optional: false
    - ansible.builtin.slurp:
        src: '{{ harbor_credentials_manifest }}'
      register: harbor_existing_output
    - ansible.builtin.assert:
        that: (harbor_existing_output.content | b64decode | from_json) == harbor_manifest
    always:
    - ansible.builtin.set_fact:
        harbor_manifest: {}
        harbor_manifest_items: []
        harbor_object_data: {}
        harbor_existing_output: {}
        cacheable: false
      no_log: true
