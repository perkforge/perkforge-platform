# No apply/patch/delete/adoption/rotation. Explicit create-only native Secret delivery.
- name: Deliver the exact immutable Harbor credential profile
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    harbor_delivery_run: false
    harbor_delivery_scope: UNAPPROVED
    harbor_credentials_profile: data
    harbor_private_root: /UNCONFIGURED/private
    harbor_credentials_manifest: /UNCONFIGURED/private/data-credentials.json
    harbor_kubeconfig: /UNCONFIGURED/private/kubeconfig
    harbor_kubectl: /usr/bin/kubectl
    harbor_context: UNCONFIGURED
    harbor_expected_api: https://UNCONFIGURED.invalid:6443
    harbor_expected_cluster_uid: UNCONFIGURED
    harbor_expected_namespace_uid: UNCONFIGURED
    harbor_public_ca_sha256: []
    harbor_database_ca_sha256: UNCONFIGURED
    harbor_valkey_ca_sha256: UNCONFIGURED
    harbor_identity_ca_sha256: UNCONFIGURED
  tasks:
  - ansible.builtin.debug:
      msg: 'Default/check mode reads no private inputs and contacts no API. Explicit delivery only creates absent exact Secrets after all-target preflight; no rotation or adoption.'
  - when: harbor_delivery_run | bool and not ansible_check_mode
    no_log: true
    block:
    - ansible.builtin.assert:
        that:
        - harbor_credentials_profile in ['data','application']
        - harbor_delivery_scope == 'harbor-' + harbor_credentials_profile + '-credential-delivery-v1'
        - harbor_context != 'UNCONFIGURED' and harbor_context | length > 0
        - harbor_kubectl is match('^/') and harbor_kubectl | realpath == harbor_kubectl
        - harbor_expected_api is match('^https://[A-Za-z0-9.:-]+$') and 'UNCONFIGURED' not in harbor_expected_api
        - harbor_expected_cluster_uid is match('^[a-zA-Z0-9-]{8,64}$') and harbor_expected_cluster_uid != 'UNCONFIGURED'
        - harbor_expected_namespace_uid is match('^[a-zA-Z0-9-]{8,64}$') and harbor_expected_namespace_uid != 'UNCONFIGURED'
    - ansible.builtin.command:
        argv: [id, -u]
      changed_when: false
      register: harbor_effective_uid
    - ansible.builtin.include_tasks: tasks/guard-path.yaml
      vars:
        harbor_guard_path: '{{ item }}'
      loop: '{{ [harbor_kubeconfig, harbor_credentials_manifest] }}'
    - ansible.builtin.include_tasks: tasks/contracts.yaml
    - ansible.builtin.set_fact:
        harbor_contract: '{{ harbor_contracts[harbor_credentials_profile] }}'
        harbor_manifest: "{{ lookup('file', harbor_credentials_manifest, rstrip=false) | from_json }}"
        harbor_kubectl_argv: '{{ [harbor_kubectl, "--kubeconfig", harbor_kubeconfig, "--context", harbor_context, "--request-timeout=20s"] }}'
        cacheable: false
    - ansible.builtin.assert:
        that: harbor_manifest | harbor_manifest_valid(harbor_contract, harbor_expected_namespace_uid, harbor_credentials_profile, harbor_public_ca_sha256, harbor_database_ca_sha256, harbor_valkey_ca_sha256, harbor_identity_ca_sha256)
    - ansible.builtin.command:
        argv: "{{ harbor_kubectl_argv + ['config','view','--minify','-o','json'] }}"
      changed_when: false
      register: harbor_delivery_api
    - ansible.builtin.assert:
        that: (harbor_delivery_api.stdout | from_json) | harbor_kubeconfig_valid(harbor_context, harbor_expected_api)
    - ansible.builtin.command:
        argv: "{{ harbor_kubectl_argv + ['get','namespace','kube-system','-o','jsonpath={.metadata.uid}'] }}"
      changed_when: false
      register: harbor_delivery_cluster
    - ansible.builtin.assert:
        that: harbor_delivery_cluster.stdout == harbor_expected_cluster_uid
    - ansible.builtin.command:
        argv: "{{ harbor_kubectl_argv + ['get','namespace','harbor','-o','json'] }}"
      changed_when: false
      register: harbor_delivery_namespace
    - ansible.builtin.assert:
        that: (harbor_delivery_namespace.stdout | from_json) | harbor_namespace_valid(harbor_expected_namespace_uid)
    - name: Read every target before any write
      ansible.builtin.command:
        argv: "{{ harbor_kubectl_argv + ['get','secret',item.metadata.name,'-n','harbor','--ignore-not-found','-o','json'] }}"
      loop: "{{ harbor_manifest['items'] }}"
      changed_when: false
      register: harbor_delivery_before
    - ansible.builtin.assert:
        that: (item.stdout | from_json) | harbor_secret_matches(item.item)
      loop: '{{ harbor_delivery_before.results }}'
      when: item.stdout | length > 0
    - name: Server-side dry run of every absent target before any create
      ansible.builtin.command:
        argv: "{{ harbor_kubectl_argv + ['create','--dry-run=server','-f','-','-o','json'] }}"
        stdin: '{{ item.item | to_json }}'
        stdin_add_newline: false
      loop: '{{ harbor_delivery_before.results }}'
      when: item.stdout | length == 0
      changed_when: false
      register: harbor_delivery_dryrun
    - ansible.builtin.assert:
        that: (item.stdout | from_json) | harbor_secret_matches(item.item.item, false)
      loop: '{{ harbor_delivery_dryrun.results }}'
      when: not (item.skipped | default(false))
    - name: Create and immediately verify each object, stopping before later objects on failure
      ansible.builtin.include_tasks: tasks/deliver-object.yaml
      loop: '{{ harbor_delivery_before.results }}'
      loop_control:
        loop_var: harbor_delivery_object
    always:
    - ansible.builtin.set_fact:
        harbor_manifest: {}
        harbor_delivery_api: {}
        harbor_delivery_before: {}
        harbor_delivery_readback: {}
        harbor_delivery_dryrun: {}
        cacheable: false
      no_log: true
