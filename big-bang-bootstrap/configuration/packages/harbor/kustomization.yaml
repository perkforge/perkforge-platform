apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- name: values-harbor-candidate
  namespace: bigbang
  files: [values.yaml=candidate-values.yaml]
- name: values-harbor-data
  namespace: bigbang
  files: [values.yaml=data-connections-values.yaml]
generatorOptions:
  disableNameSuffixHash: true
