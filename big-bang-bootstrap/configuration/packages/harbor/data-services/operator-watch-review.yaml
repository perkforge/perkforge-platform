# Public patch proposal only, not included in any Kustomization.
# Apply both settings together only after the additive Harbor Role is approved.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: platform-cnpg, namespace: bigbang}
spec:
  values:
    config:
      data:
        WATCH_NAMESPACE: gitlab,tenant-home-nextcloud,harbor
  postRenderers:
  - kustomize:
      patches:
      - target: {kind: Deployment, name: platform-cnpg}
        patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: platform-cnpg, namespace: cnpg-system}
          spec:
            template:
              spec:
                containers:
                - name: manager
                  env:
                  - name: WATCH_NAMESPACE
                    value: gitlab,tenant-home-nextcloud,harbor
