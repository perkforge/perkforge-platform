# Data-only ingress policy. This is not an application egress/transport policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: harbor-data-default-deny-ingress, namespace: harbor}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: harbor-postgres-from-core, namespace: harbor}
spec:
  podSelector: {matchLabels: {cnpg.io/cluster: harbor-postgres}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: harbor, release: harbor, component: core}}
    ports: [{protocol: TCP, port: 5432}]
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
      podSelector: {matchLabels: {app.kubernetes.io/instance: platform-cnpg, app.kubernetes.io/name: cloudnative-pg}}
    ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: harbor-valkey-from-components, namespace: harbor}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/instance: harbor-valkey, app.kubernetes.io/name: valkey}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app: harbor, release: harbor}
        matchExpressions:
        - key: component
          operator: In
          values: [core, jobservice, registry]
    ports: [{protocol: TCP, port: 6379}]
