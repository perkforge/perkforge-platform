# Dedicated TLS-only authenticated cache, never the accepted GitLab instance.
fullnameOverride: harbor-valkey
nodeSelector: {storage.perkforge.io/worker: 'true'}
deploymentStrategy: Recreate
image:
  registry: docker.io
  repository: valkey/valkey
  tag: 7.2.15@sha256:828b1cbb1c258e02b9cd9588063fa997e097444e610d3f3c00d43e21400e2b8d
replica: {enabled: false}
auth:
  enabled: true
  usersExistingSecret: harbor-valkey-acl
  aclUsers:
    default:
      permissions: '~* &* +@all'
      passwordKey: default
valkeyConfig: |
  maxmemory 128mb
  maxmemory-policy noeviction
  appendonly yes
  appendfsync everysec
dataStorage:
  enabled: true
  requestedSize: 2Gi
  className: longhorn-dedicated
  keepPvc: true
tls:
  enabled: true
  existingSecret: harbor-valkey-tls
  serverPublicKey: tls.crt
  serverKey: tls.key
  caPublicKey: ca.crt
  requireClientCertificate: false
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
initResources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
metrics: {enabled: false}
