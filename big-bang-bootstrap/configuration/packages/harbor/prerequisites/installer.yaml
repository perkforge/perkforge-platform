# Owner-admin prerequisite only; app installer has no cluster authority.
apiVersion: v1
kind: Namespace
metadata:
  name: harbor
  labels:
    perkforge.io/owner: harbor-foundation-v1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-installer
  namespace: bigbang
  labels:
    perkforge.io/owner: harbor-data-foundation-v1
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-installer
  namespace: harbor
  labels:
    perkforge.io/owner: harbor-data-foundation-v1
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  - configmaps
  - services
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-installer
  namespace: harbor
  labels:
    perkforge.io/owner: harbor-data-foundation-v1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-installer
subjects:
- kind: ServiceAccount
  name: harbor-installer
  namespace: bigbang
