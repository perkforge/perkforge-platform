# Inactive candidate; no apply path while host/DB/capacity gates remain.
apiVersion: v1
kind: Namespace
metadata: {name: sonarqube}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: sonarqube-installer, namespace: sonarqube}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: sonarqube-installer, namespace: sonarqube}
rules:
- apiGroups: ['']
  resources: [secrets, configmaps, services, serviceaccounts, persistentvolumeclaims]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [apps]
  resources: [statefulsets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: sonarqube-installer, namespace: sonarqube}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sonarqube-installer}
subjects:
- {kind: ServiceAccount, name: sonarqube-installer, namespace: sonarqube}
