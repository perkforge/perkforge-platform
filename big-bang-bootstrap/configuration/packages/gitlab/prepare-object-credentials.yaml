# Local protected assembly only; no keys/buckets or backup jobs are created.
- name: Assemble existing GitLab object-store credentials privately
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gitlab_object_credentials_run: false
    gitlab_object_credentials_scope: UNAPPROVED
    gitlab_object_endpoint: https://gitlab-objects.UNCONFIGURED.invalid
    gitlab_object_access_key_file: /UNCONFIGURED/access-key
    gitlab_object_secret_key_file: /UNCONFIGURED/secret-key
    gitlab_object_output_directory: /UNCONFIGURED/private-output
  tasks:
  - ansible.builtin.debug:
      msg: 'Default/check mode writes nothing. One private Secret manifest from existing keys only; no API contact, issuance, bucket permissions, backup, drive access or rotation.'
  - when: gitlab_object_credentials_run | bool and not ansible_check_mode
    no_log: true
    block:
    - ansible.builtin.assert:
        that:
        - gitlab_object_credentials_scope == 'gitlab-object-private-assembly-v1'
        - gitlab_object_endpoint is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
        - "'UNCONFIGURED' not in gitlab_object_endpoint"
    - ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop: '{{ [gitlab_object_access_key_file,gitlab_object_secret_key_file,gitlab_object_output_directory] }}'
      register: gitlab_object_files
    - ansible.builtin.assert:
        that:
        - item.item is match('^/') and item.item | realpath == item.item
        - not (item.stat.islnk | default(false))
        - item.stat.pw_name == lookup('env','USER')
      loop: '{{ gitlab_object_files.results }}'
    - ansible.builtin.assert:
        that:
        - gitlab_object_files.results[0].stat.isreg and gitlab_object_files.results[0].stat.mode == '0600'
        - gitlab_object_files.results[1].stat.isreg and gitlab_object_files.results[1].stat.mode == '0600'
        - gitlab_object_files.results[2].stat.isdir and gitlab_object_files.results[2].stat.mode == '0700'
        - lookup('file',gitlab_object_access_key_file) | trim is match('^[A-Za-z0-9_-]{8,128}$')
        - lookup('file',gitlab_object_secret_key_file) | trim is match('^[A-Za-z0-9+/=_-]{16,512}$')
    - ansible.builtin.set_fact:
        gitlab_object_connection:
          provider: AWS
          region: garage
          endpoint: '{{ gitlab_object_endpoint }}'
          path_style: true
          aws_access_key_id: "{{ lookup('file',gitlab_object_access_key_file) | trim }}"
          aws_secret_access_key: "{{ lookup('file',gitlab_object_secret_key_file) | trim }}"
        gitlab_object_s3cfg: |
          [default]
          access_key = {{ lookup('file',gitlab_object_access_key_file) | trim }}
          secret_key = {{ lookup('file',gitlab_object_secret_key_file) | trim }}
          host_base = {{ gitlab_object_endpoint | regex_replace('^https://','') }}
          host_bucket = {{ gitlab_object_endpoint | regex_replace('^https://','') }}
          use_https = True
          check_ssl_certificate = True
          check_ssl_hostname = True
        cacheable: false
    - ansible.builtin.set_fact:
        gitlab_object_manifest:
          apiVersion: v1
          kind: List
          items:
          - apiVersion: v1
            kind: Secret
            metadata: {name: gitlab-object-store, namespace: gitlab, labels: {perkforge.io/owner: gitlab-data-v1}}
            type: Opaque
            stringData:
              connection: '{{ gitlab_object_connection | to_nice_json }}'
              s3cfg: '{{ gitlab_object_s3cfg }}'
        cacheable: false
    - ansible.builtin.stat:
        path: '{{ gitlab_object_output_directory }}/object-credentials.json'
        follow: false
      register: gitlab_object_existing
    - when: gitlab_object_existing.stat.exists
      block:
      - ansible.builtin.assert:
          that:
          - gitlab_object_existing.stat.isreg and not (gitlab_object_existing.stat.islnk | default(false))
          - gitlab_object_existing.stat.mode == '0600'
          - gitlab_object_existing.stat.pw_name == lookup('env','USER')
      - ansible.builtin.assert:
          that: lookup('file',gitlab_object_output_directory + '/object-credentials.json') | from_json == gitlab_object_manifest
    - ansible.builtin.copy:
        dest: '{{ gitlab_object_output_directory }}/object-credentials.json'
        mode: '0600'
        force: false
        content: "{{ gitlab_object_manifest | to_nice_json }}\n"
    always:
    - ansible.builtin.set_fact:
        gitlab_object_connection: {}
        gitlab_object_s3cfg: ''
        gitlab_object_manifest: {}
        cacheable: false
      no_log: true
