# S3 is reached through verified HTTPS at Traefik, never directly by CI jobs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: garage-from-traefik, namespace: gitlab}
spec:
  podSelector: {matchLabels: {app: gitlab-garage}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {app.kubernetes.io/name: rke2-traefik}
    ports: [{protocol: TCP, port: 3900}]
