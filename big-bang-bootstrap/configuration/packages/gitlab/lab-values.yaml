# Optional small-lab availability tradeoff, never root-selected or enabled here.
# CPU-only home-lab requests; preserve every memory value and burst limit.
# Two Puma workers exceeded the inherited 3G cap.
# GitLab recommends 4G for two workers: https://docs.gitlab.com/charts/charts/gitlab/webservice/#memory-requestslimits
addons:
  gitlab:
    enabled: false
    flux: {suspend: true}
    values:
      upstream:
        gitlab:
          webservice:
            minReplicas: 1
            maxReplicas: 1
            resources:
              limits: {memory: 4G}
            workhorse:
              resources:
                requests: {cpu: 100m}
          toolbox:
            resources:
              requests: {cpu: 250m}
          gitlab-shell: {minReplicas: 1, maxReplicas: 1}
          sidekiq: {minReplicas: 1, maxReplicas: 1}
          # Longhorn mounts require a registered CSI driver on the consumer node.
          gitaly:
            nodeSelector: {storage.perkforge.io/worker: 'true'}
