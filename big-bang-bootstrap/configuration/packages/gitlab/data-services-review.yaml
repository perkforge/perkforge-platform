# Review contract only; live installation is not approved.
enabled: false
review_only: true
live_apply_implemented: false
choice_approved: false
ownership: dedicated-to-gitlab
recommended_lab:
  topology: single-instance-no-service-ha
  postgres:
    provider: CloudNativePG
    supported_major_versions:
    - 17
    - 18
    preferred_major: 17
    version: '17.11'
    chart_pin: cloudnative-pg-0.29.1
    operator_version: 1.30.1
    image_digest: sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
    instances: 1
    requests:
      cpu: '1'
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 4Gi
    storage:
      class: longhorn
      size: 16Gi
    required_extensions:
    - amcheck
    - btree_gist
    - pg_trgm
    - plpgsql
    application_superuser: false
    application_secret_ref: gitlab-database
  valkey:
    provider: official-valkey-chart
    minimum_version: '7.2'
    version: 7.2.15
    chart_pin: valkey-0.12.1
    image_digest: sha256:828b1cbb1c258e02b9cd9588063fa997e097444e610d3f3c00d43e21400e2b8d
    mode: standalone
    replicas: 1
    eviction_policy: noeviction
    authentication_required: true
    persistence_required: true
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
    storage:
      class: longhorn
      size: 2Gi
    application_secret_ref: gitlab-redis
  object_store:
    provider: Garage
    vendor_development_version: 2.2.0
    chart_pin: not-used-standalone-manifest
    source_pin: garage-v2.2.0
    image_digest: sha256:45a61ce3f7c9c24fc23d9ed2b09b27ed560ab87b34605d175d5c588f539c24e4
    kubernetes_discovery: false
    replicas: 1
    replication_factor: 1
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '1'
      memory: 2Gi
    data_storage:
      class: longhorn
      size: 32Gi
    metadata_storage:
      class: longhorn
      size: 1Gi
    application_secret_ref: gitlab-object-store
    registry_enabled: false
  database_operator:
    scope: shared-platform-with-explicit-namespace-allowlist
    crds_require_explicit_review: true
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
    architecture_approved: true
    operator_namespace: cnpg-system
    watched_namespaces:
    - gitlab
    live_installation_approved: false
  transport:
    tls_required: true
    public_ca_only: true
    skip_verification: false
  backup:
    independent_destination: owner-encrypted-external-drive
    destination_selected: true
    device_access_authorized: false
    advertised_capacity_gb: 128
    usable_capacity_verified: false
    mount_identity: UNVERIFIED
    encryption_unlock: owner-local-only
    unattended_availability: false
    require_verified_mount_and_writable_space: true
    refuse_fallback_to_workstation_root: true
    retention:
      target_verified_generations: 2
      incoming_generation_space_required: true
      minimum_free_percent: 20
      assume_compression_or_deduplication: false
      prune_before_verified_replacement: false
      capacity_or_age_approval_required: true
    restore:
      isolated_target_required: true
      source_drive_preserved: true
      bounded_test_separately_approved: false
      real_restore_passed: false
    same_cluster_object_store_is_independent: false
    preserve_rails_secrets: true
    tested_restore_required: true
    deletion_on_sso_rollback: false
  persistence:
    longhorn_replicas: 2
    data_claim_total: 51Gi
    gitaly_claim_additional: 10Gi
    logical_total_before_backup: 61Gi
    scheduled_replica_total_before_backup: 122Gi
    note: Logical sizing, not actual physical occupancy; backup/temp growth additional.
activation_blockers:
- owner choice and non-HA tradeoff
- validate pinned artifact provenance, registry access and live provider compatibility
- render operator privileges and database extensions/non-superuser bootstrap
- verify TLS/protocol compatibility, network policy enforcement and bucket access
- independently approved credential creation and protected delivery
- verify chosen external drive identity/capacity/availability and separately approve
  bounded restore acceptance
- measured per-node placement, migration/backup/surge and job headroom
