# Nondeployable review profile: external data services and credentials unresolved.
# This file is not in root valuesFrom. Enabling a Helm flag is not approval.
addons:
  gitlab:
    enabled: false
    git:
      repo: https://repo1.dso.mil/big-bang/product/packages/gitlab.git
      path: ./chart
      tag: 10.4.2-bb.0
    flux:
      suspend: true
      serviceAccountName: gitlab-installer
      storageNamespace: gitlab
      install:
        createNamespace: false
        # Override inherited final-failure remediation; preserve partial state.
        remediation: {retries: 0, remediateLastFailure: false}
      upgrade:
        cleanupOnFail: false
        remediation: {retries: 0, remediateLastFailure: false}
    # CRD discovery alone must not activate unselected app scrape integration.
    # Preserve workload metrics/annotations and installer authority; remove only these objects.
    postRenderers:
    - kustomize:
        patches:
        - target:
            group: monitoring.coreos.com
            version: v1
            kind: ServiceMonitor
            namespace: gitlab
            name: gitlab-gitaly
          patch: |-
            $patch: delete
            apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            metadata: {name: gitlab-gitaly, namespace: gitlab}
        - target:
            group: monitoring.coreos.com
            version: v1
            kind: ServiceMonitor
            namespace: gitlab
            name: gitlab-webservice
          patch: |-
            $patch: delete
            apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            metadata: {name: gitlab-webservice, namespace: gitlab}
        - target:
            group: monitoring.coreos.com
            version: v1
            kind: ServiceMonitor
            namespace: gitlab
            name: gitlab-webservice-workhorse
          patch: |-
            $patch: delete
            apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            metadata: {name: gitlab-webservice-workhorse, namespace: gitlab}
    values:
      domain: UNCONFIGURED.invalid
      istio: {enabled: false}
      bbtests: {enabled: false}
      global:
        edition: ee
        # Big Bang defaults empty both lists; hooks and workloads use different helpers.
        # Reference only the separately approved namespace Secret, never its contents.
        image:
          pullSecrets: [{name: private-registry}]
        imagePullSecrets: [{name: private-registry}]
        hosts:
          domain: UNCONFIGURED.invalid
          gitlab: {name: gitlab.UNCONFIGURED.invalid}
          registry: {name: registry.UNCONFIGURED.invalid}
        ingress: {enabled: false, configureCertmanager: false}
        gatewayApi: {enabled: false, installEnvoy: false, configureCertmanager: false}
        certificates:
          customCAs: []
        initialRootPassword: {secret: gitlab-initial-admin, key: password}
        psql:
          host: UNCONFIGURED-postgresql.invalid
          username: gitlab
          database: gitlabhq_production
          password: {secret: gitlab-database, key: password}
        redis:
          host: UNCONFIGURED-redis.invalid
          auth: {enabled: true, secret: gitlab-redis, key: password}
        appConfig:
          omniauth: {enabled: false}
          object_store:
            enabled: true
            connection: {secret: gitlab-object-store, key: connection}
          lfs: {bucket: gitlab-lfs}
          artifacts: {bucket: gitlab-artifacts}
          uploads: {bucket: gitlab-uploads}
          packages: {bucket: gitlab-packages}
          externalDiffs: {bucket: gitlab-diffs}
          terraformState: {bucket: gitlab-terraform}
          ciSecureFiles: {bucket: gitlab-securefiles}
          dependencyProxy: {bucket: gitlab-dependencyproxy}
      upstream:
        installCertmanager: false
        nginx-ingress: {enabled: false}
        nginx-ingress-geo: {enabled: false}
        traefik: {install: false}
        haproxy: {install: false}
        prometheus: {install: false}
        gitlab-runner: {install: false}
        gitlab-zoekt: {install: false}
        openbao: {install: false}
        ai-gateway: {install: false}
        registry: {enabled: false}
        gitlab:
          webservice:
            image:
              tag: v19.4.2-ubi@sha256:023ca782c03d12ca653e86bcb1b6bb03ba175a0ee29cef95f8bc425f8055e9c3
          kas: {enabled: false}
          gitaly:
            persistence: {enabled: true, storageClass: longhorn, size: 10Gi}
