# Unselected suspended Valkey; shared CNPG is a separate platform foundation.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gitlab-valkey
  namespace: bigbang
spec:
  interval: 1h
  url: https://valkey.io/valkey-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-valkey
  namespace: bigbang
spec:
  interval: 10m
  suspend: true
  releaseName: gitlab-valkey
  targetNamespace: gitlab
  storageNamespace: bigbang
  serviceAccountName: gitlab-data-installer
  chart:
    spec:
      chart: valkey
      version: 0.12.1
      sourceRef:
        kind: HelmRepository
        name: gitlab-valkey
        namespace: bigbang
  valuesFrom:
  - kind: ConfigMap
    name: values-gitlab-valkey
    valuesKey: values.yaml
  # Preserve explicit null in Helm's desired manifest so upgrading an API-defaulted
  # RollingUpdate Deployment to Recreate clears the forbidden old strategy fields.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: gitlab-valkey
        patch: "- op: add\n  path: /spec/strategy/rollingUpdate\n  value: null\n"
  install:
    createNamespace: false
    crds: Skip
    remediation:
      retries: 0
  upgrade:
    crds: Skip
    remediation:
      retries: 0
  uninstall:
    keepHistory: true
