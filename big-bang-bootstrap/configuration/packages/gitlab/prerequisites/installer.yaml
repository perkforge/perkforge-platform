# Inactive owner-admin foundation; no live delegation approved.
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
  labels:
    perkforge.io/owner: gitlab-foundation-v1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-installer
  namespace: bigbang
  labels:
    perkforge.io/owner: gitlab-foundation-v1
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-installer
  namespace: gitlab
  labels:
    perkforge.io/owner: gitlab-foundation-v1
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - secrets
  - services
  - serviceaccounts
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  resourceNames:
  - gitlab-shared-secrets
  verbs:
  - get
  - list
  - watch
  - update
  - patch
  - delete
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  resourceNames:
  - gitlab-shared-secrets
  verbs:
  - bind
  - escalate
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-installer
  namespace: gitlab
  labels:
    perkforge.io/owner: gitlab-foundation-v1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-installer
subjects:
- kind: ServiceAccount
  name: gitlab-installer
  namespace: bigbang
