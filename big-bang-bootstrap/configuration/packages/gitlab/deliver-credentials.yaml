# Create-only dedicated Secret delivery. All credential values stay in private stdin.
- name: Deliver exactly the prepared GitLab credential objects
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gitlab_delivery_run: false
    gitlab_delivery_profile: application
    gitlab_delivery_scope: UNAPPROVED
    gitlab_kubectl: /usr/bin/kubectl
    gitlab_kubeconfig: /UNCONFIGURED/kubeconfig
    gitlab_context: UNCONFIGURED
    gitlab_expected_api: https://UNCONFIGURED.invalid:6443
    gitlab_expected_cluster_uid: UNCONFIGURED
    gitlab_credentials_manifest: /UNCONFIGURED/application-credentials.json
  tasks:
  - ansible.builtin.debug:
      msg: 'Default/check mode contacts no API. Delivery creates missing dedicated Secrets only; no rotation, namespace creation, grant, registration or deployment.'
  - when: gitlab_delivery_run | bool and not ansible_check_mode
    no_log: true
    block:
    - ansible.builtin.assert:
        that:
        - gitlab_delivery_profile in ['application','runner','object-store','foundation','tls-web','tls-objects','tls-valkey','registry-gitlab','registry-manager','registry-job']
        - gitlab_delivery_scope == ('gitlab-' + gitlab_delivery_profile + '-credential-delivery-v1' if gitlab_delivery_profile in ['application','runner'] else ('gitlab-object-credential-delivery-v1' if gitlab_delivery_profile == 'object-store' else ('gitlab-foundation-credential-delivery-v1' if gitlab_delivery_profile == 'foundation' else 'gitlab-' + gitlab_delivery_profile + '-delivery-v1')))
        - gitlab_context != 'UNCONFIGURED'
        - gitlab_kubectl is match('^/')
        - gitlab_expected_api is match('^https://[A-Za-z0-9.:-]+$')
        - "'UNCONFIGURED' not in gitlab_expected_api"
        - gitlab_expected_cluster_uid != 'UNCONFIGURED' and gitlab_expected_cluster_uid | length > 8
    - ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop: '{{ [gitlab_kubeconfig,gitlab_credentials_manifest] }}'
      register: gitlab_delivery_files
    - ansible.builtin.assert:
        that:
        - item.item is match('^/') and item.item | realpath == item.item
        - item.stat.isreg | default(false)
        - not (item.stat.islnk | default(false))
        - item.stat.mode == '0600'
        - item.stat.pw_name == lookup('env','USER')
      loop: '{{ gitlab_delivery_files.results }}'
    - ansible.builtin.command:
        argv: ['{{ gitlab_kubectl }}', --kubeconfig, '{{ gitlab_kubeconfig }}', --context, '{{ gitlab_context }}', config, view, --minify, '-o', 'jsonpath={.clusters[0].cluster.server}']
      changed_when: false
      register: gitlab_delivery_api
    - ansible.builtin.assert:
        that: [gitlab_delivery_api.stdout == gitlab_expected_api]
    - ansible.builtin.command:
        argv: ['{{ gitlab_kubectl }}', --kubeconfig, '{{ gitlab_kubeconfig }}', --context, '{{ gitlab_context }}', --request-timeout=20s, get, namespace, kube-system, -o, 'jsonpath={.metadata.uid}']
      changed_when: false
      register: gitlab_delivery_cluster
    - ansible.builtin.assert:
        that: [gitlab_delivery_cluster.stdout == gitlab_expected_cluster_uid]
    - ansible.builtin.set_fact:
        gitlab_delivery_list: "{{ lookup('file',gitlab_credentials_manifest) | from_json }}"
        gitlab_delivery_contract:
          gitlab-database: {namespace: gitlab, owner: gitlab-data-v1, type: kubernetes.io/basic-auth, keys: [password, username]}
          gitlab-valkey-acl: {namespace: gitlab, owner: gitlab-data-v1, type: Opaque, keys: [default]}
          gitlab-redis: {namespace: gitlab, owner: gitlab-data-v1, type: Opaque, keys: [password]}
          gitlab-oidc-provider: {namespace: gitlab, owner: gitlab-sso-v1, type: Opaque, keys: [provider]}
        cacheable: false
    - ansible.builtin.set_fact:
        gitlab_delivery_contract:
          gitlab-runner-auth: {namespace: gitlab-runner, owner: gitlab-runner-v1, type: Opaque, keys: [runner-registration-token, runner-token]}
      when: gitlab_delivery_profile == 'runner'
    - ansible.builtin.set_fact:
        gitlab_delivery_contract:
          gitlab-object-store: {namespace: gitlab, owner: gitlab-data-v1, type: Opaque, keys: [connection, s3cfg]}
      when: gitlab_delivery_profile == 'object-store'
    - ansible.builtin.set_fact:
        gitlab_delivery_contract:
          gitlab-initial-admin: {namespace: gitlab, owner: gitlab-recovery-v1, type: Opaque, keys: [password]}
          gitlab-garage-private: {namespace: gitlab, owner: gitlab-data-v1, type: Opaque, keys: [adminToken, rpcSecret]}
      when: gitlab_delivery_profile == 'foundation'
    - ansible.builtin.set_fact:
        gitlab_delivery_contract: "{{ {gitlab_tls_contract[gitlab_delivery_profile].name: gitlab_tls_contract[gitlab_delivery_profile].contract} }}"
      vars:
        gitlab_tls_contract:
          tls-web:
            name: gitlab-local-tls
            contract: {namespace: gitlab, owner: gitlab-transport-v1, type: kubernetes.io/tls, keys: [tls.crt, tls.key]}
          tls-objects:
            name: gitlab-objects-local-tls
            contract: {namespace: gitlab, owner: gitlab-transport-v1, type: kubernetes.io/tls, keys: [tls.crt, tls.key]}
          tls-valkey:
            name: gitlab-valkey-tls
            contract: {namespace: gitlab, owner: gitlab-transport-v1, type: Opaque, keys: [ca.crt, tls.crt, tls.key]}
      when: gitlab_delivery_profile in ['tls-web','tls-objects','tls-valkey']
    - ansible.builtin.set_fact:
        gitlab_delivery_contract:
          private-registry:
            namespace: "{{ {'registry-gitlab':'gitlab','registry-manager':'gitlab-runner','registry-job':'gitlab-ci-platform'}[gitlab_delivery_profile] }}"
            owner: gitlab-registry-v1
            type: kubernetes.io/dockerconfigjson
            keys: [.dockerconfigjson]
      when: gitlab_delivery_profile in ['registry-gitlab','registry-manager','registry-job']
    - ansible.builtin.assert:
        that:
        - gitlab_delivery_list.apiVersion == 'v1' and gitlab_delivery_list.kind == 'List'
        - gitlab_delivery_list['items'] | length == gitlab_delivery_contract | length
        - (gitlab_delivery_list['items'] | map(attribute='metadata.name') | sort) == (gitlab_delivery_contract.keys() | sort)
    - ansible.builtin.assert:
        that:
        - item.apiVersion == 'v1' and item.kind == 'Secret'
        - item.keys() | sort == ['apiVersion','kind','metadata','stringData','type']
        - item.metadata.keys() | sort == ['labels','name','namespace']
        - item.metadata.namespace == gitlab_delivery_contract[item.metadata.name].namespace
        - item.metadata.labels == {'perkforge.io/owner':gitlab_delivery_contract[item.metadata.name].owner}
        - item.type == gitlab_delivery_contract[item.metadata.name].type
        - item.stringData.keys() | sort == gitlab_delivery_contract[item.metadata.name]['keys'] | sort
      loop: "{{ gitlab_delivery_list['items'] }}"
    - ansible.builtin.command:
        argv: ['{{ gitlab_kubectl }}', --kubeconfig, '{{ gitlab_kubeconfig }}', --context, '{{ gitlab_context }}', --request-timeout=20s, get, secret, '{{ item.metadata.name }}', -n, '{{ item.metadata.namespace }}', --ignore-not-found, -o, json]
      changed_when: false
      loop: "{{ gitlab_delivery_list['items'] }}"
      register: gitlab_delivery_before
    - name: Refuse any foreign object or implicit credential rotation before writes
      ansible.builtin.assert:
        that:
        - (item.stdout | from_json).metadata.labels == item.item.metadata.labels
        - (item.stdout | from_json).type == item.item.type
        - (item.stdout | from_json).immutable | default(false)
        - ((item.stdout | from_json).data | dict2items | map(attribute='key') | sort) == (item.item.stringData.keys() | sort)
        - (item.stdout | from_json).data == dict(item.item.stringData.keys() | zip(item.item.stringData.values() | map('b64encode')))
      loop: '{{ gitlab_delivery_before.results }}'
      when: item.stdout | length > 0
    - ansible.builtin.command:
        argv: ['{{ gitlab_kubectl }}', --kubeconfig, '{{ gitlab_kubeconfig }}', --context, '{{ gitlab_context }}', --request-timeout=20s, create, -f, '-']
        stdin: "{{ item.item | combine({'immutable':true}) | to_json }}"
      loop: '{{ gitlab_delivery_before.results }}'
      when: item.stdout | length == 0
    - ansible.builtin.command:
        argv: ['{{ gitlab_kubectl }}', --kubeconfig, '{{ gitlab_kubeconfig }}', --context, '{{ gitlab_context }}', --request-timeout=20s, get, secret, '{{ item.metadata.name }}', -n, '{{ item.metadata.namespace }}', -o, json]
      changed_when: false
      loop: "{{ gitlab_delivery_list['items'] }}"
      register: gitlab_delivery_after
    - ansible.builtin.assert:
        that:
        - (item.stdout | from_json).metadata.labels == item.item.metadata.labels
        - (item.stdout | from_json).type == item.item.type
        - (item.stdout | from_json).immutable
        - (item.stdout | from_json).data == dict(item.item.stringData.keys() | zip(item.item.stringData.values() | map('b64encode')))
      loop: '{{ gitlab_delivery_after.results }}'
    always:
    - ansible.builtin.set_fact:
        gitlab_delivery_list: {}
        gitlab_delivery_before: {}
        gitlab_delivery_after: {}
        cacheable: false
      no_log: true
