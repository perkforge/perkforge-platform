# Local protected assembly only. Never contacts Kubernetes, GitLab or Keycloak.
- name: Prepare private GitLab credential manifests from existing operator inputs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gitlab_credentials_run: false
    gitlab_credentials_scope: UNAPPROVED
    gitlab_credentials_profile: application
    gitlab_credentials_output_dir: /UNCONFIGURED/private-output
    gitlab_origin: https://gitlab.UNCONFIGURED.invalid
    gitlab_issuer: https://identity.UNCONFIGURED.invalid/auth/realms/perkforge
    gitlab_client_id: gitlab
    gitlab_database_password_file: /UNCONFIGURED/database-password
    gitlab_valkey_password_file: /UNCONFIGURED/valkey-password
    gitlab_client_secret_file: /UNCONFIGURED/client-secret
    gitlab_runner_token_file: /UNCONFIGURED/runner-token
  tasks:
  - ansible.builtin.debug:
      msg: 'Private local assembly only; default/check mode writes nothing. No credential generation, rotation, delivery, user grant or registration.'
  - when: gitlab_credentials_run | bool and not ansible_check_mode
    no_log: true
    block:
    - ansible.builtin.assert:
        that:
        - gitlab_credentials_profile in ['application','runner']
        - gitlab_credentials_scope == 'gitlab-' + gitlab_credentials_profile + '-private-assembly-v1'
        - gitlab_credentials_output_dir is match('^/')
        - "'UNCONFIGURED' not in gitlab_credentials_output_dir"
        - gitlab_credentials_output_dir | realpath == gitlab_credentials_output_dir
    - ansible.builtin.assert:
        that:
        - gitlab_origin is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
        - gitlab_issuer is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?(/auth)?/realms/perkforge$')
        - "'UNCONFIGURED' not in gitlab_origin and 'UNCONFIGURED' not in gitlab_issuer"
        - gitlab_client_id == 'gitlab'
      when: gitlab_credentials_profile == 'application'
    - ansible.builtin.stat:
        path: '{{ gitlab_credentials_output_dir }}'
        follow: false
      register: gitlab_private_output
    - ansible.builtin.assert:
        that:
        - gitlab_private_output.stat.isdir | default(false)
        - not (gitlab_private_output.stat.islnk | default(false))
        - gitlab_private_output.stat.mode == '0700'
        - gitlab_private_output.stat.pw_name == lookup('env','USER')
    - ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop: "{{ [gitlab_database_password_file,gitlab_valkey_password_file,gitlab_client_secret_file] if gitlab_credentials_profile == 'application' else [gitlab_runner_token_file] }}"
      register: gitlab_private_inputs
    - ansible.builtin.assert:
        that:
        - item.item is match('^/') and item.item | realpath == item.item
        - item.stat.isreg | default(false)
        - not (item.stat.islnk | default(false))
        - item.stat.mode == '0600'
        - item.stat.pw_name == lookup('env','USER')
        - item.stat.size > 0 and item.stat.size < 4096
      loop: '{{ gitlab_private_inputs.results }}'
    - ansible.builtin.set_fact:
        gitlab_provider:
          name: openid_connect
          label: PerkForge
          args:
            name: openid_connect
            issuer: '{{ gitlab_issuer }}'
            discovery: true
            response_type: code
            scope: [openid, profile, email]
            pkce: true
            uid_field: sub
            client_auth_method: basic
            client_options:
              identifier: '{{ gitlab_client_id }}'
              redirect_uri: '{{ gitlab_origin }}/users/auth/openid_connect/callback'
              secret: "{{ lookup('file',gitlab_client_secret_file) | trim }}"
        cacheable: false
      when: gitlab_credentials_profile == 'application'
    - ansible.builtin.assert:
        that:
        - lookup('file',gitlab_database_password_file) | trim | length >= 16
        - lookup('file',gitlab_valkey_password_file) | trim | length >= 16
        - lookup('file',gitlab_client_secret_file) | trim | length >= 16
      when: gitlab_credentials_profile == 'application'
    - ansible.builtin.assert:
        that: lookup('file',gitlab_runner_token_file) | trim is match('^glrt-[A-Za-z0-9_-]+(?:[.]01[.][0-9a-z]{9})?\\Z')
      when: gitlab_credentials_profile == 'runner'
    - ansible.builtin.set_fact:
        gitlab_private_manifests:
        - apiVersion: v1
          kind: Secret
          metadata: {name: gitlab-database, namespace: gitlab, labels: {perkforge.io/owner: gitlab-data-v1}}
          type: kubernetes.io/basic-auth
          stringData:
            username: gitlab
            password: "{{ lookup('file',gitlab_database_password_file) | trim }}"
        - apiVersion: v1
          kind: Secret
          metadata: {name: gitlab-valkey-acl, namespace: gitlab, labels: {perkforge.io/owner: gitlab-data-v1}}
          type: Opaque
          stringData:
            default: "{{ lookup('file',gitlab_valkey_password_file) | trim }}"
        - apiVersion: v1
          kind: Secret
          metadata: {name: gitlab-redis, namespace: gitlab, labels: {perkforge.io/owner: gitlab-data-v1}}
          type: Opaque
          stringData:
            password: "{{ lookup('file',gitlab_valkey_password_file) | trim }}"
        - apiVersion: v1
          kind: Secret
          metadata: {name: gitlab-oidc-provider, namespace: gitlab, labels: {perkforge.io/owner: gitlab-sso-v1}}
          type: Opaque
          stringData:
            provider: '{{ gitlab_provider | to_nice_json }}'
        cacheable: false
      when: gitlab_credentials_profile == 'application'
    - ansible.builtin.set_fact:
        gitlab_private_manifests:
        - apiVersion: v1
          kind: Secret
          metadata: {name: gitlab-runner-auth, namespace: gitlab-runner, labels: {perkforge.io/owner: gitlab-runner-v1}}
          type: Opaque
          stringData:
            runner-token: "{{ lookup('file',gitlab_runner_token_file) | trim }}"
            runner-registration-token: ''
        cacheable: false
      when: gitlab_credentials_profile == 'runner'
    - ansible.builtin.stat:
        path: '{{ gitlab_credentials_output_dir }}/{{ gitlab_credentials_profile }}-credentials.json'
        follow: false
      register: gitlab_output_file
    - when: gitlab_output_file.stat.exists
      block:
      - ansible.builtin.assert:
          that:
          - gitlab_output_file.stat.isreg and not (gitlab_output_file.stat.islnk | default(false))
          - gitlab_output_file.stat.mode == '0600'
          - gitlab_output_file.stat.pw_name == lookup('env','USER')
      - ansible.builtin.slurp:
          src: '{{ gitlab_credentials_output_dir }}/{{ gitlab_credentials_profile }}-credentials.json'
        register: gitlab_output_existing
      - ansible.builtin.assert:
          that:
          - (gitlab_output_existing.content | b64decode | from_json) == {'apiVersion':'v1','kind':'List','items':gitlab_private_manifests}
          fail_msg: 'Existing private output differs. Refuse implicit rotation or overwrite.'
    - ansible.builtin.copy:
        dest: '{{ gitlab_credentials_output_dir }}/{{ gitlab_credentials_profile }}-credentials.json'
        mode: '0600'
        force: false
        content: "{{ {'apiVersion':'v1','kind':'List','items':gitlab_private_manifests} | to_nice_json }}\n"
    always:
    - ansible.builtin.set_fact:
        gitlab_private_manifests: []
        gitlab_provider: {}
        gitlab_output_existing: {}
        cacheable: false
      no_log: true
