# Apply only after explicit approval; no create or Secret privilege for root reconciler.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: platform-deployment-notifications, namespace: flux-system}
rules:
- apiGroups: [notification.toolkit.fluxcd.io]
  resources: [providers, alerts]
  resourceNames: [platform-deployments]
  verbs: [get, list, watch, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: platform-deployment-notifications, namespace: flux-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-deployment-notifications}
subjects:
- {kind: ServiceAccount, name: platform-reconciler, namespace: flux-system}
