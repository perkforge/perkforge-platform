apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alloy-log-delivery
  namespace: alloy
  labels:
    app.kubernetes.io/part-of: perkforge-observability
spec:
  namespaceSelector:
    matchNames: [alloy]
  selector:
    matchLabels:
      app.kubernetes.io/instance: alloy-alloy-logs
      app.kubernetes.io/name: alloy-logs
  endpoints:
  - port: http-metrics
    path: /metrics
    scheme: http
    interval: 30s
    scrapeTimeout: 10s
    metricRelabelings:
    - sourceLabels: [__name__]
      action: keep
      regex: 'loki_write_(sent|dropped)_(bytes|entries)_total|loki_write_batch_retries_total|loki_process_dropped_lines_total'
  sampleLimit: 1000
  targetLimit: 2
