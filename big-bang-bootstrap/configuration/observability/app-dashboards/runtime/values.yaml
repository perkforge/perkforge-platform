grafana:
  values:
    # Additive maps only. Not selected/applied by rendering.
    upstream:
      dashboardProviders:
        perkforge-app-resources.yaml:
          apiVersion: 1
          providers:
          - name: perkforge-app-resources
            orgId: 1
            folder: Platform Applications
            folderUid: pf-platform-apps
            type: file
            disableDeletion: true
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards/pf-app-resources
      dashboards:
        pf-app-resources:
          nextcloud:
            json: |
              {
                "uid": "pf-app-nextcloud",
                "title": "Nextcloud \u2014 Resources and network",
                "schemaVersion": 41,
                "version": 1,
                "editable": false,
                "refresh": "1m",
                "time": {
                  "from": "now-1h",
                  "to": "now"
                },
                "tags": [
                  "perkforge",
                  "platform-app-resources"
                ],
                "panels": [
                  {
                    "id": 1,
                    "type": "text",
                    "title": "Scope and unavailable data",
                    "gridPos": {
                      "x": 0,
                      "y": 0,
                      "w": 24,
                      "h": 4
                    },
                    "options": {
                      "mode": "markdown",
                      "content": "Platform-only namespace application inventory. Includes supporting workloads/jobs in these exact namespaces; not cross-namespace HTTP attribution. No data means unavailable, never zero or healthy. Missing limits may make totals partial. Pod network uses one sandbox interface series, excludes hostNetwork and loopback; it is bytes, not requests/users. HTTP rate/errors/latency unavailable: no verified app-attributed exporter. PVC panels show claims in the application namespaces, not per-pod additive copies. Review sample age and upstream scrape health. This dashboard does not grant access or enforce tenant isolation."
                    }
                  },
                  {
                    "id": 2,
                    "type": "timeseries",
                    "title": "CPU cores",
                    "gridPos": {
                      "x": 0,
                      "y": 4,
                      "w": 12,
                      "h": 7
                    },
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "fieldConfig": {
                      "defaults": {
                        "unit": "cores",
                        "noValue": "Unavailable",
                        "custom": {
                          "spanNulls": false
                        }
                      },
                      "overrides": []
                    },
                    "targets": [
                      {
                        "refId": "A",
                        "expr": "sum(max by(namespace,pod,container) (rate(container_cpu_usage_seconds_total{namespace=~\"tenant-home-nextcloud\",job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",container!=\"\",container!=\"POD\"}[5m])))",
                        "range": true,
                        "legendFormat": "__auto",
                        "datasource": {
                          "type": "prometheus",
                          "uid": "prometheus"
                        }
                      }
                    ]
                  },
                  {
                    "id": 3,
                    "type": "timeseries",
                    "title": "CPU requests",
                    "gridPos": {
                      "x": 12,
                      "y": 4,
                      "w": 12,
                      "h": 7
                    },
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "fieldConfig": {
                      "defaults": {
                        "unit": "cores",
                        "noValue": "Unavailable",
                        "custom": {
                          "spanNulls": false
                        }
                      },
                      "overrides": []
                    },
                    "targets": [
                      {
                        "refId": "A",
                        "expr": "sum(max by(namespace,pod,container) (kube_pod_container_resource_requests{namespace=~\"tenant-home-nextcloud\",job=\"kube-state-metrics\",resource=\"cpu\",unit=\"core\"}))",
                        "range": true,
                        "legendFormat": "__auto",
                        "datasource": {
                          "type": "prometheus",
                          "uid": "prometheus"
