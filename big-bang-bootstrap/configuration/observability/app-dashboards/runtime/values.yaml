              {
                "uid": "pf-app-query-gateway",
                "title": "Query Gateway \u2014 Resources and network",
                "schemaVersion": 41,
                "version": 1,
                "editable": false,
                "refresh": "1m",
                "time": {
                  "from": "now-1h",
