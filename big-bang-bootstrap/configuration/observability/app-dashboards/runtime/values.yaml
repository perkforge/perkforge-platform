                    "targets": [
                      {
                        "refId": "A",
                        "expr": "sum(max by(namespace,pod,container) (rate(container_cpu_usage_seconds_total{namespace=~\"harbor\",job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",container!=\"\",container!=\"POD\"}[5m])))",
