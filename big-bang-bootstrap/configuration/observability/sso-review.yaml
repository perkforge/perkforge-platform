# Nondeployable identity review; not Helm values or a realm import.
enabled: false
review_only: true
live_apply_implemented: true # default-off, separately approved operations; not live acceptance
guarded_adapter: ../authorization/sso/grafana/README.md
protocol: oidc
application: grafana
keycloak:
  realm: perkforge
  client_id: grafana
  enabled: false
  flow: authorization-code
  pkce: S256
  full_scope_allowed: false
  direct_access_grants: false
  service_accounts: false
  redirect_uri: https://grafana.UNCONFIGURED.invalid/login/generic_oauth
  claim: groups
  claim_source: bounded own-client role mappings; never every realm group
mappings:
  tenant_global_admin: false
  platform_admin: explicitly approved own-client admin role and exact subject UUID; server admin
  platform_engineer: denied in admin-only initial rollout
  platform_viewer: denied in admin-only initial rollout
  tenant_roles: disabled until org/datasource isolation and per-tenant tests
transport:
  verify_tls: true
  skip_certificate_verification: false
  public_ca_ref: UNCONFIGURED/public-ca
recovery:
  independent_local_access: true
  custody: protected external credential reference; test before SSO and rollback
activation_gates:
- separate reviewed client/app apply wiring
- owner confirmation of explicit-subject admin-only policy and action-specific live approvals
- TLS and private client Secret delivery
- data-source/org boundaries
- fresh MFA and native role tests
acceptance:
  positive:
  - explicitly granted platform admin login
  negative:
  - unmapped group denied
  - cross-tenant data denied
  - engineer and viewer denied; realm group alone does not authorize
  rollback:
  - disable only owned provider/client mapping
  - local recovery works
  - measure existing sessions/tokens
machine_components:
  prometheus:
    independent_browser_client: false
    scoped_machine_credentials: true
    operator_auth: Grafana UI or separately reviewed operator API access
    public_ingress: false
  loki:
    independent_browser_client: false
    scoped_machine_credentials: true
    operator_auth: Grafana UI or separately reviewed operator API access
    public_ingress: false
  alloy:
    independent_browser_client: false
    scoped_machine_credentials: true
    operator_auth: Grafana UI or separately reviewed operator API access
    public_ingress: false
  alertmanager:
    independent_browser_client: false
    scoped_machine_credentials: true
    operator_auth: Grafana UI or separately reviewed operator API access
    public_ingress: false
  ntfy:
    independent_browser_client: false
    scoped_machine_credentials: true
    operator_auth: Grafana UI or separately reviewed operator API access
    public_ingress: false
  velero:
    independent_browser_client: false
    scoped_machine_credentials: true
    operator_auth: kubernetes-api-rbac
    public_ingress: false
