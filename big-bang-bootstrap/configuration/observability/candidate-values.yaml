# INACTIVE implementation candidate; reviewed prerequisites/credentials/release and approval required.
monitoring:
  enabled: false
  git:
    repo: https://repo1.dso.mil/big-bang/product/packages/monitoring.git
    path: ./chart
    tag: 91.4.1-bb.1
  flux:
    suspend: true
    install:
      remediation:
        retries: 0
      createNamespace: false
    upgrade:
      remediation:
        retries: 0
    serviceAccountName: monitoring-installer
    storageNamespace: monitoring
  values:
    upstream:
      grafana:
        enabled: false
      alertmanager:
        enabled: true
        alertmanagerSpec:
          replicas: 1
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: longhorn
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
      prometheus:
        prometheusSpec:
          replicas: 1
          retention: 7d
          retentionSize: 8GB
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: longhorn
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
      prometheusOperator:
        admissionWebhooks:
          enabled: true
          certManager:
            enabled: false
          patch:
            enabled: true
            image:
              registry: ghcr.io
              repository: jkroepke/kube-webhook-certgen
              tag: 1.8.8
              sha: ''
grafana:
  enabled: false
  git:
    repo: https://repo1.dso.mil/big-bang/product/packages/grafana.git
    path: ./chart
    tag: 13.2.4-bb.0
  flux:
    suspend: true
    install:
      remediation:
        retries: 0
      createNamespace: false
    upgrade:
      remediation:
        retries: 0
    serviceAccountName: grafana-installer
    storageNamespace: monitoring
  values:
    sso:
      enabled: false
    upstream:
      replicas: 1
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      ingress:
        enabled: false
      grafana.ini:
        auth.anonymous:
          enabled: false
        auth.generic_oauth:
          enabled: false
          client_secret: null
          client_id: null
          auth_url: null
          api_url: null
          token_url: null
      rbac:
        namespaced: true
        create: false
      sidecar:
        dashboards:
          searchNamespace: monitoring
          resource: configmap
          provider:
            allowUiUpdates: false
        datasources:
          searchNamespace: monitoring
          resource: configmap
          enabled: false
      datasources:
        datasourcesbb.yaml:
          apiVersion: 1
          datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://monitoring-monitoring-kube-prometheus.monitoring.svc:9090
            editable: false
          - name: Alertmanager
            uid: alertmanager
            type: alertmanager
            access: proxy
            url: http://monitoring-monitoring-kube-alertmanager.monitoring.svc:9093
            editable: false
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false
prometheusOperatorCRDs:
  enabled: false
  git:
    repo: https://repo1.dso.mil/big-bang/product/packages/prometheus-operator-crds.git
    path: ./chart
    tag: 31.0.1-bb.0
  flux:
    suspend: true
    install:
      remediation:
        retries: 0
      createNamespace: false
    upgrade:
      remediation:
        retries: 0
    serviceAccountName: prometheus-crds-installer
    storageNamespace: monitoring
  values:
    upstream:
      crds:
        annotations:
          helm.sh/resource-policy: keep
alloy:
  enabled: false
  git:
    repo: https://repo1.dso.mil/big-bang/product/packages/alloy.git
    path: ./chart
    tag: 4.3.2-bb.2
  flux:
    suspend: true
loki:
  enabled: false
  git:
    repo: https://repo1.dso.mil/big-bang/product/packages/loki.git
    path: ./chart
    tag: 6.55.0-bb.9
  flux:
    suspend: true
