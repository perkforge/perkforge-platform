# Unselected Flux-compatible candidate. Secrets supplied separately; never generated here.
apiVersion: v1
kind: ServiceAccount
metadata: {name: tenant-query-gateway, namespace: "tenant-observability"}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: tenant-query-gateway, namespace: "tenant-observability"}
data:
  nginx.conf: |
    # Inactive standalone gateway candidate. Caller supplies protected absolute paths.
    # Never co-locate this gateway with Grafana: proxy listeners are loopback-only.
    worker_processes 1;
    pid /tmp/gateway/nginx.pid;
    error_log /tmp/gateway/error.log warn;
    events { worker_connections 128; }
    http {
        access_log off;
        client_body_temp_path /tmp/gateway/client-body;
        proxy_temp_path /tmp/gateway/proxy;
        fastcgi_temp_path /tmp/gateway/fastcgi;
        scgi_temp_path /tmp/gateway/scgi;
        uwsgi_temp_path /tmp/gateway/uwsgi;
        server {
            listen 0.0.0.0:8443 ssl;
            server_name tenant-query-gateway.tenant-observability.svc;
            ssl_certificate /etc/gateway/tls/tls.crt;
            ssl_certificate_key /etc/gateway/tls/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            client_max_body_size 64k;
            # Only these read query endpoints are reviewed. No generic proxy location.
            location = /portal/api/v1/query {
                auth_basic "tenant metrics";
                auth_basic_user_file /etc/gateway/auth/portal/htpasswd;
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_set_header Host localhost;
                proxy_connect_timeout 3s;
                proxy_read_timeout 30s;
                proxy_pass http://127.0.0.1:18081/api/v1/query;
            }
            location = /portal/api/v1/query_range {
                auth_basic "tenant metrics";
                auth_basic_user_file /etc/gateway/auth/portal/htpasswd;
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_set_header Host localhost;
                proxy_connect_timeout 3s;
                proxy_read_timeout 30s;
                proxy_pass http://127.0.0.1:18081/api/v1/query_range;
            }
            location = /platform/api/v1/query {
                auth_basic "platform metrics";
                auth_basic_user_file /etc/gateway/auth/platform/htpasswd;
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_ssl_verify on;
                proxy_ssl_trusted_certificate /etc/gateway/upstream/ca.crt;
                proxy_ssl_certificate /etc/gateway/upstream/tls.crt;
                proxy_ssl_certificate_key /etc/gateway/upstream/tls.key;
                proxy_ssl_server_name on;
                proxy_ssl_name monitoring-monitoring-kube-prometheus.monitoring.svc;
                proxy_pass https://monitoring-monitoring-kube-prometheus.monitoring.svc:9090/api/v1/query;
            }
            location = /platform/api/v1/query_range {
                auth_basic "platform metrics";
                auth_basic_user_file /etc/gateway/auth/platform/htpasswd;
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_ssl_verify on;
                proxy_ssl_trusted_certificate /etc/gateway/upstream/ca.crt;
                proxy_ssl_certificate /etc/gateway/upstream/tls.crt;
                proxy_ssl_certificate_key /etc/gateway/upstream/tls.key;
                proxy_ssl_server_name on;
                proxy_ssl_name monitoring-monitoring-kube-prometheus.monitoring.svc;
                proxy_pass https://monitoring-monitoring-kube-prometheus.monitoring.svc:9090/api/v1/query_range;
            }
            location = /platform/api/v1/labels {
                auth_basic "platform metrics";
                auth_basic_user_file /etc/gateway/auth/platform/htpasswd;
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_ssl_verify on;
                proxy_ssl_trusted_certificate /etc/gateway/upstream/ca.crt;
                proxy_ssl_certificate /etc/gateway/upstream/tls.crt;
                proxy_ssl_certificate_key /etc/gateway/upstream/tls.key;
                proxy_ssl_server_name on;
                proxy_ssl_name monitoring-monitoring-kube-prometheus.monitoring.svc;
                proxy_pass https://monitoring-monitoring-kube-prometheus.monitoring.svc:9090/api/v1/labels;
            }
            location = /platform/api/v1/series {
                auth_basic "platform metrics";
                auth_basic_user_file /etc/gateway/auth/platform/htpasswd;
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_ssl_verify on;
                proxy_ssl_trusted_certificate /etc/gateway/upstream/ca.crt;
                proxy_ssl_certificate /etc/gateway/upstream/tls.crt;
                proxy_ssl_certificate_key /etc/gateway/upstream/tls.key;
                proxy_ssl_server_name on;
                proxy_ssl_name monitoring-monitoring-kube-prometheus.monitoring.svc;
                proxy_pass https://monitoring-monitoring-kube-prometheus.monitoring.svc:9090/api/v1/series;
            }
            location = /platform/api/v1/metadata {
                auth_basic "platform metrics";
                auth_basic_user_file /etc/gateway/auth/platform/htpasswd;
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_ssl_verify on;
                proxy_ssl_trusted_certificate /etc/gateway/upstream/ca.crt;
                proxy_ssl_certificate /etc/gateway/upstream/tls.crt;
                proxy_ssl_certificate_key /etc/gateway/upstream/tls.key;
                proxy_ssl_server_name on;
                proxy_ssl_name monitoring-monitoring-kube-prometheus.monitoring.svc;
                proxy_pass https://monitoring-monitoring-kube-prometheus.monitoring.svc:9090/api/v1/metadata;
            }
            location = /platform/api/v1/status/buildinfo {
                auth_basic "platform metrics";
                auth_basic_user_file /etc/gateway/auth/platform/htpasswd;
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_ssl_verify on;
                proxy_ssl_trusted_certificate /etc/gateway/upstream/ca.crt;
                proxy_ssl_certificate /etc/gateway/upstream/tls.crt;
                proxy_ssl_certificate_key /etc/gateway/upstream/tls.key;
                proxy_ssl_server_name on;
                proxy_ssl_name monitoring-monitoring-kube-prometheus.monitoring.svc;
                proxy_pass https://monitoring-monitoring-kube-prometheus.monitoring.svc:9090/api/v1/status/buildinfo;
            }
            # Conventional Prometheus label names only; no generic path proxy.
            location ~ ^/platform/api/v1/label/[a-zA-Z_][a-zA-Z0-9_]*/values$ {
                auth_basic "platform metrics";
                auth_basic_user_file /etc/gateway/auth/platform/htpasswd;
                limit_except GET { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_ssl_verify on;
                proxy_ssl_trusted_certificate /etc/gateway/upstream/ca.crt;
                proxy_ssl_certificate /etc/gateway/upstream/tls.crt;
                proxy_ssl_certificate_key /etc/gateway/upstream/tls.key;
                proxy_ssl_server_name on;
                proxy_ssl_name monitoring-monitoring-kube-prometheus.monitoring.svc;
                rewrite ^/platform(/.*)$ $1 break;
                proxy_pass https://monitoring-monitoring-kube-prometheus.monitoring.svc:9090;
            }
            location / { return 404; }
        }
    }

---
apiVersion: v1
kind: Service
metadata: {name: tenant-query-gateway, namespace: "tenant-observability"}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: tenant-query-gateway}
  ports: [{name: https, port: 8443, targetPort: https}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tenant-query-gateway, namespace: "tenant-observability"}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: tenant-query-gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/name: tenant-query-gateway}}
    spec:
      serviceAccountName: tenant-query-gateway
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/arch: amd64}
      securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: tls-auth
        image: docker.io/library/nginx:1.31.6-alpine@sha256:0530961ff0592b58c10f767535cc0abdfccf9e389ff7cc90f87320c1bc7e8506
        command: [/usr/sbin/nginx]
        args: [-c, /etc/gateway/config/nginx.conf, -g, 'daemon off;']
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {cpu: 500m, memory: 128Mi}}
        ports: [{name: https, containerPort: 8443}]
        readinessProbe: {tcpSocket: {port: https}, periodSeconds: 5}
        volumeMounts:
        - {name: config, mountPath: /etc/gateway/config, readOnly: true}
        - {name: runtime, mountPath: /tmp/gateway}
        - {name: tls, mountPath: /etc/gateway/tls, readOnly: true}
        - {name: upstream, mountPath: /etc/gateway/upstream, readOnly: true}
        - {name: 'auth-portal', mountPath: '/etc/gateway/auth/portal', readOnly: true}
        - {name: auth-platform, mountPath: /etc/gateway/auth/platform, readOnly: true}
      - name: scope-portal
        image: quay.io/prometheuscommunity/prom-label-proxy:v0.16.2@sha256:e04529e2d4bddf7b97732befab926f84ba944631bfd8b8929534a58f086a9d2e
        command: [/bin/prom-label-proxy]
        args:
        - -insecure-listen-address=127.0.0.1:18081
        - -internal-listen-address=0.0.0.0:18091
        - -upstream=https://monitoring-monitoring-kube-prometheus.monitoring.svc:9090
        - -upstream-ca-cert=/etc/gateway/upstream/ca.crt
        - -upstream-client-cert=/etc/gateway/upstream/tls.crt
        - -upstream-client-key=/etc/gateway/upstream/tls.key
        - -label=namespace
        - -error-on-replace
        - -label-value=tenant-portal
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
        readinessProbe: {httpGet: {path: /metrics, port: 18091}, periodSeconds: 5}
        volumeMounts:
        - {name: upstream, mountPath: /etc/gateway/upstream, readOnly: true}
      volumes:
      - {name: config, configMap: {name: tenant-query-gateway}}
      - {name: runtime, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
      - {name: tls, secret: {secretName: "query-gateway-tls", defaultMode: 288}}
      - {name: upstream, secret: {secretName: "query-backend-client", defaultMode: 288}}
      - {name: 'auth-portal', secret: {secretName: "portal-query-auth", defaultMode: 288}}
      - {name: auth-platform, secret: {secretName: "platform-query-auth", defaultMode: 288}}
---
# Authentication still binds scope; source pod identity alone never grants PE access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tenant-query-gateway, namespace: "tenant-observability"}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: tenant-query-gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      podSelector: {matchLabels: {app.kubernetes.io/name: grafana, app.kubernetes.io/instance: monitoring-grafana}}
    ports: [{protocol: TCP, port: 8443}]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      podSelector: {matchLabels: {operator.prometheus.io/name: monitoring-monitoring-kube-prometheus}}
    ports: [{protocol: TCP, port: 9443}]
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# Adds only gateway-to-Prometheus access. Existing policies are additive, not replaced.
# This alone does NOT remove Grafana's current raw-backend bypass.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: prometheus-from-tenant-query-gateway, namespace: monitoring}
spec:
  podSelector: {matchLabels: {operator.prometheus.io/name: monitoring-monitoring-kube-prometheus}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: "tenant-observability"}}
      podSelector: {matchLabels: {app.kubernetes.io/name: tenant-query-gateway}}
    ports: [{protocol: TCP, port: 9443}]
