# INACTIVE: pair with backend-values.yaml and split self-monitor after review.
apiVersion: v1
kind: ConfigMap
metadata: {name: query-backend-config, namespace: monitoring}
data:
  nginx.conf: |
    # Inactive integration proof, not selected by the deployment renderer.
    # Co-locate only with Prometheus, never Grafana or tenant workloads.
    worker_processes 1;
    pid /tmp/query-backend/backend-nginx.pid;
    error_log /tmp/query-backend/backend-error.log warn;
    events { worker_connections 128; }
    http {
        access_log off;
        client_body_temp_path /tmp/query-backend/backend-body;
        proxy_temp_path /tmp/query-backend/backend-proxy;
        fastcgi_temp_path /tmp/query-backend/backend-fastcgi;
        scgi_temp_path /tmp/query-backend/backend-scgi;
        uwsgi_temp_path /tmp/query-backend/backend-uwsgi;
        server {
            listen 0.0.0.0:9443 ssl;
            ssl_certificate /etc/query-backend/tls/tls.crt;
            ssl_certificate_key /etc/query-backend/tls/tls.key;
            ssl_client_certificate /etc/query-backend/tls/ca.crt;
            ssl_verify_client on;
            ssl_protocols TLSv1.2 TLSv1.3;
            client_max_body_size 64k;
            # Query reads and authenticated self-scrape only. Never expose lifecycle.
            location = /api/v1/query {
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_connect_timeout 3s;
                proxy_read_timeout 30s;
                proxy_pass http://127.0.0.1:9090;
            }
            location = /api/v1/query_range {
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_connect_timeout 3s;
                proxy_read_timeout 30s;
                proxy_pass http://127.0.0.1:9090;
            }
            location = /api/v1/labels {
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_connect_timeout 3s;
                proxy_read_timeout 30s;
                proxy_pass http://127.0.0.1:9090;
            }
            location = /api/v1/series {
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_connect_timeout 3s;
                proxy_read_timeout 30s;
                proxy_pass http://127.0.0.1:9090;
            }
            location = /api/v1/metadata {
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_connect_timeout 3s;
                proxy_read_timeout 30s;
                proxy_pass http://127.0.0.1:9090;
            }
            location = /api/v1/status/buildinfo {
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_connect_timeout 3s;
                proxy_read_timeout 30s;
                proxy_pass http://127.0.0.1:9090;
            }
            location = /metrics {
                limit_except GET POST { deny all; }
                proxy_pass_request_headers off;
                proxy_set_header Content-Type $content_type;
                proxy_connect_timeout 3s;
                proxy_read_timeout 30s;
                proxy_pass http://127.0.0.1:9090;
            }
            location ~ ^/api/v1/label/[a-zA-Z_][a-zA-Z0-9_]*/values$ {
                limit_except GET { deny all; }
                proxy_pass_request_headers off;
                proxy_pass http://127.0.0.1:9090;
            }
            # Operator listenLocal also binds reloader HTTP metrics to loopback.
            location = /reloader/metrics {
                limit_except GET { deny all; }
                proxy_pass_request_headers off;
                proxy_pass http://127.0.0.1:8080/metrics;
            }
            location / { return 404; }
        }
    }
