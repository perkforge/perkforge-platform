- ansible.builtin.command:
    argv: [openssl, req, -new, -newkey, rsa:3072, -nodes, -subj, '/CN={{ certificate.name }}', -keyout, '{{ query_private_dir }}/{{ certificate.name }}.key', -out, '{{ query_private_dir }}/{{ certificate.name }}.csr']
    creates: '{{ query_private_dir }}/{{ certificate.name }}.csr'
- ansible.builtin.copy:
    dest: '{{ query_private_dir }}/{{ certificate.name }}.ext'
    mode: '0600'
    content: |
      basicConstraints=critical,CA:FALSE
      keyUsage=critical,digitalSignature,keyEncipherment
      extendedKeyUsage={{ certificate.usage }}
      subjectAltName=DNS:{{ certificate.dns }}
- ansible.builtin.command:
    argv: [openssl, x509, -req, -in, '{{ query_private_dir }}/{{ certificate.name }}.csr', -CA, '{{ query_private_dir }}/ca.crt', -CAkey, '{{ query_private_dir }}/ca.key', -CAcreateserial, -out, '{{ query_private_dir }}/{{ certificate.name }}.crt', -days, '90', -sha256, -extfile, '{{ query_private_dir }}/{{ certificate.name }}.ext']
    creates: '{{ query_private_dir }}/{{ certificate.name }}.crt'
- ansible.builtin.file:
    path: '{{ query_private_dir }}/{{ certificate.name }}.key'
    mode: '0600'
