# Render only. Applying these files is an independently approved operation.
- name: Render portable Grafana query consumer
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
  - ansible.builtin.assert:
      that:
      - consumer_render_enabled | default(false) | bool
      - consumer_output_dir is match('^/[A-Za-z0-9_./-]+$')
      - gateway_namespace is match('^[a-z]([a-z0-9-]{0,49}[a-z0-9])?$')
      - gateway_service_host == 'tenant-query-gateway.' + gateway_namespace + '.svc'
      - grafana_required_endpoints is sequence and grafana_required_endpoints | length > 0
  - ansible.builtin.assert:
      that:
      - item.cidr is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}/32$')
      - item.port | int in [443, 6443]
      - item.purpose in ['identity', 'kubernetes-api']
    loop: '{{ grafana_required_endpoints }}'
  - ansible.builtin.assert:
      that:
      - grafana_loki_gateway_host == 'logging-loki-gateway.logging.svc.cluster.local'
    when: grafana_loki_enabled | default(false) | bool
  - ansible.builtin.file:
      path: '{{ consumer_output_dir }}'
      state: directory
      mode: '0700'
  - ansible.builtin.template:
      src: '{{ item }}.j2'
      dest: '{{ consumer_output_dir }}/{{ item }}'
      mode: '0600'
    loop: [grafana-consumer.yaml, grafana-egress.yaml]
