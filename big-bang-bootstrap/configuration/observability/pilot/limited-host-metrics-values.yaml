# Unselected source proposal; requires reviewed stage wiring and publication.
monitoring:
  values:
    upstream:
      kubeControllerManager:
        serviceMonitor: {enabled: false}
      kubeScheduler:
        serviceMonitor: {enabled: false}
      kubeEtcd:
        serviceMonitor: {enabled: false}
      kubeProxy:
        serviceMonitor: {enabled: false}
      coreDns:
        serviceMonitor:
          authorization: null
      kubelet:
        serviceMonitor:
          tlsConfig:
            insecureSkipVerify: false
