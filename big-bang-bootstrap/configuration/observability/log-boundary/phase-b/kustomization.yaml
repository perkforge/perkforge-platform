apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- name: values-portal-log-query
  namespace: bigbang
  files: [values.yaml=boundary-values.yaml]
- name: values-portal-log-datasource
  namespace: bigbang
  files: [values.yaml=grafana-values.yaml]
- name: values-portal-log-dashboard
  namespace: bigbang
  files: [values.yaml=dashboard-values.yaml]
generatorOptions:
  disableNameSuffixHash: true
