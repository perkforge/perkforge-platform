# INACTIVE approval-gated collection authority, never apply via renderer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: alloy-cluster-pod-log-reader}
rules:
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [pods/log]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: alloy-cluster-pod-log-reader}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-cluster-pod-log-reader
subjects:
- {kind: ServiceAccount, name: alloy-log-reader, namespace: alloy}
