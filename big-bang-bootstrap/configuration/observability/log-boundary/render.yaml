- name: Render inactive native Loki boundary configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    log_boundary_render: false
    log_collect_all_namespaces: false
  tasks:
  - name: Render only when explicitly selected; never contact a cluster
    when: log_boundary_render | bool and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        that:
        - log_output_dir is match('^/[A-Za-z0-9_./-]+$')
        - log_runtime_dir is match('^/[A-Za-z0-9_./-]+$')
        - log_listen is match('^(127[.]0[.]0[.]1|0[.]0[.]0[.]0):[0-9]+$')
        - log_upstream is match('^https://[a-zA-Z0-9.-]+:[0-9]+$')
        - log_upstream_tls_name is match('^[a-zA-Z0-9.-]+$')
        - log_server_name is match('^[a-zA-Z0-9.-]+$')
        - log_writer is match('^[a-z][a-z0-9-]{0,63}$')
        - log_platform_reader is match('^[a-z][a-z0-9-]{0,63}$')
        - log_writer != log_platform_reader
        - log_fallback_scope == 'platform-unassigned-v1'
        - log_scopes is sequence and log_scopes is not string and log_scopes | length > 0
        - log_scopes | map(attribute='namespace') | unique | length == log_scopes | length
        - log_scopes | map(attribute='scope_id') | unique | length == log_scopes | length
        - log_readers is sequence and log_readers is not string and log_readers | length > 0
        - log_readers | map(attribute='username') | unique | length == log_readers | length
        - log_writer not in log_readers | map(attribute='username') | list
        - log_platform_reader not in log_readers | map(attribute='username') | list
        - log_collection_namespaces is sequence and log_collection_namespaces is not string
        - log_collection_namespaces | unique | length == log_collection_namespaces | length
        - (log_collect_all_namespaces | bool and log_collection_namespaces | length == 0) or (not log_collect_all_namespaces | bool and log_collection_namespaces | length > 0)
        - log_collection_namespaces | select('match', '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$') | list | length == log_collection_namespaces | length
        - log_legacy_scopes is sequence and log_legacy_scopes is not string
        - log_legacy_scopes | unique | length == log_legacy_scopes | length
        - log_legacy_scopes | intersect(log_scopes | map(attribute='scope_id') | list + [log_fallback_scope]) | length == 0
    - ansible.builtin.assert:
        that: item is match('^/[A-Za-z0-9_./-]+$')
      loop: '{{ [log_cert_path, log_key_path, log_ca_path, log_htpasswd_path] }}'
    - ansible.builtin.assert:
        that:
        - item.namespace is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
        - item.scope_id is match('^[a-z][a-z0-9-]{0,63}-v[1-9][0-9]*$')
        - item.scope_id != log_fallback_scope
        - item.scope_id | length <= 150
      loop: '{{ log_scopes }}'
    - ansible.builtin.assert:
        that: item is match('^[a-zA-Z0-9][a-zA-Z0-9_-]{0,127}$')
      loop: '{{ log_legacy_scopes }}'
    - ansible.builtin.assert:
        that:
        - item.username is match('^[a-z][a-z0-9-]{0,63}$')
        - item.scope_ids is sequence and item.scope_ids is not string and item.scope_ids | length > 0
        - item.scope_ids | unique | length == item.scope_ids | length
        - item.scope_ids | difference(log_scopes | map(attribute='scope_id') | list) | length == 0
      loop: '{{ log_readers }}'
    - ansible.builtin.set_fact:
        log_original_processing_stages: '{{ (lookup("file", playbook_dir + "/../candidate-values.yaml") | from_yaml)["alloy"]["values"]["upstream"]["podLogsViaKubernetesApi"]["extraLogProcessingStages"] }}'
        log_all_query_scopes: '{{ ([log_fallback_scope] + (log_scopes | map(attribute="scope_id") | list) + log_legacy_scopes) | unique | sort }}'
    - ansible.builtin.assert:
        that: (log_all_query_scopes | join('|') | length) <= 4096
    - name: Refuse existing output directories or symlinks
      ansible.builtin.stat:
        path: '{{ log_output_dir }}'
        follow: false
      register: log_output_stat
    - ansible.builtin.assert:
        that: not log_output_stat.stat.exists
    - ansible.builtin.file:
        path: '{{ log_output_dir }}'
        state: directory
        mode: '0700'
    - ansible.builtin.template:
        src: '{{ item }}.j2'
        dest: '{{ log_output_dir }}/{{ item }}'
        mode: '0600'
      loop: [nginx.conf, stages.alloy, collector-rbac.yaml, boundary-values.yaml]
