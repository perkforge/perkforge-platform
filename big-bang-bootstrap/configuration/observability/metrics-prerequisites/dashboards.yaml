apiVersion: v1
kind: ConfigMap
metadata:
  name: pf-dashboard-cluster
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  cluster.json: "{\n  \"uid\": \"pf-cluster\",\n  \"title\": \"PerkForge Cluster\"\
    ,\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"editable\": false,\n  \"tags\"\
    : [\n    \"perkforge\",\n    \"platform-admin\"\n  ],\n  \"panels\": [\n    {\n\
    \      \"id\": 1,\n      \"type\": \"timeseries\",\n      \"title\": \"Cluster\"\
    ,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\"\
    : \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\"\
    : \"A\",\n          \"expr\": \"sum by (node) (rate(node_cpu_seconds_total{mode!=\\\
    \"idle\\\"}[5m]))\"\n        }\n      ],\n      \"gridPos\": {\n        \"h\"\
    : 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      }\n    }\n\
    \  ],\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n \
    \ \"annotations\": {\n    \"list\": []\n  }\n}"
---
