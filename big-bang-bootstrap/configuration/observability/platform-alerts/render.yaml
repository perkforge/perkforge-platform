# Offline only; render an additive Grafana provisioning file. Never changes routing policy.
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    platform_alerts_render: false
    platform_alerts_org_id: 1
    platform_alerts_enable_host_filesystem: false
    platform_alerts_enable_physical_network: false
  vars_files: [rules.yaml]
  tasks:
  - when: platform_alerts_render | bool and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        that:
        - platform_alerts_topic == 'platform-alerts'
        - platform_alerts_url is match('^https://[a-z0-9.-]+(:[0-9]+)?/$')
        - platform_alerts_grafana_url is match('^https://[a-z0-9.-]+(:[0-9]+)?/$')
        - platform_alerts_runbook_url is match('^https://[A-Za-z0-9./_-]+$')
        - platform_alerts_network_device_regex is match('^[a-zA-Z0-9_|().+*-]+$')
        - platform_alerts_disk_device_regex is match('^[a-zA-Z0-9_|().+*-]+$')
        - platform_alerts_output_dir == platform_alerts_output_dir | realpath
        - platform_alerts_output_dir is match('^/[A-Za-z0-9_./-]+$')
        - platform_alerts_org_id | int > 0
    - ansible.builtin.stat:
        path: '{{ platform_alerts_token_file }}'
        follow: false
      register: publisher
    - ansible.builtin.assert:
        that:
        - publisher.stat.isreg and not publisher.stat.islnk
        - publisher.stat.mode == '0600'
        - lookup('file', platform_alerts_ca_file, rstrip=false) | hash('sha256') == platform_alerts_ca_sha256
    - ansible.builtin.file:
        path: '{{ platform_alerts_output_dir }}'
        state: directory
        mode: '0700'
    - ansible.builtin.template:
        src: alerting.yaml.j2
        dest: '{{ platform_alerts_output_dir }}/alerting.yaml'
        mode: '0600'
      no_log: true
