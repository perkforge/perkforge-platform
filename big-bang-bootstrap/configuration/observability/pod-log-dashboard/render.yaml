---
# Offline native provisioning renderer only: no API calls, credentials or grants.
- name: Render a pod-log dashboard for one explicitly authorized datasource
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    pod_logs_render: false
  tasks:
    - name: Render only on explicit operator request
      when: pod_logs_render | bool
      block:
        - name: Require explicit organization, datasource and truthful coverage
          ansible.builtin.assert:
            that:
              - pod_logs_org_id is defined and pod_logs_org_id is integer and pod_logs_org_id > 0
              - pod_logs_datasource_uid is defined and pod_logs_datasource_uid is string
              - pod_logs_datasource_uid is match('^[A-Za-z0-9_-]{1,40}$')
              - pod_logs_coverage is defined and pod_logs_coverage is string
              - pod_logs_coverage | length > 0 and pod_logs_coverage | length <= 160
              - pod_logs_output is defined and pod_logs_output is string
              - pod_logs_output is match('^/.+') and pod_logs_output != '/'
            fail_msg: Explicit approved per-org datasource, coverage description and local output directory are required.
        - name: Prepare local render directory
          ansible.builtin.file:
            path: '{{ pod_logs_output }}'
            state: directory
            mode: '0700'
        - name: Render dashboard and native file provider without deploying
          ansible.builtin.template:
            src: '{{ item }}.j2'
            dest: '{{ pod_logs_output }}/{{ item }}'
            mode: '0600'
          loop: [dashboard.json, provider.yaml]
