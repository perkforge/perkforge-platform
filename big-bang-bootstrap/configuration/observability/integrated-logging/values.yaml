# Backend activation candidate only. Existing query-runtime-values retains the
# authenticated Prometheus datasource override. Do not reuse logging-pilot Grafana
# values, which predate the authenticated query gateway. No new human log access.
alloy:
  enabled: true
  flux:
    suspend: false
  values:
    upstream:
      collectors:
        alloy-logs:
          # Match the pinned Big Bang singleton collector's restricted defaults.
          configReloader:
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile: {type: RuntimeDefault}
          alloy:
            mounts:
              extra:
              - {name: loki-ca, mountPath: /loki-ca, readOnly: true}
              - {name: alloy-storage, mountPath: /tmp/alloy}
          controller:
            volumes:
              extra:
              - {name: loki-ca, configMap: {name: loki-ca}}
              - {name: alloy-storage, emptyDir: {sizeLimit: 64Mi}}
      alloy-operator:
        conflictCheck: false
    global:
      imagePullSecrets: [{name: private-registry}]
      image:
        pullSecrets: [{name: private-registry}]
    monitoring: {enabled: false}
    serviceMonitors: []
loki:
  enabled: true
  flux:
    suspend: false
  values:
    imagePullSecrets: [{name: private-registry}]
    global:
      dnsService: rke2-coredns-rke2-coredns
    monitoring:
      enabled: false
      dashboards: {enabled: false}
      serviceMonitor: {enabled: false}
      rules: {enabled: false}
    singleBinary:
      # Persistent Loki must run only where the existing Longhorn CSI is installed.
      nodeSelector:
        storage.perkforge.io/worker: 'true'
    gateway:
      basicAuth:
        # Same staged identity/hash; corrected line delimiter, original immutable
        # input remains preserved. This prerequisite must exist before activation.
        existingSecret: loki-gateway-auth-v2
