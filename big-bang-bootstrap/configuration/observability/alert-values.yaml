# Review overlay only. Not included by the cluster root; no destination is armed.
monitoring:
  values:
    upstream:
      additionalPrometheusRulesMap:
        perkforge-lab:
          groups:
          - name: perkforge.capacity
            rules:
            - alert: PerkForgeNodeNotReady
              expr: kube_node_status_condition{condition="Ready",status="true"} == 0
              for: 5m
              labels:
                severity: critical
                owner: platform
              annotations:
                summary: Physical node has not been Ready for five minutes
                description: Check node and workload health before any repair or restart.
            - alert: PerkForgePersistentVolumeLowSpace
              expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.15
              for: 10m
              labels:
                severity: warning
                owner: platform
              annotations:
                summary: Persistent volume has less than fifteen percent free
                description: Retention is not a disk quota; check growth, replicas and reserves before changing storage.
            - alert: PerkForgeNodeMemoryPressure
              expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
              for: 10m
              labels:
                severity: warning
                owner: platform
              annotations:
                summary: Physical node available memory below ten percent
                description: Compare actual usage and requests; stop adding packages if capacity is exhausted.
      alertmanager:
        config:
          global:
            resolve_timeout: 5m
          route:
            receiver: 'null'
            group_by: [alertname, namespace, severity]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
          receivers:
          - name: 'null'
          inhibit_rules:
          - source_matchers: ['severity="critical"']
            target_matchers: ['severity="warning"']
            equal: [namespace, alertname]
