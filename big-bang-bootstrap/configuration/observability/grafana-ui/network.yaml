apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grafana-from-traefik, namespace: monitoring}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: monitoring-grafana
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {app.kubernetes.io/name: rke2-traefik}
    ports: [{protocol: TCP, port: 3000}]
