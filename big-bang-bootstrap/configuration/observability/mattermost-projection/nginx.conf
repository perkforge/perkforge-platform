load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  js_import projection from /etc/projection/project.js;
  js_fetch_trusted_certificate /run/projection-ca/ca.crt;
  js_fetch_verify on;
  js_fetch_timeout 10s;
  # Supplied by target overlay from observed cluster DNS, never public fallback.
  include /run/projection-dns/resolver.conf;
  server {
    listen 8443 ssl;
    ssl_certificate /run/projection-tls/tls.crt;
    ssl_certificate_key /run/projection-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    location = /healthz { return 200 'ok'; }
    location = /platform { js_content projection.receive; }
    location = /portal { js_content projection.receive; }
    location / { return 404; }
  }
}
