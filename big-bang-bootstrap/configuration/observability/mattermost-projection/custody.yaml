# Inactive renderer only: no credentials read, generated, written or applied.
- name: Render exact notification custody prerequisites
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    projection_custody_render: false
    projection_consumers:
    - {suffix: routes, namespace: ntfy, secret: mattermost-projection-routes-v1, record: notifications/mm-projection/routes-v1, fields: [routes.json]}
    - {suffix: tls, namespace: ntfy, secret: mattermost-projection-tls-v1, record: notifications/mm-projection/tls-v1, fields: [tls.crt, tls.key]}
    - {suffix: platform, namespace: flux-system, secret: flux-mattermost-platform-v1, record: notifications/mm-projection/platform-v1, fields: [headers, ca.crt]}
    - {suffix: portal, namespace: flux-system, secret: flux-mattermost-portal-v1, record: notifications/mm-projection/portal-v1, fields: [headers, ca.crt]}
  tasks:
  - when: projection_custody_render | bool and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        that:
        - projection_custody_output is match('^/[A-Za-z0-9_./-]+$')
        - projection_bao_server is match('^https://[a-z0-9.-]+(:[0-9]+)?$')
        - projection_public_ca is search('-----BEGIN CERTIFICATE-----')
        - "'PRIVATE KEY' not in projection_public_ca"
    - ansible.builtin.stat:
        path: '{{ projection_custody_output }}'
        follow: false
      register: custody_output
    - ansible.builtin.assert:
        that: not custody_output.stat.exists
    - ansible.builtin.file:
        path: '{{ projection_custody_output }}'
        state: directory
        mode: '0700'
    - ansible.builtin.template:
        src: custody-prerequisites.yaml.j2
        dest: '{{ projection_custody_output }}/prerequisites.yaml'
        mode: '0600'
    - ansible.builtin.template:
        src: custody-consumers.yaml.j2
        dest: '{{ projection_custody_output }}/consumers.yaml'
        mode: '0600'
    - ansible.builtin.template:
        src: custody-policy.hcl.j2
        dest: '{{ projection_custody_output }}/eso-mm-projection-{{ item.suffix }}.hcl'
        mode: '0600'
      loop: '{{ projection_consumers }}'
    - ansible.builtin.template:
        src: custody-role.json.j2
        dest: '{{ projection_custody_output }}/eso-mm-projection-{{ item.suffix }}.json'
        mode: '0600'
      loop: '{{ projection_consumers }}'
