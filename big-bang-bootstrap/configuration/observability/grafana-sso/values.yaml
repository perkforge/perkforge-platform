# Explicit optional native activation; live role policy and rollout require approval.
grafana:
  values:
    sso: {enabled: false}
    upstream:
      assertNoLeakedSecrets: true
      envFromSecret: grafana-oidc-client
      extraConfigmapMounts:
      - name: identity-ca
        mountPath: /etc/grafana/identity
        configMap: grafana-identity-ca
        readOnly: true
      grafana.ini:
        server:
          root_url: https://grafana.perkforge.home.arpa/
        auth:
          disable_login_form: false
          oauth_allow_insecure_email_lookup: false
        auth.basic:
          enabled: true
        auth.anonymous:
          enabled: false
        auth.generic_oauth:
          enabled: true
          auto_login: false
          name: Keycloak
          client_id: grafana
          client_secret: $__env{GRAFANA_OIDC_CLIENT_SECRET}
          scopes: openid profile email
          auth_url: https://keycloak.perkforge.home.arpa/auth/realms/perkforge/protocol/openid-connect/auth
          token_url: https://keycloak.perkforge.home.arpa/auth/realms/perkforge/protocol/openid-connect/token
          api_url: https://keycloak.perkforge.home.arpa/auth/realms/perkforge/protocol/openid-connect/userinfo
          use_pkce: true
          tls_skip_verify_insecure: false
          tls_client_ca: /etc/grafana/identity/ca.crt
          allow_sign_up: true
          allow_assign_grafana_admin: true
          role_attribute_strict: true
          skip_org_role_sync: false
          role_attribute_path: "contains(groups[*], '/platform/admins') && 'GrafanaAdmin'"
