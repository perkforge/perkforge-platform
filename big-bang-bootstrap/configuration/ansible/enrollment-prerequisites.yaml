- name: Prepare only generic local enrollment prerequisites after approval
  hosts: bootstrap_clusters
  gather_facts: false
  vars:
    enrollment_foundation_apply: false
    gitops_path: ./big-bang-bootstrap/clusters/local
  tasks:
  - name: Refuse another environment
    ansible.builtin.assert:
      that:
      - ansible_play_hosts_all == ['local']
      - deployment_environment == 'local'
      - impact_profile == 'il2'
  - name: Default and check mode do not access the cluster
    ansible.builtin.debug:
      msg: 'Enrollment prerequisites={{ enrollment_foundation_apply | bool }}'
  - name: Apply separately approved prerequisites from a clean published checkout
    when: enrollment_foundation_apply | bool and not ansible_check_mode
    block:
    - name: Require an explicit repository-local physical stage
      ansible.builtin.assert:
        that: gitops_path is match('^[.]/big-bang-bootstrap/clusters/local(-[a-z0-9-]+)?$')
    - name: Refuse enrollment prerequisites while the selected root excludes enrollment
      ansible.builtin.assert:
        quiet: true
        that: selected_root.resources | select('match', '^[.][.]/[.][.]/enrollments/[a-z0-9-]+$') | list | length == 1
        fail_msg: 'Tenant enrollment is disabled until core platform readiness and explicit source selection.'
      vars:
        selected_root: "{{ lookup('file', playbook_dir + '/../../../' + gitops_path[2:] + '/kustomization.yaml') | from_yaml }}"
    - name: Render only the selected stage without cluster access
      ansible.builtin.command:
        argv: [kubectl, kustomize, '{{ playbook_dir }}/../../../{{ gitops_path[2:] }}']
      register: enrollment_render
      changed_when: false
      no_log: true
    - ansible.builtin.set_fact:
        enrollment_objects: "{{ enrollment_render.stdout | from_yaml_all | selectattr('metadata.name', 'equalto', 'tenant-enrollments') | list }}"
      no_log: true
    - name: Require the scoped generic enrollment parent in the selected stage
      ansible.builtin.assert:
        that:
        - enrollment_objects | length == 2
        - enrollment_objects | map(attribute='kind') | sort | list == ['GitRepository', 'Kustomization']
        - enrollment_objects | map(attribute='metadata.namespace') | unique | list == ['flux-system']
        - selected_source.apiVersion == 'source.toolkit.fluxcd.io/v1'
        - selected_parent.apiVersion == 'kustomize.toolkit.fluxcd.io/v1'
        - selected_source.spec.url == 'https://github.com/perkforge/perkforge-platform-tenants.git'
        - selected_source.spec.ref.keys() | list == ['tag']
        - selected_source.spec.ref.tag is match('^v[0-9]+[.][0-9]+[.][0-9]+$')
        - selected_parent.spec.serviceAccountName == 'tenant-enrollment-admin'
        - selected_parent.spec.sourceRef.kind == 'GitRepository'
        - selected_parent.spec.sourceRef.name == 'tenant-enrollments'
        - selected_parent.spec.sourceRef.namespace is not defined or selected_parent.spec.sourceRef.namespace == 'flux-system'
        - selected_parent.spec.path is match('^[.]/clusters/[a-z0-9-]+$')
        - not selected_parent.spec.prune
        - selected_parent.spec.kubeConfig is not defined
      vars:
        selected_source: "{{ enrollment_objects | selectattr('kind', 'equalto', 'GitRepository') | first }}"
        selected_parent: "{{ enrollment_objects | selectattr('kind', 'equalto', 'Kustomization') | first }}"
    - name: Verify released stage
      ansible.builtin.include_tasks: verify-release.yaml
    - name: Read checkout revision
      ansible.builtin.command: {argv: [git, -C, '{{ playbook_dir }}/../../..', rev-parse, HEAD]}
      register: enrollment_head
      changed_when: false
    - name: Inspect checkout cleanliness
      ansible.builtin.command: {argv: [git, -C, '{{ playbook_dir }}/../../..', status, --porcelain]}
      register: enrollment_dirty
      changed_when: false
    - name: Read target UID
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, '{{ target_kubeconfig }}', --context, '{{ target_context }}', get, namespace, kube-system, -o, 'jsonpath={.metadata.uid}']
      register: enrollment_uid
      changed_when: false
    - name: Refuse unreviewed source or wrong cluster
      ansible.builtin.assert:
        that:
        - enrollment_head.stdout == config_release.resolvedCommit
        - enrollment_dirty.stdout | length == 0
        - expected_cluster_uid != 'UNCONFIGURED'
        - enrollment_uid.stdout == expected_cluster_uid
    - name: Apply only generic enrollment identities and root authority
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, '{{ target_kubeconfig }}', --context, '{{ target_context }}', apply, -k, '{{ playbook_dir }}/../../enrollments/prerequisites']
      register: enrollment_result
      changed_when: "'created' in enrollment_result.stdout or 'configured' in enrollment_result.stdout"
