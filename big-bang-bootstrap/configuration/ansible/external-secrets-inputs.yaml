# Source-owned operator stages. Never selects a live source or changes authentication.
- name: Prepare separately approved native ESO inputs and activation permission
  hosts: bootstrap_clusters
  gather_facts: false
  vars:
    external_secrets_registry_apply: false
    external_secrets_ca_apply: false
    external_secrets_network_apply: false
    external_secrets_activation_apply: false
    external_secrets_activation_prerequisites_approved: false
    external_secrets_inputs_scope: UNAPPROVED
    external_secrets_ca_file: /UNCONFIGURED/public-ca.crt
    external_secrets_expected_ca_sha256: UNCONFIGURED
    external_secrets_provider_file: /UNCONFIGURED/provider-cidr
    gitops_path: ./big-bang-bootstrap/clusters/local-external-secrets-active
  tasks:
  - name: Reject ambiguous switches even when disabled
    ansible.builtin.assert:
      that:
      - external_secrets_registry_apply is boolean
      - external_secrets_ca_apply is boolean
      - external_secrets_network_apply is boolean
      - external_secrets_activation_apply is boolean
      - external_secrets_activation_prerequisites_approved is boolean
  - ansible.builtin.debug:
      msg: Default/check mode accesses no private input or API. Activation never selects a live root.
  - name: Run only separately approved input stages
    when: (external_secrets_registry_apply or external_secrets_ca_apply or external_secrets_network_apply or external_secrets_activation_apply) and not ansible_check_mode
    no_log: true
    block:
    - ansible.builtin.assert:
        that:
        - ansible_play_hosts_all == ['local']
        - deployment_environment == 'local'
        - impact_profile == 'il2'
        - external_secrets_inputs_scope == 'external-secrets-inputs-v1'
        - gitops_path in ['./big-bang-bootstrap/clusters/local-velero', './big-bang-bootstrap/clusters/local-external-secrets', './big-bang-bootstrap/clusters/local-external-secrets-active']
        - target_kubeconfig != '/UNCONFIGURED/kubeconfig'
        - target_context != 'UNCONFIGURED'
        - expected_cluster_uid != 'UNCONFIGURED'
    - ansible.builtin.include_tasks: verify-release.yaml
    - ansible.builtin.command:
        argv: [git, -C, '{{ playbook_dir }}/../../..', rev-parse, HEAD]
      register: eso_head
      changed_when: false
    - ansible.builtin.command:
        argv: [git, -C, '{{ playbook_dir }}/../../..', status, --porcelain]
      register: eso_changes
      changed_when: false
    - ansible.builtin.assert:
        that:
        - eso_head.stdout == config_release.resolvedCommit
        - eso_changes.stdout | length == 0
    - ansible.builtin.set_fact:
        eso_k: [kubectl, --kubeconfig, '{{ target_kubeconfig }}', --context, '{{ target_context }}']
    - ansible.builtin.command:
        argv: '{{ eso_k + ["get", "namespace", "kube-system", "-o", "jsonpath={.metadata.uid}"] }}'
      register: eso_uid
      changed_when: false
    - ansible.builtin.assert:
        that: eso_uid.stdout == expected_cluster_uid
    - name: Require the existing exact foundation namespace, never adopt it
      ansible.builtin.command:
        argv: '{{ eso_k + ["get", "namespace", "external-secrets", "-o", "json"] }}'
      register: eso_namespace
      changed_when: false
    - ansible.builtin.assert:
        that: (eso_namespace.stdout | from_json) | external_secrets_foundation_matches((lookup('file', playbook_dir ~ '/../external-secrets/prerequisites/foundation.yaml') | from_yaml_all | first))
    - ansible.builtin.include_tasks: tasks/external-secrets-inputs.yaml
    always:
    - ansible.builtin.set_fact:
        eso_registry: {}
        eso_registry_entry: {}
        eso_desired: []
        eso_existing: {}
        eso_readback: {}
        eso_prerequisites: {}
        eso_provider: ''
        eso_ca: ''
      no_log: true
