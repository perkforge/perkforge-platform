- name: Prepare only separately approved local native ESO prerequisites
  hosts: bootstrap_clusters
  gather_facts: false
  vars:
    external_secrets_foundation_apply: false
    external_secrets_foundation_scope: UNAPPROVED
    external_secrets_chart_directory: /UNCONFIGURED/public-external-secrets-chart
    gitops_path: ./big-bang-bootstrap/clusters/local
  tasks:
  - name: Refuse another target or ambiguous apply flag
    ansible.builtin.assert:
      that:
      - external_secrets_foundation_apply is boolean
      - inventory_hostname == 'local'
      - deployment_environment == 'local'
      - ansible_play_hosts_all | length == 1
      - gitops_path in ['./big-bang-bootstrap/clusters/local', './big-bang-bootstrap/clusters/local-velero', './big-bang-bootstrap/clusters/local-external-secrets']
  - name: Explain safe default
    ansible.builtin.debug:
      msg: Default/check mode performs no API access, download, credential read or mutation.
  - name: Apply exact public CRDs and explicit controller foundation only
    when: external_secrets_foundation_apply and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        that: external_secrets_foundation_scope == 'external-secrets-foundation-v1'
    - ansible.builtin.include_tasks: verify-release.yaml
    - ansible.builtin.command:
        argv: [git, -C, '{{ playbook_dir }}/../../..', rev-parse, HEAD]
      register: external_secrets_checkout
      changed_when: false
    - ansible.builtin.command:
        argv: [git, -C, '{{ playbook_dir }}/../../..', status, --porcelain]
      register: external_secrets_changes
      changed_when: false
    - ansible.builtin.assert:
        that:
        - external_secrets_checkout.stdout == config_release.resolvedCommit
        - external_secrets_changes.stdout | length == 0
        - target_kubeconfig != '/UNCONFIGURED/kubeconfig'
        - target_context != 'UNCONFIGURED'
        - expected_cluster_uid != 'UNCONFIGURED'
        - external_secrets_chart_directory is match('^/')
        - external_secrets_chart_directory | realpath == external_secrets_chart_directory
    - name: Read public evidence pin and verify exact local bundle without fetching
      ansible.builtin.set_fact:
        external_secrets_pin: "{{ lookup('file', playbook_dir ~ '/../external-secrets/source-pin.yaml') | from_yaml }}"
    - ansible.builtin.stat:
        path: '{{ external_secrets_chart_directory }}/crds/bundle.yaml'
        follow: false
        checksum_algorithm: sha256
      register: external_secrets_bundle_stat
    - ansible.builtin.assert:
        that:
        - external_secrets_bundle_stat.stat.isreg | default(false)
        - not (external_secrets_bundle_stat.stat.islnk | default(false))
        - external_secrets_bundle_stat.stat.checksum == external_secrets_pin.crd_bundle_sha256
        - (lookup('file', external_secrets_chart_directory ~ '/Chart.yaml') | from_yaml).version == external_secrets_pin.package_version
    - ansible.builtin.set_fact:
        external_secrets_bundle: "{{ lookup('file', external_secrets_chart_directory ~ '/crds/bundle.yaml') }}"
    - ansible.builtin.assert:
        that:
        - external_secrets_bundle | from_yaml_all | select | list | length == external_secrets_pin.crd_count
        - external_secrets_bundle | from_yaml_all | select | rejectattr('kind', 'equalto', 'CustomResourceDefinition') | list | length == 0
    - name: Assemble reviewed public CRD identity metadata only
      ansible.builtin.set_fact:
        external_secrets_desired_crds: []
    - ansible.builtin.set_fact:
        external_secrets_desired_crds: "{{ external_secrets_desired_crds + [item | combine({'metadata': {'labels': {'perkforge.io/owner': 'external-secrets-foundation-v1'}, 'annotations': {'perkforge.io/external-secrets-crd-source-sha256': external_secrets_pin.crd_bundle_sha256}}}, recursive=true)] }}"
      loop: '{{ external_secrets_bundle | from_yaml_all | select | list }}'
      loop_control:
        label: '{{ item.metadata.name }}'
    - name: Render exact reviewed foundation locally without contacting Kubernetes
      ansible.builtin.command:
        argv: [kubectl, kustomize, '{{ playbook_dir }}/../external-secrets/prerequisites']
      environment: {KUBECONFIG: /dev/null}
      register: external_secrets_foundation_render
      changed_when: false
    - ansible.builtin.set_fact:
        external_secrets_desired_foundation: '{{ external_secrets_foundation_render.stdout | from_yaml_all | select | list }}'
    - name: Verify exact cluster before mutation
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, '{{ target_kubeconfig }}', --context, '{{ target_context }}', get, namespace, kube-system, -o, 'jsonpath={.metadata.uid}']
      register: external_secrets_cluster
      changed_when: false
    - ansible.builtin.assert:
        that: external_secrets_cluster.stdout == expected_cluster_uid
    - name: Inspect every exact target before any apply
      ansible.builtin.command:
        argv: "{{ ['kubectl', '--kubeconfig', target_kubeconfig, '--context', target_context, 'get', item.kind, item.metadata.name, '--ignore-not-found', '-o', 'json'] + (['--namespace', item.metadata.namespace] if item.metadata.namespace is defined else []) }}"
      loop: '{{ external_secrets_desired_crds + external_secrets_desired_foundation }}'
      loop_control:
        label: '{{ item.kind }}/{{ item.metadata.name }}'
      register: external_secrets_existing
      changed_when: false
    - name: Refuse adoption, ownership drift, schema migration or broader existing authority
      ansible.builtin.assert:
        that:
        - item.stdout | trim == '' or (item.stdout | from_json | external_secrets_foundation_matches(item.item))
        fail_msg: Existing ESO prerequisite is not an exact owned match. Stop for separate review; do not adopt or force conflicts.
      loop: '{{ external_secrets_existing.results }}'
      loop_control:
        label: '{{ item.item.kind }}/{{ item.item.metadata.name }}'
    - name: Create reviewed CRDs only when absent (reject concurrent ownership races)
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, '{{ target_kubeconfig }}', --context, '{{ target_context }}', create, --field-manager=perkforge-external-secrets-crds, -f, '-']
        stdin: '{{ item.item | to_json }}'
      loop: '{{ external_secrets_existing.results }}'
      loop_control:
        label: '{{ item.item.kind }}/{{ item.item.metadata.name }}'
      when: item.item.kind == 'CustomResourceDefinition' and item.stdout | trim == ''
      register: external_secrets_crds_apply
      changed_when: true
    - name: Wait for exact CRDs to be established
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, '{{ target_kubeconfig }}', --context, '{{ target_context }}', wait, '--for=condition=Established', '--timeout=60s', 'crd/{{ item.metadata.name }}']
      loop: '{{ external_secrets_desired_crds }}'
      loop_control:
        label: '{{ item.metadata.name }}'
      changed_when: false
    - name: Create reviewed foundation objects only when absent
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, '{{ target_kubeconfig }}', --context, '{{ target_context }}', create, --field-manager=perkforge-external-secrets-foundation, -f, '-']
        stdin: '{{ item.item | to_json }}'
      loop: '{{ external_secrets_existing.results }}'
      loop_control:
        label: '{{ item.item.kind }}/{{ item.item.metadata.name }}'
      when: item.item.kind != 'CustomResourceDefinition' and item.stdout | trim == ''
      register: external_secrets_foundation_result
      changed_when: true
    - name: Read back exact owned objects after creation or unchanged repeat
      ansible.builtin.command:
        argv: "{{ ['kubectl', '--kubeconfig', target_kubeconfig, '--context', target_context, 'get', item.kind, item.metadata.name, '-o', 'json'] + (['--namespace', item.metadata.namespace] if item.metadata.namespace is defined else []) }}"
      loop: '{{ external_secrets_desired_crds + external_secrets_desired_foundation }}'
      loop_control:
        label: '{{ item.kind }}/{{ item.metadata.name }}'
      register: external_secrets_readback
      changed_when: false
    - name: Require exact owned readback without broadening or automatic repair
      ansible.builtin.assert:
        that: item.stdout | from_json | external_secrets_foundation_matches(item.item)
        fail_msg: ESO foundation readback differs from reviewed ownership or content. Stop without automatic repair.
      loop: '{{ external_secrets_readback.results }}'
      loop_control:
        label: '{{ item.item.kind }}/{{ item.item.metadata.name }}'
