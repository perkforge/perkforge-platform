# Owner-run, default-off handoff from the stable app to the concrete runner root.
- name: Select the released protected GitLab runner configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gitlab_runner_stage_run: false
    gitlab_runner_stage_scope: UNAPPROVED
    gitlab_runner_stage_release: UNCONFIGURED
    gitlab_runner_stage_commit: UNCONFIGURED
    gitlab_runner_stage_release_directory: /UNCONFIGURED/release
    gitlab_runner_stage_kubeconfig: /UNCONFIGURED/kubeconfig
    gitlab_runner_stage_hostname: UNCONFIGURED
    gitlab_runner_stage_context: UNCONFIGURED
    gitlab_runner_stage_cluster_uid: UNCONFIGURED
    gitlab_runner_stage_root_uid: UNCONFIGURED
    gitlab_runner_stage_source_uid: UNCONFIGURED
    gitlab_runner_stage_native_paused_verified: false
    gitlab_runner_stage_app_sso_verified: false
    gitlab_runner_stage_network_verified: false
    gitlab_runner_stage_kubectl: /usr/local/bin/kubectl
  tasks:
  - ansible.builtin.debug:
      msg: 'Default/check mode contacts no API. Selects only the concrete runner stage after private registration/trust/network preparation; no user grant, token creation, rotation or source promotion.'
  - when: gitlab_runner_stage_run | bool and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        that:
        - gitlab_runner_stage_scope == 'gitlab-runner-stage-v1'
        - gitlab_runner_stage_release is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
        - gitlab_runner_stage_commit is match('^[0-9a-f]{40}$')
        - gitlab_runner_stage_hostname is match('^[a-z0-9][a-z0-9.-]+$')
        - "'UNCONFIGURED' not in gitlab_runner_stage_hostname"
        - gitlab_runner_stage_native_paused_verified | bool
        - gitlab_runner_stage_app_sso_verified | bool
        - gitlab_runner_stage_network_verified | bool
        - "'UNCONFIGURED' not in [gitlab_runner_stage_context,gitlab_runner_stage_cluster_uid,gitlab_runner_stage_root_uid,gitlab_runner_stage_source_uid]"
    - ansible.builtin.command:
        argv: [bash, '{{ gitlab_runner_stage_release_directory }}/scripts/verify-release-ref.sh', perkforge/perkforge-platform, '{{ gitlab_runner_stage_release }}', '{{ gitlab_runner_stage_commit }}']
      changed_when: false
    - ansible.builtin.set_fact:
        runner_stage_kube: ['{{ gitlab_runner_stage_kubectl }}', --kubeconfig, '{{ gitlab_runner_stage_kubeconfig }}', --context, '{{ gitlab_runner_stage_context }}', --request-timeout=20s]
    - ansible.builtin.command:
        argv: '{{ runner_stage_kube + ["get","namespace","kube-system","-o","json"] }}'
      register: runner_stage_identity
      changed_when: false
    - ansible.builtin.assert:
        that: (runner_stage_identity.stdout | from_json).metadata.uid == gitlab_runner_stage_cluster_uid
    - ansible.builtin.command:
        argv: '{{ runner_stage_kube + ["get","gitrepository","cluster-config","-n","flux-system","-o","json"] }}'
      register: runner_stage_source
      changed_when: false
    - ansible.builtin.assert:
        that:
        - (runner_stage_source.stdout | from_json).metadata.uid == gitlab_runner_stage_source_uid
        - (runner_stage_source.stdout | from_json).spec.url == 'https://github.com/perkforge/perkforge-platform.git'
        - (runner_stage_source.stdout | from_json).spec.ref == {'tag':gitlab_runner_stage_release}
        - (runner_stage_source.stdout | from_json).status.artifact.revision == gitlab_runner_stage_release + '@sha1:' + gitlab_runner_stage_commit
    - name: Inspect only the prepared runner trust and authentication objects privately
      ansible.builtin.command:
        argv: '{{ runner_stage_kube + ["get","secret",item.name,"-n",item.namespace,"-o","json"] }}'
      loop:
      - {name: gitlab-runner-auth, namespace: gitlab-runner, owner: gitlab-runner-v1, type: Opaque, keys: [runner-registration-token, runner-token]}
      - {name: gitlab-runner-public-ca, namespace: gitlab-runner, owner: gitlab-trust-v1, type: Opaque, keys: ['{{ gitlab_runner_stage_hostname }}.crt']}
      - {name: private-registry, namespace: gitlab-runner, owner: gitlab-registry-v1, type: kubernetes.io/dockerconfigjson, keys: [.dockerconfigjson]}
      - {name: private-registry, namespace: gitlab-ci-platform, owner: gitlab-registry-v1, type: kubernetes.io/dockerconfigjson, keys: [.dockerconfigjson]}
      register: runner_stage_secrets
      changed_when: false
      no_log: true
    - ansible.builtin.assert:
        that:
        - (item.stdout | from_json).metadata.labels['perkforge.io/owner'] == item.item.owner
        - (item.stdout | from_json).type == item.item.type
        - (item.stdout | from_json).immutable | default(false)
        - (item.stdout | from_json).data.keys() | sort == item.item['keys'] | sort
      loop: '{{ runner_stage_secrets.results }}'
      no_log: true
    - ansible.builtin.command:
        argv: '{{ runner_stage_kube + ["get","kustomization","cluster-root","-n","flux-system","-o","json"] }}'
      register: runner_stage_root
      changed_when: false
    - ansible.builtin.assert:
        that:
        - (runner_stage_root.stdout | from_json).metadata.uid == gitlab_runner_stage_root_uid
        - not (runner_stage_root.stdout | from_json).spec.suspend | default(false)
        - not (runner_stage_root.stdout | from_json).spec.prune
        - not (runner_stage_root.stdout | from_json).spec.force
        - (runner_stage_root.stdout | from_json).spec.path in ['./big-bang-bootstrap/clusters/local-gitlab-app','./big-bang-bootstrap/clusters/local-gitlab-runner']
    - when: (runner_stage_root.stdout | from_json).spec.path == './big-bang-bootstrap/clusters/local-gitlab-app'
      block:
      - ansible.builtin.set_fact:
          runner_stage_patch:
          - {op: test, path: /metadata/uid, value: '{{ gitlab_runner_stage_root_uid }}'}
          - {op: test, path: /metadata/resourceVersion, value: '{{ (runner_stage_root.stdout | from_json).metadata.resourceVersion }}'}
          - {op: test, path: /spec, value: '{{ (runner_stage_root.stdout | from_json).spec }}'}
          - {op: replace, path: /spec/path, value: ./big-bang-bootstrap/clusters/local-gitlab-runner}
      - name: Validate the exact guarded path-only patch at the API server
        ansible.builtin.command:
          argv: '{{ runner_stage_kube + ["patch","kustomization","cluster-root","-n","flux-system","--type=json","--dry-run=server","-p",runner_stage_patch | to_json] }}'
        changed_when: false
      - name: Select the existing concrete manager and restricted-job configuration
        ansible.builtin.command:
          argv: '{{ runner_stage_kube + ["patch","kustomization","cluster-root","-n","flux-system","--type=json","-p",runner_stage_patch | to_json] }}'
    - ansible.builtin.debug:
        msg: 'Runner root selected. Keep native runner paused until manager readiness, CA, image access and permissions are verified; activation and job acceptance are separate explicit steps.'
