# Read-only preflight; included by bootstrap.yaml before any gated Kubernetes task.
- name: Require a version and reviewed non-secret release evidence
  ansible.builtin.assert:
    that:
    - config_tag is match('^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$')
    - config_release_evidence != '/UNCONFIGURED/platform-release.json'
- name: Read only the supplied release metadata
  ansible.builtin.set_fact:
    config_release: "{{ lookup('ansible.builtin.file', config_release_evidence) | from_json }}"
- name: Refuse inconsistent release metadata
  ansible.builtin.assert:
    that:
    - config_release.tag == config_tag
    - config_repository == 'https://github.com/' ~ config_release.repository ~ '.git'
    - config_release.resolvedCommit is match('^[0-9a-f]{40}$')
- name: Reject missing unpublished or retargeted tag without Kubernetes access
  ansible.builtin.command:
    argv:
    - bash
    - '{{ playbook_dir }}/../../../scripts/verify-release-ref.sh'
    - '{{ config_release.repository }}'
    - '{{ config_tag }}'
    - '{{ config_release.resolvedCommit }}'
  changed_when: false
- name: Read selected released cluster entrypoint without Kubernetes access
  ansible.builtin.command:
    argv:
    - gh
    - api
    - "repos/{{ config_release.repository }}/contents/{{ gitops_path | regex_replace('^[.]/', '') }}/kustomization.yaml?ref={{ config_release.resolvedCommit }}"
    - --jq
    - .content
  register: released_entrypoint
  changed_when: false
- name: Require released entrypoint to match selected inventory context
  ansible.builtin.assert:
    that:
    - released_context['example.perkforge.io/cluster'] == inventory_hostname
    - released_context['example.perkforge.io/environment'] == deployment_environment
    - released_context['example.perkforge.io/profile'] == impact_profile
  vars:
    released_context: "{{ (released_entrypoint.stdout | b64decode | from_yaml).commonAnnotations }}"
