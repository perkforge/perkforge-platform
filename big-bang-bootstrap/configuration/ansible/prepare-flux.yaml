# Use the release's supported pinned prerequisite manifests unchanged.
- name: Select the pinned Flux prerequisite build
  ansible.builtin.set_fact:
    flux_manifest_path: '{{ flux_checkout }}/base/flux'
# Optional environment placement; never edits pinned prerequisite files/resources.
- name: Prepare explicitly selected kustomize-controller placement overlay
  when: flux_kustomize_node_selector | default({}) | length > 0
  block:
  - ansible.builtin.assert:
      that:
      - flux_kustomize_node_selector is mapping
      - flux_kustomize_node_selector.get('kubernetes.io/os', 'linux') == 'linux'
      - flux_kustomize_node_selector | length <= 4
  - ansible.builtin.file:
      path: '{{ flux_checkout }}/base/perkforge-flux-placement'
      state: directory
      mode: '0700'
  - ansible.builtin.template:
      src: flux-placement.yaml.j2
      dest: '{{ flux_checkout }}/base/perkforge-flux-placement/kustomization.yaml'
      mode: '0600'
  - ansible.builtin.set_fact:
      flux_manifest_path: '{{ flux_checkout }}/base/perkforge-flux-placement'

# Default-off sizing/placement for the bootstrap-owned Helm controller.
- name: Prepare explicitly selected Helm controller capacity overlay
  when: flux_helm_capacity_overlay | default(false) | bool
  block:
  - ansible.builtin.assert:
      that:
      - flux_helm_cpu_request_millicores is defined
      - flux_helm_cpu_request_millicores | string is match('^[0-9]+$')
      - flux_helm_cpu_request_millicores | int >= 250
      - flux_helm_cpu_request_millicores | int <= 900
      - flux_helm_node_selector is defined
      - flux_helm_node_selector is mapping
      - flux_helm_node_selector | length > 0
      - flux_helm_node_selector | length <= 4
      - flux_helm_node_selector.get('kubernetes.io/os', 'linux') == 'linux'
  - ansible.builtin.file:
      path: '{{ flux_checkout }}/base/perkforge-flux-capacity'
      state: directory
      mode: '0700'
  - ansible.builtin.template:
      src: flux-capacity.yaml.j2
      dest: '{{ flux_checkout }}/base/perkforge-flux-capacity/kustomization.yaml'
      mode: '0600'
  - ansible.builtin.set_fact:
      flux_manifest_path: '{{ flux_checkout }}/base/perkforge-flux-capacity'
