- name: Protect every ESO operator task and loop result
  no_log: true
  block:
  # Used only by ESO input stages under no_log. No adoption, updates or repair.
  - name: Inspect all named targets before creating any
    ansible.builtin.command:
      argv: '{{ eso_k + ["-n", item.metadata.namespace, "get", item.kind | lower, item.metadata.name, "--ignore-not-found", "-o", "json"] }}'
    loop: '{{ eso_desired }}'
    register: eso_existing
    changed_when: false
  - ansible.builtin.assert:
      that: item.stdout | trim == '' or (item.stdout | from_json) | eso_input_matches(item.item)
      quiet: true
    loop: '{{ eso_existing.results }}'
  - name: Server-validate every missing target before creation
    ansible.builtin.command:
      argv: '{{ eso_k + ["create", "--dry-run=server", "-f", "-"] }}'
      stdin: '{{ item.item | to_json }}'
    when: item.stdout | trim == ''
    loop: '{{ eso_existing.results }}'
    changed_when: false
  - name: Create only missing targets; concurrent collisions fail closed
    ansible.builtin.command:
      argv: '{{ eso_k + ["create", "--field-manager=perkforge-eso-inputs", "-f", "-"] }}'
      stdin: '{{ item.item | to_json }}'
    when: item.stdout | trim == ''
    loop: '{{ eso_existing.results }}'
    changed_when: true
  - name: Require exact owned readback after first run and unchanged repeat
    ansible.builtin.command:
      argv: '{{ eso_k + ["-n", item.metadata.namespace, "get", item.kind | lower, item.metadata.name, "-o", "json"] }}'
    loop: '{{ eso_desired }}'
    register: eso_readback
    changed_when: false
  - ansible.builtin.assert:
      that: (item.stdout | from_json) | eso_input_matches(item.item)
      quiet: true
    loop: '{{ eso_readback.results }}'
