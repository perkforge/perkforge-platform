- name: Validate exact management principals and HTTPS endpoints
  ansible.builtin.assert:
    that:
    - rancher_oidc_client_id | length > 0
    - rancher_oidc_issuer is match('^https://[^/]+/.+')
    - not ('UNCONFIGURED' in rancher_oidc_issuer)
    - not rancher_oidc_issuer.endswith('/')
    - rancher_management_groups | length > 0
    - rancher_management_groups | unique | length == rancher_management_groups | length
- name: Refuse tenant/application-developer login principals
  ansible.builtin.assert:
    that:
    - item is match('^genericoidc_group:///platform/[A-Za-z0-9][A-Za-z0-9/_-]*$')
    - item != 'genericoidc_group:///platform/developers'
  loop: '{{ rancher_management_groups }}'
- name: Require deliberate per-group global-role bindings
  ansible.builtin.assert:
    that:
    - item.name is match('^[a-z0-9][a-z0-9-]*$')
    - item.groupPrincipalName in rancher_management_groups
    - item.globalRoleName | length > 0
    - item.globalRoleName != 'admin' or item.groupPrincipalName == 'genericoidc_group:///platform/admins'
  loop: '{{ rancher_management_bindings }}'
- name: Refuse ambiguous credential paths
  ansible.builtin.assert:
    that:
    - rancher_oidc_secret_file is match('^/')
    - rancher_oidc_secret_file | realpath == rancher_oidc_secret_file
- name: Inspect only the designated client credential file
  ansible.builtin.stat:
    path: '{{ rancher_oidc_secret_file }}'
    follow: false
  register: rancher_oidc_secret
  no_log: true
- name: Reject exposed or empty client credentials
  ansible.builtin.assert:
    that:
    - rancher_oidc_secret.stat.isreg | default(false)
    - not (rancher_oidc_secret.stat.islnk | default(false))
    - rancher_oidc_secret.stat.mode == '0600'
    - rancher_oidc_secret.stat.pw_name == lookup('ansible.builtin.env', 'USER')
    - rancher_oidc_secret.stat.size > 0
  no_log: true
- name: Read only the validated designated secret into noncached process memory
  ansible.builtin.set_fact:
    rancher_oidc_secret_value: "{{ lookup('ansible.builtin.file', rancher_oidc_secret_file) | trim }}"
    cacheable: false
  no_log: true
- name: Refuse whitespace-only client credentials
  ansible.builtin.assert:
    that: rancher_oidc_secret_value | length > 0
  no_log: true
- name: Build only managed nonsecret provider settings
  ansible.builtin.set_fact:
    rancher_oidc_settings:
      type: genericOIDCConfig
      enabled: true
      accessMode: required
      allowedPrincipalIds: '{{ rancher_management_groups }}'
      clientId: '{{ rancher_oidc_client_id }}'
      rancherUrl: 'https://{{ rancher_hostname }}/verify-auth'
      rancherApiHost: 'https://{{ rancher_hostname }}'
      issuer: '{{ rancher_oidc_issuer }}'
      authEndpoint: '{{ rancher_oidc_issuer }}/protocol/openid-connect/auth'
      tokenEndpoint: '{{ rancher_oidc_issuer }}/protocol/openid-connect/token'
      userInfoEndpoint: '{{ rancher_oidc_issuer }}/protocol/openid-connect/userinfo'
      jwksUrl: '{{ rancher_oidc_issuer }}/protocol/openid-connect/certs'
      scope: openid profile email
      groupsClaim: groups
      nameClaim: preferred_username
      emailClaim: email
      groupSearchEnabled: true
      clientAuthenticatedSearch: false
- name: Reconcile approved provider and management bindings without logging credentials
  no_log: true
  block:
  - name: Inspect existing auth providers without printing their contents
    ansible.builtin.command:
      argv: ['{{ rancher_kubectl }}', --kubeconfig, '{{ rancher_kubeconfig }}', --context, '{{ rancher_context }}', --request-timeout=20s, get, authconfigs.management.cattle.io, -o, json]
    register: rancher_auth_read
    changed_when: false
  - ansible.builtin.set_fact:
      rancher_auth_configs: "{{ (rancher_auth_read.stdout | from_json)['items'] }}"
  - name: Preserve local break-glass auth and refuse competing external providers
    ansible.builtin.assert:
      that:
      - rancher_auth_configs | selectattr('metadata.name', 'equalto', 'local') | selectattr('enabled', 'equalto', true) | list | length == 1
      - rancher_auth_configs | selectattr('enabled', 'defined') | selectattr('enabled', 'equalto', true) | rejectattr('metadata.name', 'in', ['local', 'genericoidc']) | list | length == 0
      - rancher_auth_configs | selectattr('metadata.name', 'equalto', 'genericoidc') | list | length == 1
  - ansible.builtin.set_fact:
      rancher_oidc_current: "{{ rancher_auth_configs | selectattr('metadata.name', 'equalto', 'genericoidc') | first }}"
  - name: Refuse unowned settings or an unexpected provider type
    ansible.builtin.assert:
      that:
      - rancher_oidc_current.type | default('genericOIDCConfig') == 'genericOIDCConfig'
      - >-
        (rancher_oidc_current.metadata.labels | default({})).get('platform.perkforge.io/managed-by', '') == 'platform-ansible'
        or (not (rancher_oidc_current.enabled | default(false))
            and not (rancher_oidc_current.clientId | default(''))
            and not (rancher_oidc_current.issuer | default(''))
            and not (rancher_oidc_current.authEndpoint | default('')))
  - name: Inspect global roles and existing group bindings before any writes
    ansible.builtin.command:
      argv: ['{{ rancher_kubectl }}', --kubeconfig, '{{ rancher_kubeconfig }}', --context, '{{ rancher_context }}', --request-timeout=20s, get, '{{ item }}', -o, json]
    loop: [globalroles.management.cattle.io, globalrolebindings.management.cattle.io]
    register: rancher_role_reads
    changed_when: false
  - ansible.builtin.set_fact:
      rancher_roles: "{{ (rancher_role_reads.results[0].stdout | from_json)['items'] }}"
      rancher_bindings: "{{ (rancher_role_reads.results[1].stdout | from_json)['items'] }}"
  - name: Refuse unknown roles and conflicting immutable binding identities
    ansible.builtin.assert:
      that:
      - item.globalRoleName in (rancher_roles | map(attribute='metadata.name') | list)
      - existing | length == 0 or ((existing[0].metadata.labels | default({})).get('platform.perkforge.io/managed-by', '') == 'platform-ansible' and existing[0].groupPrincipalName == item.groupPrincipalName and existing[0].globalRoleName == item.globalRoleName and not (existing[0].userName | default('')) and not (existing[0].userPrincipalName | default('')))
    vars:
      existing: "{{ rancher_bindings | selectattr('metadata.name', 'equalto', item.name) | list }}"
    loop: '{{ rancher_management_bindings }}'
  - name: Require explicit revocation review for previously owned bindings omitted from desired inputs
    ansible.builtin.assert:
      that: item.metadata.name in (rancher_management_bindings | map(attribute='name') | list)
    when: (item.metadata.labels | default({})).get('platform.perkforge.io/managed-by', '') == 'platform-ansible'
    loop: '{{ rancher_bindings }}'
  - ansible.builtin.set_fact:
      rancher_oidc_drift: false
  - name: Compare only authored managed fields, allowing unrelated server defaults
    ansible.builtin.set_fact:
      rancher_oidc_drift: true
    when: rancher_oidc_current.get(item.key, none) != item.value
    loop: '{{ rancher_oidc_settings | dict2items }}'
  - name: Patch only the owned provider through private stdin when managed settings differ
    when: rancher_oidc_drift | bool
    ansible.builtin.command:
      argv: ['{{ rancher_kubectl }}', --kubeconfig, '{{ rancher_kubeconfig }}', --context, '{{ rancher_context }}', --request-timeout=20s, patch, authconfig.management.cattle.io, genericoidc, --type=merge, --patch-file=/dev/stdin]
      stdin: "{{ rancher_oidc_settings | combine({'metadata': {'resourceVersion': rancher_oidc_current.metadata.resourceVersion, 'labels': {'platform.perkforge.io/managed-by': 'platform-ansible'}}, 'clientSecret': rancher_oidc_secret_value}) | to_json }}"
  - name: Apply only explicit management group bindings
    ansible.builtin.command:
      argv: ['{{ rancher_kubectl }}', --kubeconfig, '{{ rancher_kubeconfig }}', --context, '{{ rancher_context }}', --request-timeout=20s, apply, -f, '-']
      stdin: "{{ {'apiVersion': 'management.cattle.io/v3', 'kind': 'GlobalRoleBinding', 'metadata': {'name': item.name, 'labels': {'platform.perkforge.io/managed-by': 'platform-ansible'}}, 'groupPrincipalName': item.groupPrincipalName, 'globalRoleName': item.globalRoleName} | to_json }}"
    register: rancher_binding_result
    changed_when: "'created' in rancher_binding_result.stdout or 'configured' in rancher_binding_result.stdout"
    loop: '{{ rancher_management_bindings }}'
  - name: Read back provider settings without displaying secrets
    ansible.builtin.command:
      argv: ['{{ rancher_kubectl }}', --kubeconfig, '{{ rancher_kubeconfig }}', --context, '{{ rancher_context }}', --request-timeout=20s, get, authconfig.management.cattle.io, genericoidc, -o, json]
    register: rancher_auth_after
    changed_when: false
  - name: Verify all managed nonsecret fields and preserve local auth
    ansible.builtin.assert:
      that: (rancher_auth_after.stdout | from_json).get(item.key, none) == item.value
    loop: '{{ rancher_oidc_settings | dict2items }}'
