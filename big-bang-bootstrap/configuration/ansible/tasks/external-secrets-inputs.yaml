- name: Protect every ESO operator task and loop result
  no_log: true
  block:
  - ansible.builtin.set_fact:
      eso_desired: []
  - name: Copy only the already approved Registry1 entry, without generation
    when: external_secrets_registry_apply
    block:
    - ansible.builtin.command:
        argv: '{{ eso_k + ["-n", "flux-system", "get", "secret", "private-registry", "-o", "json"] }}'
      register: eso_registry
      changed_when: false
    - ansible.builtin.assert:
        that: (eso_registry.stdout | from_json) | eso_registry_valid
    - ansible.builtin.set_fact:
        eso_registry_entry: '{{ ((eso_registry.stdout | from_json).data[".dockerconfigjson"] | b64decode | from_json).auths["registry1.dso.mil"] }}'
    - ansible.builtin.set_fact:
        eso_desired: '{{ eso_desired + [eso_registry_object] }}'
      vars:
        eso_registry_object:
          apiVersion: v1
          kind: Secret
          metadata:
            name: private-registry
            namespace: external-secrets
            labels: {perkforge.io/owner: external-secrets-inputs-v1}
          immutable: true
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: '{{ {"auths": {"registry1.dso.mil": {"auth": eso_registry_entry.auth}}} | to_json | b64encode }}'
  - name: Verify and deliver only the separately approved public CA
    when: external_secrets_ca_apply or external_secrets_activation_apply
    block:
    - ansible.builtin.assert:
        that:
        - external_secrets_ca_file is match('^/')
        - not external_secrets_ca_file.startswith('/UNCONFIGURED/')
        - external_secrets_ca_file | realpath == external_secrets_ca_file
        - external_secrets_expected_ca_sha256 is match('^[0-9a-f]{64}$')
    - ansible.builtin.stat:
        path: '{{ external_secrets_ca_file }}'
        follow: false
        get_checksum: false
        get_mime: false
      register: eso_ca_stat
    - ansible.builtin.assert:
        that:
        - eso_ca_stat.stat.isreg | default(false)
        - not eso_ca_stat.stat.islnk | default(false)
        - eso_ca_stat.stat.size > 0 and eso_ca_stat.stat.size < 16384
    - ansible.builtin.set_fact:
        eso_ca: '{{ lookup("file", external_secrets_ca_file) }}'
    - ansible.builtin.assert:
        that: eso_ca | eso_public_pem
    - ansible.builtin.command:
        argv: [openssl, x509, -noout, -fingerprint, -sha256, -ext, basicConstraints, -checkend, '86400']
        stdin: '{{ eso_ca }}'
      register: eso_ca_validation
      changed_when: false
    - ansible.builtin.assert:
        that:
        - "'CA:TRUE' in eso_ca_validation.stdout"
        - (eso_ca_validation.stdout | regex_findall('(?i)sha256 Fingerprint=([0-9A-F:]+)') | first | replace(':', '') | lower) == external_secrets_expected_ca_sha256
    - ansible.builtin.set_fact:
        eso_ca_object:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: openbao-ca
            namespace: external-secrets
            labels: {perkforge.io/owner: external-secrets-inputs-v1}
          immutable: true
          data: {ca.crt: '{{ eso_ca }}'}
    - ansible.builtin.set_fact:
        eso_desired: '{{ eso_desired + [eso_ca_object] }}'
      when: external_secrets_ca_apply
  - name: Prepare only the protected exact provider host route
    when: external_secrets_network_apply or external_secrets_activation_apply
    block:
    - ansible.builtin.assert:
        that:
        - external_secrets_provider_file is match('^/')
        - not external_secrets_provider_file.startswith('/UNCONFIGURED/')
        - external_secrets_provider_file | realpath == external_secrets_provider_file
        - not external_secrets_provider_file.startswith((playbook_dir ~ '/../../..') | realpath ~ '/')
    - ansible.builtin.stat:
        path: '{{ external_secrets_provider_file }}'
        follow: false
        get_checksum: false
        get_mime: false
      register: eso_provider_stat
    - ansible.builtin.assert:
        that:
        - eso_provider_stat.stat.isreg | default(false)
        - not eso_provider_stat.stat.islnk | default(false)
        - eso_provider_stat.stat.mode == '0600'
        - eso_provider_stat.stat.uid == lookup('pipe', 'id -u') | int
        - eso_provider_stat.stat.size > 0 and eso_provider_stat.stat.size < 32
    - ansible.builtin.set_fact:
        eso_provider: '{{ lookup("file", external_secrets_provider_file) }}'
    - ansible.builtin.assert:
        that: eso_provider | eso_provider_valid
    - ansible.builtin.set_fact:
        eso_network_values:
          addons:
            externalSecrets:
              values:
                networkPolicies:
                  egress:
                    definitions:
                      openbao-approved:
                        to: [{ipBlock: {cidr: '{{ eso_provider }}'}}]
                        ports: [{protocol: TCP, port: 443}]
                    from:
                      external-secrets:
                        to:
                          definition:
                            secrets-api-subnets: false
                            openbao-approved: true
    - ansible.builtin.set_fact:
        eso_network_object:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: external-secrets-network-values
            namespace: bigbang
            labels: {perkforge.io/owner: external-secrets-inputs-v1}
          immutable: true
          data: {values.yaml: '{{ eso_network_values | to_nice_yaml }}'}
    - ansible.builtin.set_fact:
        eso_desired: '{{ eso_desired + [eso_network_object] }}'
      when: external_secrets_network_apply
  - ansible.builtin.include_tasks: external-secrets-owned.yaml
  - name: Prepare activation permission only after independently approved prerequisites
    when: external_secrets_activation_apply
    block:
    - ansible.builtin.assert:
        that: external_secrets_activation_prerequisites_approved
        fail_msg: Foundation, controller trust, native network and capacity acceptance require explicit approval.
    - name: Read only the three exact activation prerequisites
      ansible.builtin.command:
        argv: '{{ eso_k + ["-n", item.namespace, "get", item.kind, item.name, "-o", "json"] }}'
      loop:
      - {namespace: external-secrets, kind: secret, name: private-registry}
      - {namespace: external-secrets, kind: configmap, name: openbao-ca}
      - {namespace: bigbang, kind: configmap, name: external-secrets-network-values}
      register: eso_prerequisites
      changed_when: false
    - ansible.builtin.assert:
        that:
        - (eso_prerequisites.results[0].stdout | from_json) | eso_input_owned
        - (eso_prerequisites.results[0].stdout | from_json) | eso_registry_valid
        - (eso_prerequisites.results[1].stdout | from_json) | eso_input_matches(eso_ca_object)
        - (eso_prerequisites.results[2].stdout | from_json) | eso_input_matches(eso_network_object)
    - ansible.builtin.set_fact:
        eso_desired:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: external-secrets-activation-values
            namespace: bigbang
            labels: {perkforge.io/owner: external-secrets-inputs-v1}
          immutable: true
          data:
            values.yaml: "addons:\n  externalSecrets:\n    flux:\n      suspend: false\n"
    - ansible.builtin.include_tasks: external-secrets-owned.yaml
