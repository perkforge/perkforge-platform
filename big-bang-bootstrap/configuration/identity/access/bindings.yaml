apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: local-platform-admin}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects:
- {kind: Group, name: 'oidc:/platform/admins', apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: identity-developer-observer, namespace: headlamp}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: local-identity-observer}
subjects:
- {kind: Group, name: 'oidc:/platform/developers', apiGroup: rbac.authorization.k8s.io}
