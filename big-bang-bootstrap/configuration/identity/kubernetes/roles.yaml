# Developer reads are granted only by the headlamp namespace RoleBinding.
# Platform admins use the built-in cluster-admin role, not a custom subset.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: local-identity-observer}
rules:
- apiGroups: ['']
  resources: [pods, services]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, replicasets, statefulsets]
  verbs: [get, list, watch]
