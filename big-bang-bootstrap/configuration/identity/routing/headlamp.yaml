apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-identity
  namespace: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts: [headlamp-local-il2.example.test]
    secretName: headlamp-local-tls
  rules:
  - host: headlamp-local-il2.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: headlamp-headlamp, port: {number: 4466}}
