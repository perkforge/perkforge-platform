  - networkpolicies
  resourceNames:
  - tenant-runner-reviewed-egress
  verbs:
  - get
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal-runner-source-owner
  namespace: gitlab-tenant-portal-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
