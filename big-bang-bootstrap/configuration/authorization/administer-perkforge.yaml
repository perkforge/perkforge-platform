- name: Explicitly delegate full administration within the PerkForge realm
  hosts: bootstrap_clusters
  gather_facts: false
  vars:
    perkforge_admin_apply: false
    perkforge_admin_inspect: false
    perkforge_admin_scope: UNAPPROVED
    perkforge_admin_recovery_preserved: false
    perkforge_admin_url: https://keycloak.perkforge.home.arpa/auth
    perkforge_admin_ca: /UNCONFIGURED/root-ca.crt
    perkforge_admin_username_file: /UNCONFIGURED/master-username
    perkforge_admin_password_file: /UNCONFIGURED/master-password
    perkforge_admin_group_id: UNCONFIGURED
    perkforge_admin_parent_id: UNCONFIGURED
  module_defaults:
    ansible.builtin.uri:
      validate_certs: true
      ca_path: '{{ perkforge_admin_ca }}'
      follow_redirects: none
      unredirected_headers: [Authorization]
      use_netrc: false
      use_proxy: false
      timeout: 20
  tasks:
  - name: Default and check mode never contact APIs or read credentials
    ansible.builtin.debug:
      msg: 'Full PerkForge realm delegation only; apply={{ perkforge_admin_apply | bool }} inspect={{ perkforge_admin_inspect | bool }} check={{ ansible_check_mode }}. No master grants, account changes or application SSO.'
  - name: Operate only after separate approval of exact group and privilege scope
    when: (perkforge_admin_apply | bool or perkforge_admin_inspect | bool) and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        that:
        - ansible_play_hosts_all == ['local']
        - deployment_environment == 'local' and impact_profile == 'il2'
        - perkforge_admin_scope == 'perkforge-full-realm-admin-v1'
        - perkforge_admin_recovery_preserved | bool
        - perkforge_admin_url is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?/auth$')
        - perkforge_admin_ca is match('^/') and not perkforge_admin_ca.startswith('/UNCONFIGURED/')
        - perkforge_admin_group_id != 'UNCONFIGURED' and perkforge_admin_group_id is match('^[A-Za-z0-9-]+$')
        - perkforge_admin_parent_id != 'UNCONFIGURED' and perkforge_admin_parent_id is match('^[A-Za-z0-9-]+$')
        - perkforge_admin_group_id != perkforge_admin_parent_id
        - expected_cluster_uid != 'UNCONFIGURED'
        - target_kubeconfig != '/UNCONFIGURED/kubeconfig' and target_context != 'UNCONFIGURED'
    - name: Verify the selected physical target before authenticating
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, '{{ target_kubeconfig }}', --context, '{{ target_context }}', get, namespace, kube-system, -o, 'jsonpath={.metadata.uid}']
      register: pa_uid
      changed_when: false
    - ansible.builtin.assert:
        that: pa_uid.stdout == expected_cluster_uid
    - name: Keep existing administrator credentials and API payloads private
      no_log: true
      block:
      - ansible.builtin.stat:
          path: '{{ item }}'
          follow: false
        loop: ['{{ perkforge_admin_username_file }}', '{{ perkforge_admin_password_file }}']
        register: pa_files
      - ansible.builtin.assert:
          that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.mode == '0600'
          - item.stat.pw_name == lookup('env', 'USER')
          - item.stat.size > 0
        loop: '{{ pa_files.results }}'
      - name: Authenticate existing master recovery without changing it
        ansible.builtin.uri:
          url: '{{ perkforge_admin_url }}/realms/master/protocol/openid-connect/token'
          method: POST
          body_format: form-urlencoded
          body:
            grant_type: password
            client_id: admin-cli
            username: "{{ lookup('file', perkforge_admin_username_file) | trim }}"
            password: "{{ lookup('file', perkforge_admin_password_file) | trim }}"
        register: pa_login
      - ansible.builtin.set_fact:
          pa_api: '{{ perkforge_admin_url }}/admin/realms/perkforge'
          pa_headers: {Authorization: 'Bearer {{ pa_login.json.access_token }}'}
          pa_role_names: [realm-admin]
          pa_child_names: [create-client, impersonation, manage-authorization, manage-clients, manage-events, manage-identity-providers, manage-organizations, manage-realm, manage-users, query-clients, query-groups, query-organizations, query-realms, query-users, view-authorization, view-clients, view-events, view-identity-providers, view-organizations, view-realm, view-users]
      - ansible.builtin.include_tasks: tasks/perkforge-admin.yaml
      always:
      - name: Discard administrator authentication facts without persistence
        ansible.builtin.set_fact:
          pa_login: {}
          pa_headers: {}
          cacheable: false
        no_log: true
