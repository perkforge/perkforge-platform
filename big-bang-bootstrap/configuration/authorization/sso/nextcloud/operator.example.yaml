# External action-time inputs. Existing short-lived token/secret only; no values here.
nextcloud_client_run: false
nextcloud_client_operation: inspect
nextcloud_client_approval: UNAPPROVED
nextcloud_recovery_verified: false
nextcloud_native_ready: false
nextcloud_provisioning_approval: UNAPPROVED
nextcloud_sso_origin: https://nextcloud.example.invalid
nextcloud_sso_issuer: https://identity.example.invalid/auth/realms/perkforge
nextcloud_operator_token_file: /UNCONFIGURED/operator-token
nextcloud_client_secret_file: /UNCONFIGURED/client-secret
nextcloud_ca_file: /UNCONFIGURED/public-ca.pem
# Confirmed target: Corey existing verified sub -> owner; do not resolve by username/email.
# Jett household enrollment is deferred. Keep this empty until separate action-time approval.
nextcloud_subjects: []
nextcloud_native_revoked_subjects: []

# Physical routing uses this exact browser-verified callback. Keep both operators identical.
nextcloud_sso_callback_path: /apps/user_oidc/code
