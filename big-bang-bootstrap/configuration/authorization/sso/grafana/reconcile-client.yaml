- name: Prepare or inspect only the disabled owned Grafana client
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [../client-scopes.yaml]
  vars:
    grafana_client_run: false
    grafana_client_operation: inspect
    grafana_client_approval: UNAPPROVED
    grafana_recovery_verified: false
    grafana_sso_origin: https://grafana.example.invalid
    grafana_sso_issuer: https://identity.example.invalid/auth/realms/perkforge
    grafana_operator_token_file: /UNCONFIGURED/operator-token
    grafana_client_secret_file: /UNCONFIGURED/client-secret
    grafana_ca_file: /UNCONFIGURED/public-ca.pem
  module_defaults:
    ansible.builtin.uri:
      validate_certs: true
      ca_path: '{{ grafana_ca_file }}'
      use_proxy: false
      use_netrc: false
      follow_redirects: none
      unredirected_headers: [Authorization]
      timeout: 20
  tasks:
  - ansible.builtin.debug:
      msg: 'Default/check contact no APIs or private files. Only disabled-client prepare/inspect; no activation, grants, token issuance or Kubernetes delivery.'
  - when: grafana_client_run | bool and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        that:
        - grafana_client_operation in ['inspect', 'prepare']
        - grafana_client_approval == 'grafana-client-' + grafana_client_operation + '-v1'
        - grafana_recovery_verified | bool
        - grafana_sso_origin is not search("[\\x00-\\x20\\x7f]")
        - grafana_sso_issuer is not search("[\\x00-\\x20\\x7f]")
        - grafana_sso_origin is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
        - grafana_sso_issuer is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?(/auth)?/realms/perkforge$')
        - (grafana_sso_origin | urlsplit('port')) is none or 1 <= (grafana_sso_origin | urlsplit('port')) <= 65535
        - (grafana_sso_issuer | urlsplit('port')) is none or 1 <= (grafana_sso_issuer | urlsplit('port')) <= 65535
        - (grafana_sso_origin | urlsplit('hostname') | lower | regex_replace('\.$', '')) is not search('\.invalid$')
        - (grafana_sso_issuer | urlsplit('hostname') | lower | regex_replace('\.$', '')) is not search('\.invalid$')
        - >-
          (grafana_sso_origin | urlsplit('hostname') | lower | regex_replace('\.$', '')) != (grafana_sso_issuer | urlsplit('hostname') | lower | regex_replace('\.$', ''))
          or ((grafana_sso_origin | urlsplit('port')) or 443) != ((grafana_sso_issuer | urlsplit('port')) or 443)
    - no_log: true
      block:
      - ansible.builtin.command: {argv: [id, -u]}
        register: gf_operator_uid
        changed_when: false
      - ansible.builtin.stat:
          path: '{{ item }}'
          follow: false
        loop: '{{ [grafana_operator_token_file, grafana_ca_file] + ([grafana_client_secret_file] if grafana_client_operation == "prepare" else []) }}'
        register: gf_files
      - ansible.builtin.assert:
          that:
          - item.item is match('^/') and item.item | realpath == item.item
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.size > 0
          - item.item == grafana_ca_file or (item.stat.mode == '0600' and item.stat.uid == (gf_operator_uid.stdout | int))
        loop: '{{ gf_files.results }}'
      - ansible.builtin.stat:
          path: '{{ item | dirname }}'
          follow: false
        loop: '{{ [grafana_operator_token_file] + ([grafana_client_secret_file] if grafana_client_operation == "prepare" else []) }}'
        register: gf_private_parents
      - ansible.builtin.assert:
          that:
          - item.stat.isdir | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.mode == '0700'
          - item.stat.uid == (gf_operator_uid.stdout | int)
        loop: '{{ gf_private_parents.results }}'
      - ansible.builtin.set_fact:
          gf_api: '{{ grafana_sso_issuer | regex_replace("/realms/perkforge$", "/admin/realms/perkforge") }}'
          gf_headers: {Authorization: 'Bearer {{ lookup("file", grafana_operator_token_file) | trim }}'}
          gf_candidate: '{{ lookup("file","client.json") | from_json | combine({"redirectUris":[grafana_sso_origin + "/login/generic_oauth"]}) }}'
      - ansible.builtin.include_tasks: client-tasks.yaml
      always:
      - ansible.builtin.set_fact:
          gf_headers: {}
          gf_secret: ''
          gf_credential: {}
          cacheable: false
        no_log: true
