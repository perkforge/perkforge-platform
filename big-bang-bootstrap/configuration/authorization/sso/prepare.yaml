- name: Prepare coordinated SSO payloads without credentials or API calls
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [desired.yaml]
  tasks:
  - name: Refuse live activation and unexpected app inventory
    ansible.builtin.assert:
      that:
      - sso_apps.keys() | list | sort == ['headlamp', 'openbao', 'rancher']
      - sso_apps.values() | selectattr('apply', 'equalto', true) | list | length == 0
      - sso_apps.values() | map(attribute='client_id') | unique | length == 3
      - sso_realm == 'perkforge'
      - sso_keycloak_origin is match('^https://[a-zA-Z0-9.-]+(:[0-9]+)?$')
      - sso_keycloak_path in ['', '/auth']
  - name: Require distinct exact HTTPS client identities
    ansible.builtin.assert:
      that:
      - item.value.keys() | list | sort == ['apply','client_id','origin']
      - item.value.apply == false
      - item.value.client_id is match('^[a-z][a-z0-9-]{0,62}$')
      - item.value.origin is match('^https://[a-zA-Z0-9.-]+(:[0-9]+)?$')
      - item.value.origin != sso_keycloak_origin
    loop: '{{ sso_apps | dict2items }}'
  - name: Explain preparation boundary
    ansible.builtin.debug:
      msg: 'No APIs, credentials, deployment or restart. Render={{ sso_render | bool }}; per-app activation remains independently gated and unimplemented here.'
  - name: Render explicitly requested private review payloads
    when: sso_render | bool and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        that:
        - sso_environment is match('^[a-z][a-z0-9-]{0,30}$')
        - sso_output_directory is match('^/') and not sso_output_directory.startswith('/UNCONFIGURED/')
        - sso_public_ca_file is match('^/') and not sso_public_ca_file.startswith('/UNCONFIGURED/')
        - sso_keycloak_origin is not search('\.invalid$')
    - ansible.builtin.assert:
        that: item.origin is not search('\.invalid$')
      loop: '{{ sso_apps.values() | list }}'
    - ansible.builtin.stat:
        path: '{{ sso_output_directory }}'
        follow: false
      register: sso_destination
    - ansible.builtin.assert:
        that: not sso_destination.stat.exists
        fail_msg: Preserve previous evidence; choose a fresh output directory.
    - ansible.builtin.file:
        path: '{{ sso_output_directory }}'
        state: directory
        mode: '0700'
    - ansible.builtin.template:
        src: 'templates/{{ item }}.yaml.j2'
        dest: '{{ sso_output_directory }}/{{ item }}.yaml'
        mode: '0600'
        force: false
      loop: [clients, headlamp, rancher, openbao]
