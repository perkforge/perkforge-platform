- name: Deliver reviewed Headlamp credential/trust objects or reconcile only PA RBAC
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [desired.yaml]
  vars:
    sso_headlamp_run: false
    sso_headlamp_operation: inspect
    sso_headlamp_reviewed_scope: UNAPPROVED
    sso_headlamp_recovery_verified: false
    sso_kubectl: kubectl
    sso_kubeconfig: /UNCONFIGURED/kubeconfig
    sso_context: UNCONFIGURED
    sso_cluster_uid: UNCONFIGURED
    sso_headlamp_secret_file: /UNCONFIGURED/client-secret
    sso_headlamp_expected_image: registry1.dso.mil/ironbank/opensource/headlamp-k8s/headlamp:v0.45.0
    sso_headlamp_apiserver_ca_path: /etc/rancher/rke2/identity/ca.crt
  tasks:
  - ansible.builtin.debug:
      msg: 'Headlamp only; run={{ sso_headlamp_run | bool }} operation={{ sso_headlamp_operation }} check={{ ansible_check_mode }}. No deployment/Helm/RKE2 writes or restart. deliver creates only immutable dedicated credential and public trust objects.'
  - when: sso_headlamp_run | bool and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        that:
        - sso_headlamp_operation in ['inspect','deliver','activate','rollback']
        - sso_headlamp_reviewed_scope == ('headlamp-sso-delivery-v1' if sso_headlamp_operation == 'deliver' else 'headlamp-sso-v1')
        - sso_headlamp_recovery_verified | bool
        - sso_cluster_uid != 'UNCONFIGURED' and sso_context != 'UNCONFIGURED'
        - sso_kubeconfig is match('^/') and not sso_kubeconfig.startswith('/UNCONFIGURED/')
        - sso_realm == 'perkforge'
        - sso_headlamp_expected_image is search(':v0\.45\.0$')
        - sso_apps.headlamp.origin is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
        - sso_keycloak_origin is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
        - sso_keycloak_path in ['', '/auth']
        - sso_public_ca_file is match('^/') and not sso_public_ca_file.startswith('/UNCONFIGURED/')
    - ansible.builtin.command:
        argv: ['{{ sso_kubectl }}', --kubeconfig, '{{ sso_kubeconfig }}', --context, '{{ sso_context }}', --request-timeout=20s, get, namespace, kube-system, -o, 'jsonpath={.metadata.uid}']
      register: headlamp_uid
      changed_when: false
    - ansible.builtin.assert:
        that: headlamp_uid.stdout == sso_cluster_uid
    - name: Keep credential/object contents protected
      no_log: true
      block:
      - ansible.builtin.set_fact:
          headlamp_candidate: "{{ lookup('template','templates/headlamp.yaml.j2') | from_yaml }}"
          headlamp_owner: {platform.perkforge.io/sso-owner: headlamp-v1}
          headlamp_secret_name: perkforge-headlamp-sso-v1
          headlamp_ca_name: perkforge-headlamp-sso-v1-ca
      - ansible.builtin.include_tasks: tasks/headlamp-deliver.yaml
        when: sso_headlamp_operation == 'deliver'
      - ansible.builtin.include_tasks: tasks/headlamp.yaml
        when: sso_headlamp_operation != 'deliver'
      always:
      - ansible.builtin.set_fact:
          headlamp_secret_data: {}
          headlamp_private_read: {}
          headlamp_delivery_objects: []
          headlamp_delivery_reads: {}
          headlamp_delivery_after: {}
          headlamp_runtime_secret: {}
          cacheable: false
        no_log: true
