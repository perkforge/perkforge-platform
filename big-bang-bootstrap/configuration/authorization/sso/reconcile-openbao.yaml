- name: Reconcile only the independently approved OpenBao human OIDC stage
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [desired.yaml]
  vars:
    sso_openbao_run: false
    sso_openbao_operation: inspect
    sso_openbao_reviewed_scope: UNAPPROVED
    sso_openbao_recovery_verified: false
    sso_openbao_cluster_id: UNCONFIGURED
    sso_openbao_accessor: UNCONFIGURED
    sso_openbao_token_file: /UNCONFIGURED/operator-token
    sso_openbao_client_secret_file: /UNCONFIGURED/client-secret
  module_defaults:
    ansible.builtin.uri:
      validate_certs: true
      ca_path: '{{ sso_public_ca_file }}'
      use_proxy: false
      use_netrc: false
      follow_redirects: none
      unredirected_headers: [X-Vault-Token]
      timeout: 20
  tasks:
  - ansible.builtin.debug:
      msg: 'OpenBao stage only; run={{ sso_openbao_run | bool }} operation={{ sso_openbao_operation }} check={{ ansible_check_mode }}. No machine auth, user identities or credential generation. prepare enables only a missing owned OIDC mount; prepare-data creates only missing owned platform/tenants KV-v2 engines.'
  - name: Inspect or operate only with explicit application-specific inputs
    when: sso_openbao_run | bool and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        that:
        - sso_openbao_operation in ['prepare', 'prepare-data', 'inspect', 'apply', 'rollback']
        - sso_openbao_reviewed_scope == ('openbao-sso-prepare-v1' if sso_openbao_operation == 'prepare' else 'openbao-data-v1' if sso_openbao_operation == 'prepare-data' else 'openbao-sso-v1')
        - sso_openbao_recovery_verified | bool
        - sso_realm == 'perkforge'
        - sso_openbao_cluster_id != 'UNCONFIGURED'
        - sso_openbao_operation in ['prepare','prepare-data'] or sso_openbao_accessor != 'UNCONFIGURED'
        - sso_apps.openbao.origin is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
        - sso_keycloak_origin is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
        - sso_keycloak_path in ['', '/auth']
        - sso_apps.openbao.client_id is match('^[a-z][a-z0-9-]{0,62}$')
        - sso_public_ca_file is match('^/') and not sso_public_ca_file.startswith('/UNCONFIGURED/')
    - name: Keep credentials and native API representations out of output and diffs
      no_log: true
      block:
      - ansible.builtin.assert:
          that:
          - "'-----BEGIN CERTIFICATE-----' in lookup('file',sso_public_ca_file)"
          - "'PRIVATE KEY' not in lookup('file',sso_public_ca_file)"
      - ansible.builtin.set_fact:
          bao_candidate: "{{ lookup('ansible.builtin.template', 'templates/openbao.yaml.j2') | from_yaml }}"
          bao_api: '{{ sso_apps.openbao.origin }}/v1'
      - ansible.builtin.stat:
          path: '{{ item }}'
          follow: false
        loop: "{{ [sso_openbao_token_file] + ([sso_openbao_client_secret_file] if sso_openbao_operation == 'apply' else []) }}"
        register: bao_private_files
      - ansible.builtin.assert:
          that:
          - item.item is match('^/') and item.item | realpath == item.item
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.mode == '0600'
          - item.stat.pw_name == lookup('env', 'USER')
          - item.stat.size > 0
        loop: '{{ bao_private_files.results }}'
      - ansible.builtin.set_fact:
          bao_headers: {X-Vault-Token: "{{ lookup('file', sso_openbao_token_file) | trim }}"}
      - ansible.builtin.uri:
          url: '{{ bao_api }}/sys/health'
        register: bao_health
      - ansible.builtin.assert:
          that:
          - bao_health.json.cluster_id == sso_openbao_cluster_id
          - bao_health.json.initialized and not bao_health.json.sealed
      - ansible.builtin.include_tasks: tasks/openbao-data.yaml
        when: sso_openbao_operation == 'prepare-data'
      - ansible.builtin.include_tasks: tasks/openbao.yaml
        when: sso_openbao_operation != 'prepare-data'
      always:
      - ansible.builtin.set_fact:
          bao_headers: {}
          bao_secret: ''
          cacheable: false
        no_log: true

  - name: Record only the nonsecret accessor for the next separately reviewed stage
    ansible.builtin.debug:
      msg: 'Prepared OIDC accessor={{ bao_prepared_accessor }}. Record in reviewed external inputs; no role or login/client activation.'
    when: sso_openbao_run | bool and not ansible_check_mode and sso_openbao_operation == 'prepare'
