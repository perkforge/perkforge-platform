# Loaded only after the read-only planner has succeeded with complete authority.
- name: Require separately approved exact delta and edition boundary evidence
  ansible.builtin.assert:
    that:
    - mattermost_membership_apply_confirmed | default(false) is sameas true
    - mattermost_invitation_boundary_verified | default(false) is sameas true
    - mattermost_membership_approved_add | sort == mp_add
    - mattermost_membership_approved_remove | sort == mp_remove
- ansible.builtin.set_fact:
    mp_before:
      subjects: '{{ mp_subjects | sort }}'
      desired: '{{ mp_desired | sort }}'
      add: '{{ mp_add }}'
      remove: '{{ mp_remove }}'
- name: Re-read authoritative groups and native membership immediately before mutations
  ansible.builtin.include_tasks: plan-tasks.yaml
- ansible.builtin.assert:
    that:
    - mp_before.subjects == mp_subjects | sort
    - mp_before.desired == mp_desired | sort
    - mp_before.add == mp_add and mp_before.remove == mp_remove
- name: Remove only unauthorized members of the named channel
  ansible.builtin.uri:
    url: '{{ mattermost_context_origin }}/api/v4/channels/{{ mc.channel_id }}/members/{{ item }}'
    headers: '{{ mc_headers }}'
    method: DELETE
    status_code: 200
  loop: '{{ mp_remove }}'
  changed_when: true
- name: Add only authoritative ordinary channel members
  ansible.builtin.uri:
    url: '{{ mattermost_context_origin }}/api/v4/channels/{{ mc.channel_id }}/members'
    headers: '{{ mc_headers }}'
    method: POST
    body_format: json
    body: {user_id: '{{ item }}'}
    status_code: 201
  loop: '{{ mp_add }}'
  changed_when: true
- name: Read back complete authority and channel membership
  ansible.builtin.include_tasks: plan-tasks.yaml
- ansible.builtin.assert:
    that:
    - mp_before.subjects == mp_subjects | sort
    - mp_before.desired == mp_desired | sort
    - mp_add | length == 0 and mp_remove | length == 0
