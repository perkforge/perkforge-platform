- ansible.builtin.uri:
    url: '{{ mm_api }}'
    headers: '{{ mm_headers }}'
  register: mm_realm
- ansible.builtin.assert:
    that:
    - mm_realm.json.realm == 'perkforge' and mm_realm.json.enabled
    - mm_realm.json.attributes['perkforge-managed'] == 'true'
    - mm_realm.json.attributes['perkforge-purpose'] == 'realm-foundation-v1'
- ansible.builtin.uri:
    url: '{{ mm_api }}/client-scopes'
    headers: '{{ mm_headers }}'
  register: mm_scopes
- ansible.builtin.assert:
    that: mm_scopes.json | selectattr('name','equalto',item) | list | length == 1
  loop: '{{ mm_candidate.defaultClientScopes }}'
- ansible.builtin.include_tasks: ../tasks/client-scope.yaml
  vars:
    sso_client_api: '{{ mm_api }}'
    sso_client_headers: '{{ mm_headers }}'
    sso_scope: '{{ mm_scopes.json | selectattr("name","equalto",mm_scope_name) | first }}'
  loop: '{{ mm_candidate.defaultClientScopes }}'
  loop_control: {loop_var: mm_scope_name}
- ansible.builtin.uri:
    url: '{{ mm_api }}/clients?clientId=mattermost'
    headers: '{{ mm_headers }}'
  register: mm_lookup
- ansible.builtin.assert:
    that:
    - mm_lookup.json | length <= 1
    - mm_lookup.json | length == 1 or mattermost_client_operation == 'prepare'
- ansible.builtin.set_fact:
    mm_secret: '{{ lookup("file",mattermost_client_secret_file) | trim }}'
  when: mattermost_client_operation == 'prepare'
- ansible.builtin.assert:
    that: mm_secret | length >= 24
  when: mattermost_client_operation == 'prepare'
- name: Create one disabled client only when absent; never update or adopt drift
  ansible.builtin.uri:
    url: '{{ mm_api }}/clients'
    headers: '{{ mm_headers }}'
    method: POST
    body_format: json
    body: '{{ mm_candidate | combine({"secret":mm_secret}) }}'
    status_code: 201
  when: mm_lookup.json | length == 0
  changed_when: true
- ansible.builtin.uri:
    url: '{{ mm_api }}/clients?clientId=mattermost'
    headers: '{{ mm_headers }}'
  register: mm_lookup_after
- ansible.builtin.assert:
    that:
    - mm_lookup_after.json | length == 1
    - mm_lookup_after.json[0].clientId == 'mattermost'
    - mm_lookup_after.json[0].id is match('^[A-Za-z0-9-]+$')
    - mm_lookup_after.json[0].id is not search("[\\x00-\\x20\\x7f]")
- ansible.builtin.set_fact:
    mm_id: '{{ mm_lookup_after.json[0].id }}'
- ansible.builtin.uri:
    url: '{{ mm_api }}/clients/{{ mm_id }}'
    headers: '{{ mm_headers }}'
  register: mm_current
- name: Refuse foreign clients and drift; only the owned enabled flag may change
  ansible.builtin.assert:
    that:
    - mm_current.json.get(item.key) == item.value
    - mm_current.json.id == mm_id
    - mm_current.json.authenticationFlowBindingOverrides | default({}) == {}
    - mm_current.json.authorizationServicesEnabled | default(false) == false
  loop: '{{ mm_candidate | dict2items | rejectattr("key","in",["enabled","protocolMappers","attributes","defaultClientScopes","optionalClientScopes"]) | list }}'
- ansible.builtin.assert:
    that:
    - mm_current.json.enabled is boolean
    - mattermost_client_operation != 'prepare' or not mm_current.json.enabled
- ansible.builtin.assert:
    that: mm_current.json.attributes.get(item.key) == item.value
  loop: '{{ mm_candidate.attributes | dict2items }}'
- ansible.builtin.uri:
    url: '{{ mm_api }}/clients/{{ mm_id }}/{{ item }}'
    headers: '{{ mm_headers }}'
  loop: [default-client-scopes, optional-client-scopes, protocol-mappers/models, scope-mappings, 'roles?first=0&max=2&briefRepresentation=false']
  register: mm_surface
- ansible.builtin.assert:
    that:
    - mm_surface.results[0].json | map(attribute='name') | sort == mm_candidate.defaultClientScopes | sort
    - mm_surface.results[1].json | length == 0
    - mm_surface.results[3].json.realmMappings | default([]) | length == 0
    - mm_surface.results[3].json.clientMappings | default({}) | length == 0
    - mm_surface.results[4].json | length == 0
    - mm_surface.results[2].json | length == mm_candidate.protocolMappers | length
    - mm_surface.results[2].json | map(attribute='name') | sort == mm_candidate.protocolMappers | map(attribute='name') | sort
- ansible.builtin.assert:
    that:
    - actual.protocol == item.protocol
    - actual.protocolMapper == item.protocolMapper
    - normalized == item.config
    - not (actual.consentRequired | default(false))
  vars:
    actual: '{{ mm_surface.results[2].json | selectattr("name","equalto",item.name) | first }}'
    normalized: '{{ actual.config }}'
  loop: '{{ mm_candidate.protocolMappers }}'
- when: mattermost_client_operation == 'prepare'
  block:
  - ansible.builtin.uri:
      url: '{{ mm_api }}/clients/{{ mm_id }}/client-secret'
      headers: '{{ mm_headers }}'
    register: mm_credential
  - ansible.builtin.assert:
      that: mm_credential.json.value == mm_secret

- name: Change only the owned client enabled flag; rollback preserves roles and credentials
  ansible.builtin.uri:
    url: '{{ mm_api }}/clients/{{ mm_id }}'
    headers: '{{ mm_headers }}'
    method: PUT
    body_format: json
    body: {enabled: '{{ mattermost_client_operation == "activate" }}', webOrigins: []}
    status_code: 204
  when: mattermost_client_operation in ['activate','rollback'] and mm_current.json.enabled != (mattermost_client_operation == 'activate')
  changed_when: true
- when: mattermost_client_operation in ['activate','rollback']
  block:
  - ansible.builtin.uri:
      url: '{{ mm_api }}/clients/{{ mm_id }}'
      headers: '{{ mm_headers }}'
    register: mm_verified
  - ansible.builtin.assert:
      that: mm_verified.json == mm_current.json | combine({'enabled':mattermost_client_operation == 'activate'})
