- name: Render a disabled Mattermost client independently of existing app clients
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mattermost_sso_render: false
    mattermost_sso_origin: https://mattermost.example.invalid
    mattermost_sso_issuer: https://identity.example.invalid/auth/realms/perkforge
    mattermost_sso_output: /UNCONFIGURED/mattermost-sso-review
  tasks:
  - name: Require exact independent HTTPS identities
    ansible.builtin.assert:
      that:
      - mattermost_sso_origin is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
      - mattermost_sso_issuer is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?(/auth)?/realms/perkforge$')
      - (mattermost_sso_origin | urlsplit('port')) is none or 1 <= (mattermost_sso_origin | urlsplit('port')) <= 65535
      - (mattermost_sso_issuer | urlsplit('port')) is none or 1 <= (mattermost_sso_issuer | urlsplit('port')) <= 65535
      - >-
        (mattermost_sso_origin | urlsplit('hostname') | lower | regex_replace('\.$', '')) != (mattermost_sso_issuer | urlsplit('hostname') | lower | regex_replace('\.$', ''))
        or ((mattermost_sso_origin | urlsplit('port')) or 443) != ((mattermost_sso_issuer | urlsplit('port')) or 443)
  - ansible.builtin.debug:
      msg: 'Review preparation only; no API, credentials, grants, native activation or existing SSO app changes.'
  - when: mattermost_sso_render | bool and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        that:
        - mattermost_sso_origin is not search("[\\x00-\\x20\\x7f]")
        - mattermost_sso_issuer is not search("[\\x00-\\x20\\x7f]")
        - mattermost_sso_output is match('^/') and not mattermost_sso_output.startswith('/UNCONFIGURED/')
        - (mattermost_sso_origin | urlsplit('hostname') | lower | regex_replace('\.$', '')) is not search('\.invalid$')
        - (mattermost_sso_issuer | urlsplit('hostname') | lower | regex_replace('\.$', '')) is not search('\.invalid$')
    - ansible.builtin.stat:
        path: '{{ mattermost_sso_output }}'
        follow: false
      register: destination
    - ansible.builtin.assert:
        that: not destination.stat.exists
        fail_msg: Preserve previous/interrupted output and choose a fresh directory.
    - ansible.builtin.file:
        path: '{{ mattermost_sso_output }}'
        state: directory
        mode: '0700'
    - ansible.builtin.copy:
        content: "{{ lookup('file', 'client.json') | from_json | combine({'redirectUris':[mattermost_sso_origin + '/signup/openid/complete']}) | to_nice_json }}"
        dest: '{{ mattermost_sso_output }}/client.json'
        mode: '0600'
        force: false
    - ansible.builtin.template:
        src: values.yaml.j2
        dest: '{{ mattermost_sso_output }}/values.yaml'
        mode: '0600'
        force: false
