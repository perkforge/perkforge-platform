- ansible.builtin.uri:
    url: '{{ hb_api }}'
    headers: '{{ hb_headers }}'
  register: hb_realm
- ansible.builtin.assert:
    that:
    - hb_realm.json.realm == 'perkforge' and hb_realm.json.enabled
    - hb_realm.json.attributes['perkforge-managed'] == 'true'
    - hb_realm.json.attributes['perkforge-purpose'] == 'realm-foundation-v1'
- ansible.builtin.uri:
    url: '{{ hb_api }}/client-scopes'
    headers: '{{ hb_headers }}'
  register: hb_scopes
- ansible.builtin.assert:
    that: hb_scopes.json | selectattr('name','equalto',item) | list | length == 1
  loop: '{{ hb_candidate.defaultClientScopes }}'
- ansible.builtin.include_tasks: ../tasks/client-scope.yaml
  vars:
    sso_client_api: '{{ hb_api }}'
    sso_client_headers: '{{ hb_headers }}'
    sso_scope: '{{ hb_scopes.json | selectattr("name","equalto",hb_scope_name) | first }}'
  loop: '{{ hb_candidate.defaultClientScopes }}'
  loop_control: {loop_var: hb_scope_name}
- ansible.builtin.uri:
    url: '{{ hb_api }}/clients?clientId=harbor'
    headers: '{{ hb_headers }}'
  register: hb_lookup
- ansible.builtin.assert:
    that:
    - hb_lookup.json | length <= 1
    - hb_lookup.json | length == 1 or harbor_client_operation == 'prepare'
- ansible.builtin.set_fact:
    hb_secret: '{{ lookup("file",harbor_client_secret_file) | trim }}'
  when: harbor_client_operation == 'prepare'
- ansible.builtin.assert:
    that: hb_secret | length >= 24
  when: harbor_client_operation == 'prepare'
- name: Create one disabled client only when absent; never update or adopt drift
  ansible.builtin.uri:
    url: '{{ hb_api }}/clients'
    headers: '{{ hb_headers }}'
    method: POST
    body_format: json
    body: '{{ hb_candidate | combine({"secret":hb_secret}) }}'
    status_code: 201
  when: hb_lookup.json | length == 0
  changed_when: true
- ansible.builtin.uri:
    url: '{{ hb_api }}/clients?clientId=harbor'
    headers: '{{ hb_headers }}'
  register: hb_lookup_after
- ansible.builtin.assert:
    that:
    - hb_lookup_after.json | length == 1
    - hb_lookup_after.json[0].clientId == 'harbor'
    - hb_lookup_after.json[0].id is match('^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$')
    - harbor_client_operation == 'prepare' or hb_lookup_after.json[0].id == harbor_client_uuid
    - hb_lookup_after.json[0].id is not search("[\\x00-\\x20\\x7f]")
- ansible.builtin.set_fact:
    hb_id: '{{ hb_lookup_after.json[0].id }}'
- ansible.builtin.uri:
    url: '{{ hb_api }}/clients/{{ hb_id }}'
    headers: '{{ hb_headers }}'
  register: hb_current
- name: Refuse foreign, active or drifted clients without changing them
  ansible.builtin.assert:
    that:
    - hb_current.json.get(item.key) == item.value
    - hb_current.json.id == hb_id
    - hb_current.json.enabled == harbor_client_expected_enabled
    - hb_current.json.authenticationFlowBindingOverrides | default({}) == {}
    - hb_current.json.authorizationServicesEnabled | default(false) == false
  loop: '{{ hb_candidate | dict2items | rejectattr("key","in",["enabled","protocolMappers","attributes","defaultClientScopes","optionalClientScopes"]) | list }}'
- ansible.builtin.assert:
    that: hb_current.json.attributes.get(item.key) == item.value
  loop: '{{ hb_candidate.attributes | dict2items }}'
- ansible.builtin.uri:
    url: '{{ hb_api }}/clients/{{ hb_id }}/{{ item }}'
    headers: '{{ hb_headers }}'
  loop: [default-client-scopes, optional-client-scopes, protocol-mappers/models, scope-mappings, 'roles?first=0&max=2&briefRepresentation=false']
  register: hb_surface
- ansible.builtin.assert:
    that:
    - hb_surface.results[0].json | map(attribute='name') | sort == hb_candidate.defaultClientScopes | sort
    - hb_surface.results[1].json | length == 0
    - hb_surface.results[3].json.realmMappings | default([]) | length == 0
    - hb_surface.results[3].json.clientMappings | default({}) | length <= 1
    - hb_surface.results[4].json | length <= 1
    - hb_surface.results[2].json | length == hb_candidate.protocolMappers | length
    - hb_surface.results[2].json | map(attribute='name') | sort == hb_candidate.protocolMappers | map(attribute='name') | sort
- ansible.builtin.assert:
    that:
    - actual.protocol == item.protocol
    - actual.protocolMapper == item.protocolMapper
    - normalized == item.config
    - not (actual.consentRequired | default(false))
  vars:
    actual: '{{ hb_surface.results[2].json | selectattr("name","equalto",item.name) | first }}'
    normalized: '{{ actual.config if item.name == "harbor-own-roles" else actual.config }}'
  loop: '{{ hb_candidate.protocolMappers }}'
- when: harbor_client_operation == 'prepare'
  block:
  - ansible.builtin.uri:
      url: '{{ hb_api }}/clients/{{ hb_id }}/client-secret'
      headers: '{{ hb_headers }}'
    register: hb_credential
  - ansible.builtin.assert:
      that: hb_credential.json.value == hb_secret

- ansible.builtin.include_tasks: role-tasks.yaml
- ansible.builtin.include_tasks: grant-tasks.yaml
  when: harbor_client_operation in ['grant-admin-group','activate']
- name: Change only the enable flag after exact identity, role and native gates
  ansible.builtin.uri:
    url: '{{ hb_api }}/clients/{{ hb_id }}'
    headers: '{{ hb_headers }}'
    method: PUT
    body_format: json
    body: {enabled: '{{ harbor_client_operation == "activate" }}', webOrigins: []}
    status_code: 204
  when: harbor_client_operation in ['activate','disable'] and hb_current.json.enabled != (harbor_client_operation == 'activate')
  changed_when: true
- ansible.builtin.uri:
    url: '{{ hb_api }}/clients/{{ hb_id }}'
    headers: '{{ hb_headers }}'
  register: hb_final
- ansible.builtin.assert:
    that:
    - hb_final.json.id == hb_id
    - hb_final.json.enabled == ((harbor_client_operation == 'activate') if harbor_client_operation in ['activate','disable'] else harbor_client_expected_enabled)
    - >-
      hb_final.json | combine({'enabled': hb_current.json.enabled}) == hb_current.json
