- name: Guarded Harbor native OIDC operation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    harbor_native_operation: disabled
    harbor_native_origin: https://harbor.UNCONFIGURED.invalid
    harbor_native_approved_origin: UNAPPROVED
    harbor_native_issuer: https://identity.UNCONFIGURED.invalid/auth/realms/perkforge
    harbor_native_approved_issuer: UNAPPROVED
    harbor_native_version: v2.15.2
    harbor_native_apply_approved: false
    harbor_native_secret_write_approved: false
    harbor_native_admin_password_file: /UNCONFIGURED/admin-password
    harbor_native_client_secret_file: /UNCONFIGURED/client-secret
    harbor_native_ca_file: /UNCONFIGURED/public-ca.pem
  tasks:
  - ansible.builtin.assert:
      that: harbor_native_operation in ['disabled', 'inspect', 'apply']
  - ansible.builtin.debug:
      msg: Default and check mode are offline; no API or protected input access.
  - ansible.builtin.include_tasks: native-tasks.yaml
    when: harbor_native_operation != 'disabled' and not ansible_check_mode
