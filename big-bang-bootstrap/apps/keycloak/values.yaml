# Disabled by default; preflight explicitly opts in for offline rendering only.
addons:
  keycloak:
    enabled: false
    git:
      tag: 7.3.2-bb.1 # Selected by Big Bang 3.35.1, not latest.
    values:
      upstream:
        replicas: 1
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        # Remove packaged example credentials; provision this external Secret later.
        secrets: null
        extraEnvFrom: |
          - secretRef:
              name: keycloak-bootstrap-existing
        database:
          password: ''
          existingSecret: keycloak-database-existing
          existingSecretKey: password
