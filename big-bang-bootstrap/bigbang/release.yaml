apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bigbang
spec:
  suspend: true # Deliberately disabled; this is not a live deployment profile.
  interval: 10m
  releaseName: bigbang
  targetNamespace: bigbang
  serviceAccountName: platform-reconciler # Future reviewed identity; not provisioned here.
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: bigbang-chart
  valuesFrom:
    - kind: ConfigMap
      name: values-shared
      valuesKey: values.yaml
    - kind: ConfigMap
      name: values-openbao
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: values-keycloak
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: values-keycloak
      valuesKey: database.yaml
      optional: true
    - kind: ConfigMap
      name: values-provider
      valuesKey: values.yaml
    - kind: ConfigMap
      name: values-impact
      valuesKey: values.yaml
    - kind: ConfigMap
      name: values-cluster
      valuesKey: values.yaml
