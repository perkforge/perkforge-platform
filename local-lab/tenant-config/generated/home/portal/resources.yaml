  - expression: '!has(object.spec.containers[0].readinessProbe) || (has(object.spec.containers[0].readinessProbe.httpGet)
      && !has(object.spec.containers[0].readinessProbe.exec) && !has(object.spec.containers[0].readinessProbe.tcpSocket)
      && !has(object.spec.containers[0].readinessProbe.grpc) && object.spec.containers[0].readinessProbe.httpGet.path
      == "/healthz" && object.spec.containers[0].readinessProbe.httpGet.port == "http"
      && (!has(object.spec.containers[0].readinessProbe.httpGet.host) || object.spec.containers[0].readinessProbe.httpGet.host
      == "") && (!has(object.spec.containers[0].readinessProbe.httpGet.httpHeaders)
      || object.spec.containers[0].readinessProbe.httpGet.httpHeaders.size() == 0))'
    message: Health probes must not inject commands or alternate destinations
  - expression: '!has(object.spec.containers[0].startupProbe) || (has(object.spec.containers[0].startupProbe.httpGet)
      && !has(object.spec.containers[0].startupProbe.exec) && !has(object.spec.containers[0].startupProbe.tcpSocket)
      && !has(object.spec.containers[0].startupProbe.grpc) && object.spec.containers[0].startupProbe.httpGet.path
      == "/healthz" && object.spec.containers[0].startupProbe.httpGet.port == "http"
      && (!has(object.spec.containers[0].startupProbe.httpGet.host) || object.spec.containers[0].startupProbe.httpGet.host
      == "") && (!has(object.spec.containers[0].startupProbe.httpGet.httpHeaders)
      || object.spec.containers[0].startupProbe.httpGet.httpHeaders.size() == 0))'
    message: Health probes must not inject commands or alternate destinations
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portal-deployer-surface
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - '*'
      apiVersions:
      - '*'
      resources:
      - '*'
      - '*/*'
      operations:
      - CREATE
      - UPDATE
      - DELETE
      - CONNECT
    matchPolicy: Equivalent
  matchConditions:
  - name: restricted-request
    expression: request.userInfo.username == "system:serviceaccount:cattle-fleet-local-system:home-portal-deployer"
  validations:
  - expression: request.namespace == "tenant-home-portal" && (request.resource.group
      == "apps" && request.resource.resource == "deployments" && request.subResource
      == "" || request.resource.group == "" && request.resource.resource == "services"
      && request.subResource == "")
    message: Tenant deployer may mutate only Deployment and Service resources
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portal-service-contract
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - services
      operations:
      - CREATE
      - UPDATE
    matchPolicy: Equivalent
  matchConditions:
  - name: portal-namespace-only
    expression: request.namespace == "tenant-home-portal"
  validations:
  - expression: object.metadata.name == "home-portal" && object.spec.type == "ClusterIP"
      && (!has(object.spec.externalIPs) || object.spec.externalIPs.size() == 0) &&
      !has(object.spec.externalName)
    message: Only the internal portal ClusterIP Service is allowed
  - expression: object.spec.selector.size() == 1 && object.spec.selector["app.kubernetes.io/name"]
      == "perkforge-portal" && object.spec.ports.size() == 1 && object.spec.ports[0].port
      == 3000 && object.spec.ports[0].targetPort == "http"
    message: Service must route only to the approved portal port
---
