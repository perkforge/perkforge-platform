      - CREATE
      - UPDATE
    matchPolicy: Equivalent
  matchConditions:
  - name: portal-namespace-only
    expression: request.namespace == "tenant-home-portal"
  validations:
  - expression: object.spec.template.spec.containers.size() == 1
    message: Exactly one approved portal container is required
  - expression: 'false'
    message: No approved image digest
  - expression: has(object.spec.template.spec.serviceAccountName) && object.spec.template.spec.serviceAccountName
      == "portal-runtime" && has(object.spec.template.spec.automountServiceAccountToken)
      && !object.spec.template.spec.automountServiceAccountToken
    message: Platform runtime identity with token automount disabled is required
  - expression: (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.size()
      == 0) && (!has(object.spec.template.spec.ephemeralContainers) || object.spec.template.spec.ephemeralContainers.size()
      == 0)
    message: Init and ephemeral containers are forbidden
  - expression: (!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes.size()
      == 0) && (!has(object.spec.template.spec.imagePullSecrets) || object.spec.template.spec.imagePullSecrets.size()
      == 0)
    message: No mounted volumes or extra secret references are allowed
  - expression: has(object.spec.template.spec.containers[0].env) && object.spec.template.spec.containers[0].env.size()
      == 7 && object.spec.template.spec.containers[0].env.all(e, object.spec.template.spec.containers[0].env.filter(x,
      x.name == e.name).size() == 1)
    message: Exactly the seven unique platform environment entries are required
  - expression: 'object.spec.template.spec.containers[0].env.all(e, e.name == "OIDC_CLIENT_SECRET"
      ? (!has(e.value) || e.value == "") && has(e.valueFrom) && has(e.valueFrom.secretKeyRef)
      && !has(e.valueFrom.configMapKeyRef) && !has(e.valueFrom.fieldRef) && !has(e.valueFrom.resourceFieldRef)
      && e.valueFrom.secretKeyRef.name == "portal-oidc" && e.valueFrom.secretKeyRef.key
      == "client-secret" && (!has(e.valueFrom.secretKeyRef.optional) || !e.valueFrom.secretKeyRef.optional)
      : e.name in {"LISTEN_HOST": "0.0.0.0", "PORTAL_ORIGIN": "https://portal.local-lab.test",
      "TENANT_SOURCE": "disabled", "OIDC_ISSUER": "https://keycloak.local-lab.test/auth/realms/perkforge",
      "OIDC_CLIENT_ID": "household-portal", "OIDC_AUDIENCE": "household-portal-api"}
      && has(e.value) && e.value == {"LISTEN_HOST": "0.0.0.0", "PORTAL_ORIGIN": "https://portal.local-lab.test",
      "TENANT_SOURCE": "disabled", "OIDC_ISSUER": "https://keycloak.local-lab.test/auth/realms/perkforge",
      "OIDC_CLIENT_ID": "household-portal", "OIDC_AUDIENCE": "household-portal-api"}[e.name]
      && !has(e.valueFrom))'
    message: Identity, origin and secret wiring must exactly match the platform contract
  - expression: (!has(object.spec.template.spec.containers[0].envFrom) || object.spec.template.spec.containers[0].envFrom.size()
      == 0) && (!has(object.spec.template.spec.containers[0].command) || object.spec.template.spec.containers[0].command.size()
      == 0) && (!has(object.spec.template.spec.containers[0].args) || object.spec.template.spec.containers[0].args.size()
      == 0) && !has(object.spec.template.spec.containers[0].lifecycle)
    message: No environment import, command override or lifecycle code is allowed
  - expression: (!has(object.spec.template.spec.containers[0].volumeMounts) || object.spec.template.spec.containers[0].volumeMounts.size()
      == 0) && (!has(object.spec.template.spec.containers[0].volumeDevices) || object.spec.template.spec.containers[0].volumeDevices.size()
      == 0) && (!has(object.spec.template.spec.containers[0].workingDir) || object.spec.template.spec.containers[0].workingDir
      == "")
    message: No filesystem injection or working-directory override is allowed
  - expression: (!has(object.spec.template.spec.hostNetwork) || !object.spec.template.spec.hostNetwork)
      && (!has(object.spec.template.spec.hostPID) || !object.spec.template.spec.hostPID)
      && (!has(object.spec.template.spec.hostIPC) || !object.spec.template.spec.hostIPC)
      && (!has(object.spec.template.spec.hostAliases) || object.spec.template.spec.hostAliases.size()
      == 0) && !has(object.spec.template.spec.dnsConfig) && (!has(object.spec.template.spec.dnsPolicy)
      || object.spec.template.spec.dnsPolicy == "ClusterFirst") && !has(object.spec.template.spec.runtimeClassName)
    message: Host access, custom DNS and runtime overrides are forbidden
  - expression: has(object.spec.template.spec.securityContext) && object.spec.template.spec.securityContext.runAsNonRoot
      == true && object.spec.template.spec.securityContext.runAsUser == 1000 && object.spec.template.spec.securityContext.runAsGroup
      == 1000 && object.spec.template.spec.securityContext.seccompProfile.type ==
      "RuntimeDefault"
    message: Pod must use the platform non-root seccomp profile
  - expression: has(object.spec.template.spec.containers[0].securityContext) && object.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
      == false && object.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
      == true && (!has(object.spec.template.spec.containers[0].securityContext.privileged)
      || !object.spec.template.spec.containers[0].securityContext.privileged) && object.spec.template.spec.containers[0].securityContext.capabilities.drop
      == ["ALL"] && (!has(object.spec.template.spec.containers[0].securityContext.capabilities.add)
      || object.spec.template.spec.containers[0].securityContext.capabilities.add.size()
      == 0) && (!has(object.spec.template.spec.containers[0].securityContext.runAsUser)
      || object.spec.template.spec.containers[0].securityContext.runAsUser == 1000)
      && (!has(object.spec.template.spec.containers[0].securityContext.runAsGroup)
      || object.spec.template.spec.containers[0].securityContext.runAsGroup == 1000)
      && (!has(object.spec.template.spec.containers[0].securityContext.runAsNonRoot)
      || object.spec.template.spec.containers[0].securityContext.runAsNonRoot) &&
      (!has(object.spec.template.spec.containers[0].securityContext.seccompProfile)
      || object.spec.template.spec.containers[0].securityContext.seccompProfile.type
      == "RuntimeDefault")
    message: Container must retain restricted security settings
  - expression: has(object.spec.template.spec.containers[0].ports) && object.spec.template.spec.containers[0].ports.size()
      == 1 && object.spec.template.spec.containers[0].ports[0].name == "http" && object.spec.template.spec.containers[0].ports[0].containerPort
      == 3000 && (!has(object.spec.template.spec.containers[0].ports[0].hostPort)
      || object.spec.template.spec.containers[0].ports[0].hostPort == 0) && (!has(object.spec.template.spec.containers[0].ports[0].hostIP)
      || object.spec.template.spec.containers[0].ports[0].hostIP == "")
    message: Only the internal application port is allowed
  - expression: (!has(object.spec.template.spec.securityContext.sysctls) || object.spec.template.spec.securityContext.sysctls.size()
      == 0) && !has(object.spec.template.spec.securityContext.seLinuxOptions) && !has(object.spec.template.spec.securityContext.windowsOptions)
      && (!has(object.spec.template.spec.securityContext.appArmorProfile) || object.spec.template.spec.securityContext.appArmorProfile.type
      == "RuntimeDefault") && (!has(object.spec.template.spec.containers[0].securityContext.procMount)
      || object.spec.template.spec.containers[0].securityContext.procMount == "Default")
      && !has(object.spec.template.spec.containers[0].securityContext.seLinuxOptions)
      && !has(object.spec.template.spec.containers[0].securityContext.windowsOptions)
      && (!has(object.spec.template.spec.containers[0].securityContext.appArmorProfile)
      || object.spec.template.spec.containers[0].securityContext.appArmorProfile.type
      == "RuntimeDefault")
    message: Additional operating-system security overrides are forbidden
  - expression: (!has(object.spec.template.spec.containers[0].stdin) || !object.spec.template.spec.containers[0].stdin)
      && (!has(object.spec.template.spec.containers[0].stdinOnce) || !object.spec.template.spec.containers[0].stdinOnce)
      && (!has(object.spec.template.spec.containers[0].tty) || !object.spec.template.spec.containers[0].tty)
      && (!has(object.spec.template.spec.shareProcessNamespace) || !object.spec.template.spec.shareProcessNamespace)
    message: Interactive and shared process modes are forbidden
  - expression: '!has(object.spec.template.spec.containers[0].livenessProbe) || (has(object.spec.template.spec.containers[0].livenessProbe.httpGet)
      && !has(object.spec.template.spec.containers[0].livenessProbe.exec) && !has(object.spec.template.spec.containers[0].livenessProbe.tcpSocket)
      && !has(object.spec.template.spec.containers[0].livenessProbe.grpc) && object.spec.template.spec.containers[0].livenessProbe.httpGet.path
      == "/healthz" && object.spec.template.spec.containers[0].livenessProbe.httpGet.port
      == "http" && (!has(object.spec.template.spec.containers[0].livenessProbe.httpGet.host)
      || object.spec.template.spec.containers[0].livenessProbe.httpGet.host == "")
      && (!has(object.spec.template.spec.containers[0].livenessProbe.httpGet.httpHeaders)
      || object.spec.template.spec.containers[0].livenessProbe.httpGet.httpHeaders.size()
      == 0))'
    message: Health probes must not inject commands or alternate destinations
  - expression: '!has(object.spec.template.spec.containers[0].readinessProbe) || (has(object.spec.template.spec.containers[0].readinessProbe.httpGet)
      && !has(object.spec.template.spec.containers[0].readinessProbe.exec) && !has(object.spec.template.spec.containers[0].readinessProbe.tcpSocket)
      && !has(object.spec.template.spec.containers[0].readinessProbe.grpc) && object.spec.template.spec.containers[0].readinessProbe.httpGet.path
      == "/healthz" && object.spec.template.spec.containers[0].readinessProbe.httpGet.port
      == "http" && (!has(object.spec.template.spec.containers[0].readinessProbe.httpGet.host)
      || object.spec.template.spec.containers[0].readinessProbe.httpGet.host == "")
      && (!has(object.spec.template.spec.containers[0].readinessProbe.httpGet.httpHeaders)
      || object.spec.template.spec.containers[0].readinessProbe.httpGet.httpHeaders.size()
      == 0))'
    message: Health probes must not inject commands or alternate destinations
  - expression: '!has(object.spec.template.spec.containers[0].startupProbe) || (has(object.spec.template.spec.containers[0].startupProbe.httpGet)
      && !has(object.spec.template.spec.containers[0].startupProbe.exec) && !has(object.spec.template.spec.containers[0].startupProbe.tcpSocket)
      && !has(object.spec.template.spec.containers[0].startupProbe.grpc) && object.spec.template.spec.containers[0].startupProbe.httpGet.path
      == "/healthz" && object.spec.template.spec.containers[0].startupProbe.httpGet.port
      == "http" && (!has(object.spec.template.spec.containers[0].startupProbe.httpGet.host)
      || object.spec.template.spec.containers[0].startupProbe.httpGet.host == "")
      && (!has(object.spec.template.spec.containers[0].startupProbe.httpGet.httpHeaders)
      || object.spec.template.spec.containers[0].startupProbe.httpGet.httpHeaders.size()
      == 0))'
    message: Health probes must not inject commands or alternate destinations
  - expression: request.kind.kind != "Deployment" || (object.metadata.name == "home-portal"
      && object.spec.replicas == 1 && object.spec.strategy.type == "Recreate")
    message: Only the single platform-reviewed portal deployment is allowed
