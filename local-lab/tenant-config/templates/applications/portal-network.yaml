{{- if and (ne .Values.foundation.lifecycle.state "disabled") .Values.applications.portal }}
{{- $c := .Values.applications.portal }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: {{ $c.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts: [portal.local-lab.test]
    secretName: portal-tls
  rules:
  - host: portal.local-lab.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $c.releaseName }}
            port:
              number: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-https
  namespace: {{ $c.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: perkforge-portal
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: rke2-traefik
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: rke2-traefik
    ports:
    - protocol: TCP
      port: 8443
{{- end }}
