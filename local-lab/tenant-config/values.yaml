# Shared portal defaults; Home-specific settings override these in tenants/home.yaml.
applications:
  portal:
    lifecycle:
      state: disabled
    runtimeServiceAccount: portal-runtime
    fleetAgentNamespace: cattle-fleet-local-system
    imageRepository: ghcr.io/perkforge/perkforge-portal
    imageDigest: null
    resources:
      allocation: null
    identity:
      realm: perkforge
      secretKey: client-secret
      requiredRole: tenant-reader
