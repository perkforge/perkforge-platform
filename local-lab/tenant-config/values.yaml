# Platform-wide defaults. Tenant records may opt out of selected components with reasons.
foundation:
  lifecycle:
    state: disabled
  components:
    project: true
    namespaces: true
    quotas: true
    limits: true
    networkPolicies: true
    serviceAccounts: true
    deploymentRbac: true
    fleetAccess: true
    registration: true
  optOutReasons: {}
  fleetAgentNamespace: cattle-fleet-local-system
  clusterNamespace: fleet-local
  workspace: ''
  namespaces: {}
  repositories: {}
applications: {}
