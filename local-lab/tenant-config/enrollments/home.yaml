name: local-lab-home-foundation
labels:
  local-lab.homelab/component: tenant-foundation-native
dependsOn:
- selector:
    matchLabels:
      local-lab.homelab/component: tenant-foundation
helm:
  disablePreProcess: true
  disableDNS: true
targetCustomizations:
- name: local
  clusterName: local
  helm:
    # Fleet 0.16 loads these without an authored chart, in this order.
    valuesFiles:
    - values.yaml
    - tenants.yaml
    - tenants/home.yaml
