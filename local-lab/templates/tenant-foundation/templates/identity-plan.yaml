{{- if eq .Values.section "identity-plan" }}
{{- $c := .Values.portal }}
kind: PortalIdentityPlan
mode: review-only
realm: {{ $c.identity.realm | quote }}
currentProviderChangeRequired: Paused HTTP Keycloak must receive separately approved trusted HTTPS configuration
secretDelivery:
  namespace: {{ $c.namespace | quote }}
  name: {{ $c.identity.existingSecret | quote }}
  key: {{ $c.identity.secretKey | quote }}
  action: operator-managed; never generated by this renderer
requiredExistingGroups:
{{ $c.identity.groups | toYaml }}
automaticRoleAssignments: []
clients:
- clientId: {{ $c.identity.clientId | quote }}
  protocol: openid-connect
  enabled: false
  publicClient: false
  clientAuthenticatorType: client-secret
  standardFlowEnabled: true
  implicitFlowEnabled: false
  directAccessGrantsEnabled: false
  serviceAccountsEnabled: false
  fullScopeAllowed: false
  redirectUris:
  - {{ printf "%s/auth/callback" $c.portalOrigin | quote }}
  webOrigins: []
  attributes:
    perkforge-managed: 'true'
    pkce.code.challenge.method: S256
    access.token.lifespan: '300'
  protocolMappers:
  - name: portal-audience
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    config:
      included.client.audience: {{ $c.identity.audience | quote }}
      access.token.claim: 'true'
      id.token.claim: 'false'
  - name: groups
    protocol: openid-connect
    protocolMapper: oidc-group-membership-mapper
    config:
      claim.name: groups
      full.path: 'true'
      access.token.claim: 'true'
      id.token.claim: 'false'
      userinfo.token.claim: 'false'
  - name: portal-client-roles
    protocol: openid-connect
    protocolMapper: oidc-usermodel-client-role-mapper
    config:
      usermodel.clientRoleMapping.clientId: {{ $c.identity.audience | quote }}
      claim.name: {{ printf "resource_access.%s.roles" $c.identity.audience | quote }}
      multivalued: 'true'
      jsonType.label: String
      access.token.claim: 'true'
      id.token.claim: 'false'
- clientId: {{ $c.identity.audience | quote }}
  protocol: openid-connect
  enabled: false
  bearerOnly: true
  standardFlowEnabled: false
  implicitFlowEnabled: false
  directAccessGrantsEnabled: false
  serviceAccountsEnabled: false
apiClientRoles:
- client: {{ $c.identity.audience | quote }}
  role: {{ $c.identity.requiredRole | quote }}
requiredClientScopeMapping:
  client: {{ $c.identity.clientId | quote }}
  targetClient: {{ $c.identity.audience | quote }}
  roles:
  - {{ $c.identity.requiredRole | quote }}
grantPolicy: Platform must separately approve role membership; Home group membership alone is insufficient. No grants are generated.
{{- end }}
