# Platform renderer input; not an active Fleet path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-portal-deployer
  namespace: cattle-fleet-local-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-runtime
  namespace: tenant-home-portal
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal-deploy
  namespace: tenant-home-portal
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - portal-platform-values
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal-deploy
  namespace: tenant-home-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portal-deploy
subjects:
- kind: ServiceAccount
  name: home-portal-deployer
  namespace: cattle-fleet-local-system
