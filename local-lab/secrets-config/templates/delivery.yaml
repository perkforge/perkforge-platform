{{- if .Values.enabled }}
{{- if ne .Values.remoteKey (printf "%s/%s/registry/ghcr" .Values.tenant .Values.namespace) }}{{ fail "remote key must belong to the enrolled tenant namespace" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-sync
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-openbao-token
  namespace: {{ .Values.namespace }}
rules:
- apiGroups: [""]
  resources: [serviceaccounts/token]
  resourceNames: [openbao-sync]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-openbao-token
  namespace: {{ .Values.namespace }}
subjects:
- kind: ServiceAccount
  name: eso-home-portal
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-openbao-token
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: {{ .Values.namespace }}
spec:
  controller: {{ .Values.controller }}
  provider:
    vault:
      server: {{ .Values.server }}
      path: tenants
      version: v2
      caProvider:
        type: ConfigMap
        name: {{ .Values.caConfigMap }}
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .Values.role }}
          serviceAccountRef:
            name: openbao-sync
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-ghcr
  namespace: {{ .Values.namespace }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: {{ .Values.targetSecret }}
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{{ `{{ .dockerconfigjson }}` }}'
  data:
  - secretKey: dockerconfigjson
    remoteRef:
      key: {{ .Values.remoteKey }}
      property: dockerconfigjson
{{- end }}
