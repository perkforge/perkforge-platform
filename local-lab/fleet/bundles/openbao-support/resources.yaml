# Inactive platform-owned security boundary. This bundle is not selected by a GitRepo.
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
# Existing CA stays namespaced in cattle-system. Deliver only this issued leaf.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-lab
  namespace: cattle-system
spec:
  secretName: openbao-lab-issued
  privateKey:
    rotationPolicy: Always
  ipAddresses: [127.0.0.1]
  dnsNames:
  - localhost
  - openbao.local-lab.test
  - openbao.openbao.svc
  - openbao.openbao.svc.cluster.local
  - openbao-0.openbao-internal
  - openbao-0.openbao-internal.openbao.svc
  - openbao-0.openbao-internal.openbao.svc.cluster.local
  issuerRef:
    name: rancher
    kind: Issuer
---
# TLS terminates at OpenBao, so Traefik requires no new leaf/private key copy.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: openbao
  namespace: openbao
spec:
  entryPoints: [websecure]
  routes:
  - match: HostSNI(`openbao.local-lab.test`)
    services:
    - name: openbao
      port: 8200
  tls:
    passthrough: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-boundary
  namespace: openbao
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {app.kubernetes.io/name: rke2-traefik}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: external-secrets}
      podSelector:
        matchLabels: {app.kubernetes.io/instance: eso-home-portal, app.kubernetes.io/name: external-secrets}
    ports: [{protocol: TCP, port: 8200}]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  - to:
    - ipBlock: {cidr: 10.43.0.1/32}
    ports: [{protocol: TCP, port: 443}]
  - to:
    - ipBlock: {cidr: 192.168.122.201/32}
    ports: [{protocol: TCP, port: 6443}]
  # Public Keycloak issuer via the existing Traefik service; pre/post DNAT.
  - to:
    - ipBlock: {cidr: 10.43.163.193/32}
    ports: [{protocol: TCP, port: 443}]
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {app.kubernetes.io/name: rke2-traefik}
    ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eso-home-portal-boundary
  namespace: external-secrets
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: eso-home-portal, app.kubernetes.io/name: external-secrets}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  - to:
    - ipBlock: {cidr: 10.43.0.1/32}
    ports: [{protocol: TCP, port: 443}]
  - to:
    - ipBlock: {cidr: 192.168.122.201/32}
    ports: [{protocol: TCP, port: 6443}]
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: openbao}
      podSelector:
        matchLabels: {app.kubernetes.io/instance: openbao, app.kubernetes.io/name: openbao}
    ports: [{protocol: TCP, port: 8200}]
