---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tenant-home-nextcloud
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-nextcloud-deployer
  namespace: cattle-fleet-local-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextcloud-deploy
  namespace: tenant-home-nextcloud
rules:
- apiGroups:
  - ''
  resources:
  - services
  - configmaps
  - secrets
  verbs: &id001
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  verbs: &id002
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs: *id001
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs: *id001
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs: *id001
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  verbs: *id002
- apiGroups:
  - cert-manager.io
  resources:
  - issuers
  - certificates
  verbs: *id001
- apiGroups:
  - ''
  resources:
  - namespaces
  resourceNames:
  - tenant-home-nextcloud
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextcloud-deploy
  namespace: tenant-home-nextcloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nextcloud-deploy
subjects:
- kind: ServiceAccount
  name: home-nextcloud-deployer
  namespace: cattle-fleet-local-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tenant-home-nextcloud
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nextcloud-ingress
  namespace: tenant-home-nextcloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/name: nextcloud
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: rke2-traefik
    ports:
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nextcloud-database
  namespace: tenant-home-nextcloud
spec:
  podSelector:
    matchLabels:
      platform.perkforge.io/application: nextcloud
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: nextcloud-db
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database-clients
  namespace: tenant-home-nextcloud
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: nextcloud-db
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          platform.perkforge.io/application: nextcloud
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 192.168.122.201/32
    ports:
    - protocol: TCP
      port: 6443
---
apiVersion: management.cattle.io/v3
kind: FleetWorkspace
metadata:
  name: fleet-home-nextcloud
---
apiVersion: v1
kind: Namespace
metadata:
  name: fleet-home-nextcloud
  labels:
    platform.perkforge.io/tenant: home
    platform.perkforge.io/managed-by: nextcloud-support
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: fleet.cattle.io/v1alpha1
kind: Policy
metadata:
  name: nextcloud-only
  namespace: fleet-home-nextcloud
requireServiceAccount: true
allowNamespaceCreation: false
allowedServiceAccounts:
- home-nextcloud-deployer
gitRepo:
  allowedRepoPatterns:
  - ^https://github[.]com/perkforge/perkforge-tenant-nextcloud[.]git$
---
apiVersion: fleet.cattle.io/v1alpha1
kind: BundleNamespaceMapping
metadata:
  name: nextcloud-to-local
  namespace: fleet-home-nextcloud
bundleSelector:
  matchLabels:
    platform.perkforge.io/tenant: home
namespaceSelector:
  matchLabels:
    kubernetes.io/metadata.name: fleet-local
