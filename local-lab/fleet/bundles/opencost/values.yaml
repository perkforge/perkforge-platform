clusterName: local

networkPolicies:
  enabled: true
  prometheus:
    namespace: monitoring
    labels:
      app.kubernetes.io/name: prometheus
    port: 9090

opencost:
  cloudCost:
    enabled: false
  customPricing:
    enabled: false
  exporter:
    defaultClusterId: local
    apiIngress:
      enabled: false
    resources:
      requests:
        cpu: 75m
        memory: 96Mi
      limits:
        cpu: 300m
        memory: 256Mi
  prometheus:
    internal:
      enabled: true
      namespaceName: monitoring
      serviceName: kube-prometheus-stack-prometheus
      port: 9090
      scheme: http
  ui:
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

nodeSelector:
  kubernetes.io/hostname: cks-worker
