clusterName: local

networkPolicies:
  enabled: true
  prometheus:
    namespace: monitoring
    labels:
      app.kubernetes.io/name: prometheus
    port: 9090

opencost:
  cloudCost:
    enabled: false
  customPricing:
    enabled: false
  exporter:
    defaultClusterId: local
    apiIngress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  prometheus:
    internal:
      enabled: true
      namespaceName: monitoring
      serviceName: kube-prometheus-stack-prometheus
      port: 9090
      scheme: http
  ui:
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
