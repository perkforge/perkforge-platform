---
apiVersion: management.cattle.io/v3
kind: Project
metadata:
  name: p-tenant-alpha-local
  namespace: local
  labels:
    platform.perkforge.io/tenant: tenant-alpha
    platform.perkforge.io/managed-by: tenant-foundation
  annotations:
    field.cattle.io/no-creator-rbac: 'true'
spec:
  clusterName: local
  displayName: Tenant Alpha
  description: PerkForge tenant project managed from the tenant catalog.
  resourceQuota:
    limit: &id001
      pods: '15'
      requestsCpu: '1'
      requestsMemory: 1500Mi
      limitsCpu: '2'
      limitsMemory: 2Gi
      persistentVolumeClaims: '5'
      requestsStorage: 10Gi
      services: '10'
  namespaceDefaultResourceQuota:
    limit: *id001
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-alpha
  labels:
    app.kubernetes.io/part-of: opengovlocalpaas
    platform.homelab/tenant: tenant-alpha
    platform.perkforge.io/tenant: tenant-alpha
    platform.perkforge.io/environment: default
    platform.perkforge.io/isolation-tier: shared
    platform.perkforge.io/managed-by: tenant-foundation
    platform.perkforge.io/metrics: 'true'
    platform.perkforge.io/cost-allocation: 'true'
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
  annotations:
    field.cattle.io/projectId: local:p-tenant-alpha-local
    field.cattle.io/resourceQuota: '{"limit":{"pods":"15","services":"10","persistentVolumeClaims":"5","requestsCpu":"1","requestsMemory":"1500Mi","requestsStorage":"10Gi","limitsCpu":"2","limitsMemory":"2Gi"}}'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-budget
  namespace: tenant-alpha
spec:
  hard:
    pods: '15'
    requests.cpu: '1'
    requests.memory: 1500Mi
    limits.cpu: '2'
    limits.memory: 2Gi
    persistentvolumeclaims: '5'
    requests.storage: 10Gi
    services: '10'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: tenant-alpha
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: tenant-alpha
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tenant-internal-and-dns
  namespace: tenant-alpha
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          platform.perkforge.io/tenant: tenant-alpha
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: rke2-traefik
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          platform.perkforge.io/tenant: tenant-alpha
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: keycloak
    ports:
    - protocol: TCP
      port: 8080
---
