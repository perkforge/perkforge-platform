# Approved single-instance identity service; monitor lab capacity during startup.
replicas: 1
nodeSelector:
  kubernetes.io/hostname: cks-worker
command:
  - /opt/keycloak/bin/kc.sh
  - start
  - --http-port=8080
  - --hostname-strict=false
resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1536Mi
database:
  vendor: postgres
  hostname: keycloak-db-rw.keycloak.svc.cluster.local
  port: 5432
  database: keycloak
  username: keycloak
  existingSecret: keycloak-db-app
  existingSecretKey: password
http:
  relativePath: /auth
proxy:
  enabled: true
  mode: forwarded
ingress:
  enabled: true
  ingressClassName: traefik
  tls:
    - hosts: [keycloak.local-lab.test]
      secretName: keycloak-tls
  rules:
    - host: keycloak.local-lab.test
      paths:
        - path: /auth/
          pathType: Prefix
extraEnv: |
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: admin
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin
        key: password
  - name: KC_HOSTNAME
    value: https://keycloak.local-lab.test/auth
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: "true"
