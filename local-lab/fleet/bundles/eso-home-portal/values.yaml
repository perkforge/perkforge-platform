# One supported namespace-scoped controller for the first enrollment.
# Do not select this bundle until capacity and live prerequisites are approved.
scopedNamespace: tenant-home-portal
scopedRBAC: true
controllerClass: home-portal
replicaCount: 1
processClusterExternalSecret: false
processClusterStore: false
processClusterGenerator: false
processClusterPushSecret: false
processPushSecret: false
openshiftFinalizers: false
rbac:
  serviceAccountTokenCreate: false
  servicebindings:
    create: false
  aggregateToEdit: false
  aggregateToAdmin: false
  aggregateToView: false
serviceAccount:
  name: eso-home-portal
webhook:
  create: false
certController:
  create: false
crds:
  createClusterExternalSecret: false
  createClusterSecretStore: false
  createClusterGenerator: false
  createClusterPushSecret: false
  createPushSecret: false
nodeSelector:
  kubernetes.io/hostname: cks-worker
resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {cpu: 200m, memory: 128Mi}
extraEnv:
- name: GOMEMLIMIT
  value: 96MiB
