# Controller-side management inputs; override with reviewed external vars.
rancher_install_apply: false
# Big Bang/Flux is the selected Helm deployment owner. Legacy direct installation
# requires an explicit separately reviewed owner override and must never coexist.
rancher_deployment_owner: bigbang
rancher_oidc_apply: false
rancher_kubectl: kubectl
rancher_helm: helm
rancher_kubeconfig: /UNCONFIGURED/kubeconfig
rancher_context: UNCONFIGURED
rancher_cluster_uid: UNCONFIGURED
rancher_hostname: UNCONFIGURED
rancher_ingress_class: UNCONFIGURED
rancher_version: 2.15.2
rancher_replicas: 1
rancher_bootstrap_password_file: /UNCONFIGURED/rancher-bootstrap-password
# Secret-based ingress requires existing tls-rancher-ingress; no CA/key is generated.
rancher_private_ca: false
rancher_additional_trusted_cas: false
rancher_install_cert_manager: false
cert_manager_version: v1.21.2
rancher_oidc_client_id: rancher
rancher_oidc_issuer: https://UNCONFIGURED/realms/UNCONFIGURED
rancher_oidc_secret_file: /UNCONFIGURED/rancher-oidc-secret
rancher_management_groups:
- genericoidc_group:///platform/admins
# No developer/tenant role mapping. Separate engineer grants need reviewed inputs.
rancher_management_bindings:
- name: platform-admins
  groupPrincipalName: genericoidc_group:///platform/admins
  globalRoleName: admin
