---
- name: Select only the reviewed physical DNS server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lab_dns_apply: false
    lab_dns_reviewed: false
    lab_dns_upstream: UNCONFIGURED
  tasks:
  - ansible.builtin.debug:
      msg: 'Lab DNS apply={{ lab_dns_apply | bool }}; check={{ ansible_check_mode }}. Defaults/check mode make no connections.'
  - name: Require concrete server and ingress choices before any connection
    when: lab_dns_apply | bool and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        quiet: true
        that:
        - lab_dns_reviewed | bool
        - groups.get('rke2_servers', []) == ['control-1']
        - groups.get('rke2_agents', []) | sort == ['worker-1', 'worker-2']
        - lab_dns_upstream is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
        - lab_dns_upstream != hostvars['control-1'].ansible_host
    - ansible.builtin.assert:
        quiet: true
        that:
        - hostvars[item].ansible_host is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
        - hostvars[item].ansible_user | default('UNCONFIGURED') != 'UNCONFIGURED'
      loop: [control-1, worker-1]
    - ansible.builtin.add_host:
        name: control-1
        groups: lab_dns_approved_server
        lab_dns_server_ip: '{{ hostvars["control-1"].ansible_host }}'
        lab_dns_ingress_ip: '{{ hostvars["worker-1"].ansible_host }}'
        lab_dns_server_upstream: '{{ lab_dns_upstream }}'

- name: Configure a separate DNS-only host service
  hosts: lab_dns_approved_server
  gather_facts: false
  become: true
  tasks:
  - name: Run only in the reviewed live stage
    when: lab_dns_apply | default(false) | bool and not ansible_check_mode
    block:
    - ansible.builtin.include_tasks: ../tasks/lab-dns.yml
