---
- name: Install pinned Rancher for platform cluster management
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [../group_vars/rancher.yml]
  tasks:
  - name: Report safe default without reading credentials or contacting a cluster
    ansible.builtin.debug:
      msg: 'Apply={{ rancher_install_apply | bool }}; check={{ ansible_check_mode }}'
  - name: Run only the separately approved management operation
    when: rancher_install_apply | bool and not ansible_check_mode
    block:
    - name: Refuse competing direct Helm installation under Big Bang ownership
      ansible.builtin.assert:
        that: rancher_deployment_owner == 'ansible'
        fail_msg: 'Rancher deployment belongs to Big Bang/Flux. Do not run two Helm owners.'
    - ansible.builtin.include_tasks: ../tasks/rancher-target.yml
    - ansible.builtin.include_tasks: ../tasks/rancher-install.yml
