---
- name: Configure platform-only Rancher Generic OIDC
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [../group_vars/rancher.yml]
  tasks:
  - name: Report safe default without reading credentials or contacting a cluster
    ansible.builtin.debug:
      msg: 'Apply={{ rancher_oidc_apply | bool }}; check={{ ansible_check_mode }}'
  - name: Run only the separately approved management operation
    when: rancher_oidc_apply | bool and not ansible_check_mode
    block:
    - ansible.builtin.include_tasks: ../tasks/rancher-target.yml
    - ansible.builtin.include_tasks: ../tasks/rancher-oidc.yml
