---
- name: Select the exact physical DNS clients
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    node_dns_apply: false
    node_dns_reviewed: false
    node_dns_evidence_dir: /UNCONFIGURED/evidence
  tasks:
  - ansible.builtin.debug:
      msg: 'Node DNS apply={{ node_dns_apply | bool }}; check={{ ansible_check_mode }}. Default/check mode never contacts nodes.'
  - name: Validate scope before selecting remote hosts
    when: node_dns_apply | bool and not ansible_check_mode
    block:
    - ansible.builtin.assert:
        quiet: true
        that:
        - node_dns_reviewed | bool
        - groups.get('rke2_servers', []) == ['control-1']
        - groups.get('rke2_agents', []) | sort == ['worker-1', 'worker-2']
        - node_dns_evidence_dir is match('^/')
        - not node_dns_evidence_dir.startswith('/UNCONFIGURED/')
        - node_dns_evidence_dir | realpath == node_dns_evidence_dir
    - ansible.builtin.stat:
        path: '{{ node_dns_evidence_dir }}'
        follow: false
      register: node_dns_evidence
    - ansible.builtin.assert:
        quiet: true
        that:
        - node_dns_evidence.stat.isdir | default(false)
        - not (node_dns_evidence.stat.islnk | default(false))
        - node_dns_evidence.stat.mode == '0700'
        - node_dns_evidence.stat.pw_name == lookup('env', 'USER')
    - ansible.builtin.assert:
        quiet: true
        that:
        - hostvars[item].ansible_host is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
        - hostvars[item].ansible_user | default('UNCONFIGURED') != 'UNCONFIGURED'
      loop: [worker-1, worker-2, control-1]
    - name: Require the selected DNS endpoint to answer before remote changes
      ansible.builtin.command:
        argv: [dig, '@{{ hostvars["control-1"].ansible_host }}', keycloak.perkforge.home.arpa, A, +short, +time=2, +tries=1]
      register: node_dns_direct
      changed_when: false
    - ansible.builtin.assert:
        quiet: true
        that: node_dns_direct.stdout | trim == hostvars['worker-1'].ansible_host
    - ansible.builtin.add_host:
        name: '{{ item }}'
        groups: node_dns_approved_clients
        node_dns_server: '{{ hostvars["control-1"].ansible_host }}'
        node_dns_ingress: '{{ hostvars["worker-1"].ansible_host }}'
      loop: [worker-1, worker-2, control-1]

- name: Migrate worker DNS first and the single server last
  hosts: node_dns_approved_clients
  order: inventory
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: true
  tasks:
  - name: Operate only in the explicitly reviewed live invocation
    when: node_dns_apply | default(false) | bool and not ansible_check_mode
    block:
    - ansible.builtin.include_tasks: ../tasks/node-dns.yml
