- name: Require explicit ingress ownership and supported replica count
  ansible.builtin.assert:
    that:
    - rancher_ingress_class != 'UNCONFIGURED'
    - rancher_replicas | int > 0
- name: Refuse ambiguous credential paths
  ansible.builtin.assert:
    that:
    - rancher_bootstrap_password_file is match('^/')
    - rancher_bootstrap_password_file | realpath == rancher_bootstrap_password_file
- name: Inspect the explicitly supplied bootstrap password file
  ansible.builtin.stat:
    path: '{{ rancher_bootstrap_password_file }}'
    follow: false
  register: rancher_password
  no_log: true
- name: Refuse exposed or missing bootstrap credentials
  ansible.builtin.assert:
    that:
    - rancher_password.stat.isreg | default(false)
    - not (rancher_password.stat.islnk | default(false))
    - rancher_password.stat.mode == '0600'
    - rancher_password.stat.pw_name == lookup('ansible.builtin.env', 'USER')
    - rancher_password.stat.size > 0
  no_log: true
- name: Require an exact nonblank bootstrap password with no accidental trailing newline
  ansible.builtin.assert:
    that:
    - lookup('ansible.builtin.file', rancher_bootstrap_password_file, rstrip=false) | length > 0
    - lookup('ansible.builtin.file', rancher_bootstrap_password_file, rstrip=false) == (lookup('ansible.builtin.file', rancher_bootstrap_password_file, rstrip=false) | trim)
  no_log: true
- name: Install cert-manager only when infrastructure is its approved lifecycle owner
  when: rancher_install_cert_manager | bool
  ansible.builtin.command:
    argv: ['{{ rancher_helm }}', upgrade, --install, cert-manager, cert-manager, --repo, https://charts.jetstack.io, --kubeconfig, '{{ rancher_kubeconfig }}', --kube-context, '{{ rancher_context }}', --namespace, cert-manager, --create-namespace, --version, '{{ cert_manager_version }}', --set, crds.enabled=true, --wait, --timeout, 10m]
  register: cert_manager_result
  changed_when: "'has been upgraded' in cert_manager_result.stdout or 'has been installed' in cert_manager_result.stdout"
- name: Render nonsecret management chart values
  ansible.builtin.set_fact:
    rancher_values: "{{ lookup('ansible.builtin.template', playbook_dir + '/../rancher/values.yaml.j2') }}"
- name: Install the pinned management chart with credentials supplied by file only
  ansible.builtin.command:
    argv: ['{{ rancher_helm }}', upgrade, --install, rancher, rancher, --repo, https://releases.rancher.com/server-charts/stable, --kubeconfig, '{{ rancher_kubeconfig }}', --kube-context, '{{ rancher_context }}', --namespace, cattle-system, --create-namespace, --version, '{{ rancher_version }}', --values, '-', --set-file, 'bootstrapPassword={{ rancher_bootstrap_password_file }}', --wait, --timeout, 20m]
    stdin: '{{ rancher_values }}'
  register: rancher_install_result
  changed_when: "'has been upgraded' in rancher_install_result.stdout or 'has been installed' in rancher_install_result.stdout"
  no_log: true
- name: Wait for management server and admission webhook readiness
  ansible.builtin.command:
    argv: ['{{ rancher_kubectl }}', --kubeconfig, '{{ rancher_kubeconfig }}', --context, '{{ rancher_context }}', --request-timeout=20s, -n, cattle-system, rollout, status, 'deployment/{{ item }}', --timeout=10m]
  loop: [rancher, rancher-webhook]
  changed_when: false
