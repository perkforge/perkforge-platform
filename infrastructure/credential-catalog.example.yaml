# METADATA ONLY: illustrative schema/example, not discovered cluster state.
# Keep populated registers private/ignored. Never include credential bytes,
# recovery shares, sensitive endpoints, private addresses or authenticated URLs.
schema_version: 1
credentials:
  - id: example-cluster-ghcr-pull-operator-generation
    record_status: proposed  # proposed | verified | retired
    cluster_reference: example-cluster
    category: ghcr-pull-token
    purpose: Pull approved private images from GHCR
    type: provider-token  # distinguish tokens, passwords, keys, certificates, shares
    issuer: GitHub
    owner: UNCONFIGURED
    custodian: UNCONFIGURED
    scope_or_role: read-only approved packages
    source_of_truth:
      location_reference: UNCONFIGURED
      status: proposed
    runtime_copies:
      - location_reference: example-workload-secret-reference
        status: proposed
        cleanup_or_refresh_procedure: UNCONFIGURED
    encrypted_backup:
      location_reference: UNCONFIGURED
      generation: unknown
      recovery_material_reference: UNCONFIGURED  # Separate custody, never the key/share itself
      restore_procedure: UNCONFIGURED
      last_restore_verified_at: unknown
    issued_at: unknown
    expires_at: unknown  # RFC3339 UTC | unknown | not_applicable
    expiry_reason_or_evidence: Issuer metadata has not been reviewed
    last_verified:
      at: unknown
      by: UNCONFIGURED
      evidence_reference: UNCONFIGURED  # Redacted metadata only
    lifecycle:
      renewal_procedure: UNCONFIGURED  # Extend a renewable lease/TTL, if supported
      replacement_procedure: UNCONFIGURED  # Issue new, distribute, verify, revoke old
      revocation_procedure: UNCONFIGURED
      last_replaced_at: unknown
      next_review_at: unknown
    automation:
      renewal:
        supported: unknown  # supported | unsupported | unknown | not_applicable
        support_evidence_reference: UNCONFIGURED  # Official provider/version evidence
        configured: false
        configuration_reference: UNCONFIGURED
        tested: false
        tested_at: unknown
        test_evidence_reference: UNCONFIGURED
      replacement:
        supported: unknown
        support_evidence_reference: UNCONFIGURED
        configured: false
        configuration_reference: UNCONFIGURED
        tested: false
        tested_at: unknown
        test_evidence_reference: UNCONFIGURED
      synchronization:
        mechanism: not_applicable  # e.g. ESO; synchronization is not provider issuance
        configured: false
        tested: false
        test_evidence_reference: UNCONFIGURED
    dependencies: []  # Other register IDs: issuer identity, seal/KMS, DNS, consumers
    alerts:
      responsible_owner: UNCONFIGURED
      escalation_reference: UNCONFIGURED
      lead_time_policy: UNCONFIGURED
      delivery_reference: UNCONFIGURED
      configured: false
      last_tested_at: unknown
    # For key/certificate entries, populate metadata only; otherwise explicit N/A.
    key_and_certificate_metadata:
      public_fingerprint: not_applicable
      issuer_reference: not_applicable
      not_before: not_applicable
      private_key_record_reference: not_applicable
      certificate_record_reference: not_applicable
      trust_bundle_reference: not_applicable
