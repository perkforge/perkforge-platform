id: tenant-bravo
displayName: Tenant Bravo
cluster: local
rancher:
  projectName: tenant-bravo
  dashboardAccess: true
identity:
  provider: keycloak
  groups:
    admins: /tenants/tenant-bravo/admins
    developers: /tenants/tenant-bravo/developers
    viewers: /tenants/tenant-bravo/viewers
isolation:
  tier: shared
  network: restricted
  runtime: restricted
observability:
  metrics: true
  costAllocation: true
resources:
  budget:
    pods: '15'
    requests.cpu: '1'
    requests.memory: 1500Mi
    limits.cpu: '2'
    limits.memory: 2Gi
    persistentvolumeclaims: '5'
    requests.storage: 10Gi
    services: '10'
  defaults:
    requestCpu: 100m
    requestMemory: 128Mi
    limitCpu: 500m
    limitMemory: 512Mi
environments:
- name: default
  namespace: tenant-bravo
  allocation:
    pods: '15'
    requests.cpu: '1'
    requests.memory: 1500Mi
    limits.cpu: '2'
    limits.memory: 2Gi
    persistentvolumeclaims: '5'
    requests.storage: 10Gi
    services: '10'
