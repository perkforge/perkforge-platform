{{- define "foundation.validate" -}}
{{- $f := .Values.foundation -}}
{{- $foundCluster := false -}}
{{- range .Values.clusters -}}{{- if eq .name $.Values.cluster -}}{{- $foundCluster = true -}}{{- end -}}{{- end -}}
{{- if not $foundCluster -}}{{ fail "tenant cluster must have registered Pod Security settings" }}{{- end -}}
{{- if not (has $f.lifecycle.state (list "disabled" "active" "paused")) -}}{{ fail "foundation lifecycle must be disabled, active or paused; decommission is separate" }}{{- end -}}
{{- range $name, $enabled := $f.components -}}
  {{- if not (has $name (list "project" "namespaces" "quotas" "limits" "networkPolicies" "serviceAccounts" "deploymentRbac" "fleetAccess" "registration")) -}}{{ fail "unknown foundation component" }}{{- end -}}
  {{- if not (kindIs "bool" $enabled) -}}{{ fail "component switches must be booleans" }}{{- end -}}
  {{- if not $enabled -}}{{- $_ := required (printf "platform opt-out reason required for %s" $name) (index $f.optOutReasons $name) -}}{{- end -}}
{{- end -}}
{{- range $name, $ns := $f.namespaces -}}
  {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $name) -}}{{ fail "invalid namespace name" }}{{- end -}}
  {{- range $.Values.environments -}}{{- if eq .namespace $name -}}{{ fail "namespace is already owned by the legacy foundation" }}{{- end -}}{{- end -}}
  {{- if eq $f.lifecycle.state "disabled" -}}
    {{- if $ns.allocation -}}{{ fail "disabled foundation must not allocate a namespace; retain existing resources as paused" }}{{- end -}}
  {{- else -}}
    {{- if not $ns.allocation -}}{{ fail "active/paused namespace requires an explicit allocation" }}{{- end -}}
    {{- range $key := list "pods" "requests.cpu" "requests.memory" "limits.cpu" "limits.memory" "persistentvolumeclaims" "requests.storage" "services" -}}
      {{- if not (hasKey $ns.allocation $key) -}}{{ fail (printf "missing allocation %s" $key) }}{{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- range $key, $repo := $f.repositories -}}
  {{- if not (hasKey $f.namespaces $repo.namespace) -}}{{ fail "repository must target an enrolled namespace" }}{{- end -}}
  {{- if not (regexMatch "^[a-f0-9]{40}$" $repo.revision) -}}{{ fail "repository revision must be an immutable commit" }}{{- end -}}
{{- end -}}
{{- end -}}
