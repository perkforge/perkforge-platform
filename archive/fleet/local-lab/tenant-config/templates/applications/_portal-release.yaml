{{/* Envelope restriction only: this does not authenticate compressed Helm content. */}}
{{- define "portal.releaseEnvelope" -}}
{{- $o := .object -}}
({{ $o }} == null || (
  has({{ $o }}.metadata.name) &&
  {{ $o }}.metadata.namespace == {{ .contract.namespace | toJson }} &&
  has({{ $o }}.type) && {{ $o }}.type == "helm.sh/release.v1" &&
  has({{ $o }}.metadata.labels) &&
  ["owner", "name", "version", "status"].all(k, k in {{ $o }}.metadata.labels) &&
  {{ $o }}.metadata.labels["owner"] == "helm" &&
  {{ $o }}.metadata.labels["name"] == {{ .contract.releaseName | toJson }} &&
  {{ $o }}.metadata.labels["version"].matches("^[1-9][0-9]*$") &&
  {{ $o }}.metadata.name == {{ printf "sh.helm.release.v1.%s.v" .contract.releaseName | toJson }} + {{ $o }}.metadata.labels["version"] &&
  {{ $o }}.metadata.labels["status"] in ["unknown", "deployed", "uninstalled", "superseded", "failed", "uninstalling", "pending-install", "pending-upgrade", "pending-rollback"] &&
  has({{ $o }}.data) && size({{ $o }}.data) == 1 && "release" in {{ $o }}.data && size({{ $o }}.data["release"]) > 0 &&
  (!has({{ $o }}.stringData) || size({{ $o }}.stringData) == 0) &&
  (!has({{ $o }}.metadata.ownerReferences) || size({{ $o }}.metadata.ownerReferences) == 0) &&
  (!has({{ $o }}.metadata.finalizers) || size({{ $o }}.metadata.finalizers) == 0)
))
{{- end -}}
