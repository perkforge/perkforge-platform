{{- $f := .Values.foundation }}
{{- if and (ne $f.lifecycle.state "disabled") $f.components.limits }}
{{- range $name, $ns := $f.namespaces }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: {{ $name }}
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: {{ $.Values.resources.defaults.requestCpu | quote }}
      memory: {{ $.Values.resources.defaults.requestMemory | quote }}
    default:
      cpu: {{ $.Values.resources.defaults.limitCpu | quote }}
      memory: {{ $.Values.resources.defaults.limitMemory | quote }}
{{- end }}
{{- end }}
