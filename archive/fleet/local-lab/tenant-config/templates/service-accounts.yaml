{{- $f := .Values.foundation }}
{{- if and (ne $f.lifecycle.state "disabled") $f.components.serviceAccounts }}
{{- range $name, $ns := $f.namespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $ns.runtimeServiceAccount }}
  namespace: {{ $name }}
automountServiceAccountToken: false
{{- end }}
{{- range $key, $repo := $f.repositories }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $repo.deployerServiceAccount }}
  namespace: {{ $f.fleetAgentNamespace }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
