alertmanager:
  enabled: false

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: false
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector:
    kubernetes.io/hostname: cks-worker

kubeStateMetrics:
  enabled: true
kube-state-metrics:
  metricLabelsAllowlist:
    - namespaces=[platform.perkforge.io/tenant,platform.perkforge.io/environment,platform.perkforge.io/isolation-tier]
  resources:
    requests:
      cpu: 50m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector:
    kubernetes.io/hostname: cks-worker

nodeExporter:
  enabled: true
prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheusOperator:
  nodeSelector:
    kubernetes.io/hostname: cks-worker
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi

prometheus:
  enabled: true
  ingress:
    enabled: false
  prometheusSpec:
    replicas: 1
    retention: 3d
    retentionSize: 1GB
    scrapeInterval: 60s
    evaluationInterval: 60s
    externalLabels:
      cluster: local
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    storageSpec:
      emptyDir:
        sizeLimit: 2Gi
    resources:
      requests:
        cpu: 200m
        memory: 320Mi
      limits:
        cpu: "1"
        memory: 768Mi
    nodeSelector:
      kubernetes.io/hostname: cks-worker
