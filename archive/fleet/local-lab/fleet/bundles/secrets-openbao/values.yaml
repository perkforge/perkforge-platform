# Staged only: absent from every active GitRepo path.
global:
  tlsDisable: false
injector:
  enabled: false
server:
  image:
    registry: quay.io
    repository: openbao/openbao
    tag: 2.7.2
  nodeSelector:
    kubernetes.io/hostname: cks-worker
  hostAliases:
  - ip: 10.43.163.193
    hostnames: [keycloak.local-lab.test]
  extraEnvironmentVars:
    GOMEMLIMIT: 384MiB
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  readinessProbe:
    # Kubelet HTTPS health probe; operational clients still verify the CA/SAN.
    path: /v1/sys/health?standbyok=true
  authDelegator:
    enabled: true
  statefulSet:
    securityContext:
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        disable_mlock = true
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/openbao/tls/tls.crt"
          tls_key_file = "/openbao/tls/tls.key"
        }
        audit "file" "platform-file" {
          description = "Persistent platform audit; HMAC sensitive fields"
          options {
            file_path = "/openbao/audit/audit.json"
            mode = "0600"
            log_raw = "false"
          }
        }
        storage "raft" {
          path = "/openbao/data"
        }
        service_registration "kubernetes" {}
  dataStorage:
    size: 2Gi
    storageClass: local-path
  auditStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumes:
  - name: oidc-ca
    configMap:
      name: openbao-ca
  - name: server-tls
    secret:
      secretName: openbao-server-tls
  volumeMounts:
  - name: oidc-ca
    mountPath: /openbao/ca
    readOnly: true
  - name: server-tls
    mountPath: /openbao/tls
    readOnly: true
  ingress:
    enabled: false
ui:
  enabled: true
