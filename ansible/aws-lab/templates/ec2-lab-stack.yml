AWSTemplateFormatVersion: '2010-09-09'
Description: Disposable PerkForge three-node RKE2 development lab
Parameters:
  LabName: { Type: String }
  AmiId: { Type: AWS::EC2::Image::Id }
  RootDeviceName: { Type: String }
  InstanceType: { Type: String, Default: t3a.large }
  VolumeSizeGiB: { Type: Number, Default: 50, MinValue: 30, MaxValue: 200 }
  KeyPairName: { Type: AWS::EC2::KeyPair::KeyName }
  CpuCredits: { Type: String, AllowedValues: [standard, unlimited], Default: standard }
  VpcCidr: { Type: String, Default: 10.50.0.0/16 }
  SubnetCidr: { Type: String, Default: 10.50.1.0/24 }
  ServerPrivateIp: { Type: String, Default: 10.50.1.10 }
  Agent1PrivateIp: { Type: String, Default: 10.50.1.11 }
  Agent2PrivateIp: { Type: String, Default: 10.50.1.12 }
  ProjectTag: { Type: String }
  EnvironmentTag: { Type: String }
  ManagedByTag: { Type: String }
  ExpirationTag: { Type: String }
Resources:
  LabVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub '${LabName}-vpc' }
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: Environment, Value: !Ref EnvironmentTag }
        - { Key: ManagedBy, Value: !Ref ManagedByTag }
        - { Key: ExpiresOn, Value: !Ref ExpirationTag }
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub '${LabName}-igw' }
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: Environment, Value: !Ref EnvironmentTag }
        - { Key: ManagedBy, Value: !Ref ManagedByTag }
        - { Key: ExpiresOn, Value: !Ref ExpirationTag }
  VpcIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref LabVpc
      InternetGatewayId: !Ref InternetGateway
  LabSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVpc
      CidrBlock: !Ref SubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub '${LabName}-subnet' }
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: Environment, Value: !Ref EnvironmentTag }
        - { Key: ManagedBy, Value: !Ref ManagedByTag }
        - { Key: ExpiresOn, Value: !Ref ExpirationTag }
  LabRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LabVpc
      Tags:
        - { Key: Name, Value: !Sub '${LabName}-routes' }
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: Environment, Value: !Ref EnvironmentTag }
        - { Key: ManagedBy, Value: !Ref ManagedByTag }
        - { Key: ExpiresOn, Value: !Ref ExpirationTag }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcIgwAttachment
    Properties:
      RouteTableId: !Ref LabRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref LabRouteTable
      SubnetId: !Ref LabSubnet
  NodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RKE2 intra-VPC traffic only; no public ingress
      VpcId: !Ref LabVpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 9345, ToPort: 9345, CidrIp: !Ref VpcCidr, Description: RKE2 supervisor }
        - { IpProtocol: tcp, FromPort: 6443, ToPort: 6443, CidrIp: !Ref VpcCidr, Description: Kubernetes API inside VPC }
        - { IpProtocol: tcp, FromPort: 10250, ToPort: 10250, CidrIp: !Ref VpcCidr, Description: Kubelet }
        - { IpProtocol: udp, FromPort: 8472, ToPort: 8472, CidrIp: !Ref VpcCidr, Description: Canal VXLAN inside VPC }
        - { IpProtocol: tcp, FromPort: 30000, ToPort: 32767, CidrIp: !Ref VpcCidr, Description: Kubernetes NodePorts inside VPC }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: !Ref VpcCidr, Description: Node-to-node cluster traffic }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: OS and package repositories }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: SSM and software repositories }
      Tags:
        - { Key: Name, Value: !Sub '${LabName}-nodes' }
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: Environment, Value: !Ref EnvironmentTag }
        - { Key: ManagedBy, Value: !Ref ManagedByTag }
        - { Key: ExpiresOn, Value: !Ref ExpirationTag }
  Ec2SsmRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${LabName}-ec2-ssm'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                ec2:SourceInstanceARN: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: Environment, Value: !Ref EnvironmentTag }
        - { Key: ManagedBy, Value: !Ref ManagedByTag }
        - { Key: ExpiresOn, Value: !Ref ExpirationTag }
  Ec2SsmInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${LabName}-ec2-ssm'
      Roles: [!Ref Ec2SsmRole]
  Rke2Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref Ec2SsmInstanceProfile
      CreditSpecification: { CpuCredits: !Ref CpuCredits }
      MetadataOptions: { HttpEndpoint: enabled, HttpTokens: required, HttpPutResponseHopLimit: 1 }
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: !Ref LabSubnet
          GroupSet: [!Ref NodeSecurityGroup]
          PrivateIpAddress: !Ref ServerPrivateIp
      BlockDeviceMappings:
        - DeviceName: !Ref RootDeviceName
          Ebs: { VolumeSize: !Ref VolumeSizeGiB, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: !Sub '${LabName}-server' }
        - { Key: Role, Value: server }
        - { Key: LabStack, Value: !Ref LabName }
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: Environment, Value: !Ref EnvironmentTag }
        - { Key: ManagedBy, Value: !Ref ManagedByTag }
        - { Key: ExpiresOn, Value: !Ref ExpirationTag }
  Rke2Agent1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref Ec2SsmInstanceProfile
      CreditSpecification: { CpuCredits: !Ref CpuCredits }
      MetadataOptions: { HttpEndpoint: enabled, HttpTokens: required, HttpPutResponseHopLimit: 1 }
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: !Ref LabSubnet
          GroupSet: [!Ref NodeSecurityGroup]
          PrivateIpAddress: !Ref Agent1PrivateIp
      BlockDeviceMappings:
        - DeviceName: !Ref RootDeviceName
          Ebs: { VolumeSize: !Ref VolumeSizeGiB, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: !Sub '${LabName}-agent-1' }
        - { Key: Role, Value: agent }
        - { Key: LabStack, Value: !Ref LabName }
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: Environment, Value: !Ref EnvironmentTag }
        - { Key: ManagedBy, Value: !Ref ManagedByTag }
        - { Key: ExpiresOn, Value: !Ref ExpirationTag }
  Rke2Agent2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref Ec2SsmInstanceProfile
      CreditSpecification: { CpuCredits: !Ref CpuCredits }
      MetadataOptions: { HttpEndpoint: enabled, HttpTokens: required, HttpPutResponseHopLimit: 1 }
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: !Ref LabSubnet
          GroupSet: [!Ref NodeSecurityGroup]
          PrivateIpAddress: !Ref Agent2PrivateIp
      BlockDeviceMappings:
        - DeviceName: !Ref RootDeviceName
          Ebs: { VolumeSize: !Ref VolumeSizeGiB, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: !Sub '${LabName}-agent-2' }
        - { Key: Role, Value: agent }
        - { Key: LabStack, Value: !Ref LabName }
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: Environment, Value: !Ref EnvironmentTag }
        - { Key: ManagedBy, Value: !Ref ManagedByTag }
        - { Key: ExpiresOn, Value: !Ref ExpirationTag }
Outputs:
  VpcId: { Value: !Ref LabVpc }
  SubnetId: { Value: !Ref LabSubnet }
  SecurityGroupId: { Value: !Ref NodeSecurityGroup }
  ServerInstanceId: { Value: !Ref Rke2Server }
  Agent1InstanceId: { Value: !Ref Rke2Agent1 }
  Agent2InstanceId: { Value: !Ref Rke2Agent2 }
