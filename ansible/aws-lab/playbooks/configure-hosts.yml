---
- name: Configure safe host prerequisites for the AWS RKE2 nodes
  hosts: rke2_server:rke2_agent
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Require explicit authorization to modify the lab nodes
      ansible.builtin.assert:
        that:
          - aws_lab_confirmation | default('') == 'configure perkforge aws lab'

    - name: Require the selected operating system to match the pinned AMI
      ansible.builtin.assert:
        that:
          - (aws_lab_os_family == 'rhel' and ansible_distribution == 'RedHat') or
            (aws_lab_os_family == 'amazon' and ansible_distribution == 'Amazon')
        fail_msg: Review the OS-specific prerequisites before using this AMI.

    - name: Install common RKE2 host prerequisites
      ansible.builtin.dnf:
        name:
          - curl
          - tar
          - iptables
          - firewalld
          - python3-firewall
        state: present

    - name: Install additional RHEL kernel and SELinux tools
      ansible.builtin.dnf:
        name:
          - kernel-modules-extra
          - policycoreutils-python-utils
        state: present
      when: aws_lab_os_family == 'rhel'

    - name: Keep SELinux enabled and enforcing
      ansible.builtin.command: getenforce
      register: aws_lab_selinux_mode
      changed_when: false

    - name: Require enforcing SELinux before installing RKE2
      ansible.builtin.assert:
        that:
          - aws_lab_selinux_mode.stdout == 'Enforcing'
        fail_msg: >-
          The selected image is not enforcing SELinux. Review the image and
          install policy before proceeding; this playbook will not disable SELinux.

    - name: Enable and start firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Permit RKE2 supervisor, API, kubelet, and NodePort traffic from this VPC
      ansible.posix.firewalld:
        port: "{{ item }}"
        zone: public
        permanent: true
        immediate: true
        state: enabled
      loop:
        - 9345/tcp
        - 6443/tcp
        - 10250/tcp
        - 30000-32767/tcp
        - 8472/udp
      # The AWS security group restricts ingress to the dedicated VPC CIDR.

    - name: Load overlay networking modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/rke2.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          br_netfilter
          overlay

    - name: Ensure overlay networking modules are loaded now
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - overlay

    - name: Configure Kubernetes bridge sysctls
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/90-rke2.conf
        reload: true
      loop:
        - { key: net.bridge.bridge-nf-call-iptables, value: '1' }
        - { key: net.bridge.bridge-nf-call-ip6tables, value: '1' }
        - { key: net.ipv4.ip_forward, value: '1' }
