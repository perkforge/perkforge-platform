---
- name: Create the optional account-level AWS Budget
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Require separate authorization for account-level changes
      ansible.builtin.assert:
        that:
          - aws_lab_confirmation | default('') == 'create perkforge aws lab budget'
          - aws_lab_budget_email | default('') is match('^.+@.+$')
        fail_msg: >-
          This creates an account-level budget and email notifications. Provide
          aws_lab_budget_email and set aws_lab_confirmation='create perkforge aws lab budget'.

    - name: Create or update the persistent monthly budget stack
      amazon.aws.cloudformation:
        stack_name: perkforge-aws-lab-budget
        state: present
        region: us-east-1
        template_body: "{{ lookup('file', playbook_dir ~ '/../templates/monthly-budget.yml') }}"
        template_parameters:
          BudgetAmount: "{{ aws_lab_budget_amount_usd }}"
          AlertEmail: "{{ aws_lab_budget_email }}"
