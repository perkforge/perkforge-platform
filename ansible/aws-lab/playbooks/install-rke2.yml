---
- name: Install the RKE2 server
  hosts: rke2_server
  become: true
  gather_facts: true
  serial: 1
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Require explicit authorization to configure RKE2
      ansible.builtin.assert:
        that:
          - aws_lab_confirmation | default('') == 'configure perkforge aws lab'

    - name: Download the official RKE2 installer
      ansible.builtin.get_url:
        url: "{{ rke2_install_script_url }}"
        dest: /usr/local/sbin/rke2-install.sh
        owner: root
        group: root
        mode: "0755"
        force: false

    - name: Install the pinned RKE2 server and SELinux policy
      ansible.builtin.shell: /bin/sh /usr/local/sbin/rke2-install.sh
      environment:
        INSTALL_RKE2_TYPE: server
        INSTALL_RKE2_CHANNEL: "{{ rke2_channel }}"
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"
      args:
        creates: /usr/local/bin/rke2
      notify: Restart RKE2 server

    - name: Create the RKE2 server configuration directory
      ansible.builtin.file:
        path: "{{ rke2_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure the RKE2 server using its stable private VPC address
      ansible.builtin.template:
        src: ../templates/rke2-server.yaml.j2
        dest: "{{ rke2_config_dir }}/config.yaml"
        owner: root
        group: root
        mode: "0600"
      notify: Restart RKE2 server

    - name: Enable and start the RKE2 server
      ansible.builtin.service:
        name: rke2-server
        state: started
        enabled: true

    - name: Wait for the RKE2 supervisor and Kubernetes API
      ansible.builtin.wait_for:
        host: "{{ rke2_node_ip }}"
        port: "{{ item }}"
        timeout: 600
      loop: [9345, 6443]

    - name: Create the ignored AWS lab secrets directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../../.secrets/aws-lab/credentials"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch the RKE2 kubeconfig to the ignored directory
      ansible.builtin.fetch:
        src: /etc/rancher/rke2/rke2.yaml
        dest: "{{ playbook_dir }}/../../../.secrets/aws-lab/credentials/kubeconfig"
        flat: true
      no_log: true

    - name: Point kubeconfig at the local SSM tunnel
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/../../../.secrets/aws-lab/credentials/kubeconfig"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://127.0.0.1:{{ rke2_local_api_port }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Restrict kubeconfig permissions
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../../.secrets/aws-lab/credentials/kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Read the RKE2 server join token for this play only
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/node-token
      register: rke2_server_token
      no_log: true

  handlers:
    - name: Restart RKE2 server
      ansible.builtin.service:
        name: rke2-server
        state: restarted

- name: Install and join the two RKE2 agents
  hosts: rke2_agent
  become: true
  gather_facts: true
  serial: 1
  vars_files:
    - ../group_vars/all.yml
  vars:
    rke2_server_host: "{{ groups['rke2_server'][0] }}"
    rke2_server_ip: "{{ hostvars[rke2_server_host].rke2_node_ip }}"
    rke2_join_token: "{{ hostvars[rke2_server_host].rke2_server_token.content | b64decode }}"
  tasks:
    - name: Require explicit authorization to configure RKE2
      ansible.builtin.assert:
        that:
          - aws_lab_confirmation | default('') == 'configure perkforge aws lab'

    - name: Wait for the server registration endpoint
      ansible.builtin.wait_for:
        host: "{{ rke2_server_ip }}"
        port: 9345
        timeout: 600

    - name: Download the official RKE2 installer
      ansible.builtin.get_url:
        url: "{{ rke2_install_script_url }}"
        dest: /usr/local/sbin/rke2-install.sh
        owner: root
        group: root
        mode: "0755"
        force: false

    - name: Install the pinned RKE2 agent and SELinux policy
      ansible.builtin.shell: /bin/sh /usr/local/sbin/rke2-install.sh
      environment:
        INSTALL_RKE2_TYPE: agent
        INSTALL_RKE2_CHANNEL: "{{ rke2_channel }}"
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"
      args:
        creates: /usr/local/bin/rke2

    - name: Create the RKE2 agent configuration directory
      ansible.builtin.file:
        path: "{{ rke2_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure RKE2 agent join credentials
      ansible.builtin.template:
        src: ../templates/rke2-agent.yaml.j2
        dest: "{{ rke2_config_dir }}/config.yaml"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart RKE2 agent

    - name: Enable and start RKE2 agent
      ansible.builtin.service:
        name: rke2-agent
        state: started
        enabled: true

    - name: Wait for the agent kubelet to start
      ansible.builtin.wait_for:
        host: "{{ rke2_node_ip }}"
        port: 10250
        timeout: 600

  handlers:
    - name: Restart RKE2 agent
      ansible.builtin.service:
        name: rke2-agent
        state: restarted
