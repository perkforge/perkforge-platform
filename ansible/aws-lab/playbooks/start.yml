---
- name: Start the disposable PerkForge AWS lab
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Require explicit authorization to incur compute charges
      ansible.builtin.assert:
        that:
          - aws_lab_confirmation | default('') == 'start perkforge aws lab'
        fail_msg: Set aws_lab_confirmation='start perkforge aws lab' after reviewing expected charges.

    - name: Find non-terminated instances belonging to this lab
      amazon.aws.ec2_instance_info:
        region: "{{ aws_lab_region }}"
        filters:
          "tag:Project": "{{ aws_lab_project_tag }}"
          "tag:Environment": "{{ aws_lab_environment_tag }}"
          "tag:LabStack": "{{ aws_lab_stack_name }}"
          "instance-state-name": [pending, running, stopping, stopped]
      register: aws_lab_instances

    - name: Require the expected three instances before starting
      ansible.builtin.assert:
        that:
          - aws_lab_instances.instances | length == 3
        fail_msg: Expected exactly three tagged lab instances; inspect status before continuing.

    - name: Start all lab instances
      amazon.aws.ec2_instance:
        region: "{{ aws_lab_region }}"
        instance_ids: "{{ aws_lab_instances.instances | map(attribute='instance_id') | list }}"
        state: started
        wait: true
        wait_timeout: 600
