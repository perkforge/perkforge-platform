---
- name: Destroy the disposable PerkForge AWS lab and its disks
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Require explicit authorization to delete instances and EBS data
      ansible.builtin.assert:
        that:
          - aws_lab_confirmation | default('') == 'destroy perkforge aws lab'
        fail_msg: >-
          This permanently deletes the cluster and EBS data. Set
          aws_lab_confirmation='destroy perkforge aws lab' only after review.

    - name: Delete the lab CloudFormation stack and all EC2/EBS/network resources
      amazon.aws.cloudformation:
        stack_name: "{{ aws_lab_stack_name }}"
        state: absent
        region: "{{ aws_lab_region }}"

    - name: Delete the temporary AWS EC2 key pair
      amazon.aws.ec2_key:
        name: "{{ aws_lab_key_pair_name }}"
        state: absent
        region: "{{ aws_lab_region }}"
        tags:
          Project: "{{ aws_lab_project_tag }}"
          Environment: "{{ aws_lab_environment_tag }}"

    - name: Remove transient key, kubeconfig, and test evidence from the workstation
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../../.secrets/aws-lab/credentials"
        state: absent
