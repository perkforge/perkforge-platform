---
# Intentionally separate from physical-host and local-lab variables.
aws_lab_region: us-east-1
aws_lab_stack_name: perkforge-aws-lab
aws_lab_project_tag: PerkForgePlatform
aws_lab_environment_tag: aws-lab
aws_lab_managed_by_tag: Ansible
aws_lab_expiration_tag: "SET-BEFORE-PROVISIONING"

aws_lab_instance_type: t3a.large
aws_lab_cpu_credits: standard
aws_lab_volume_size_gib: 50
aws_lab_vpc_cidr: 10.50.0.0/16
aws_lab_subnet_cidr: 10.50.1.0/24
aws_lab_server_ip: 10.50.1.10
aws_lab_agent_1_ip: 10.50.1.11
aws_lab_agent_2_ip: 10.50.1.12

# Choose an explicitly reviewed, pinned AMI before provisioning. Supported
# values are intentionally not inferred from the account's newest AMI.
aws_lab_ami_id: ""
aws_lab_root_device_name: ""
aws_lab_os_family: "" # rhel or amazon; confirm RKE2 compatibility first
aws_lab_ssh_user: ec2-user

aws_lab_key_pair_name: perkforge-aws-lab
aws_lab_credentials_dir: "{{ inventory_dir }}/../../../.secrets/aws-lab/credentials"
aws_lab_private_key_path: "{{ aws_lab_credentials_dir }}/id_rsa"
aws_lab_known_hosts_path: "{{ aws_lab_credentials_dir }}/known_hosts"
aws_lab_cluster_name: perkforge-aws-lab

rke2_version: v1.36.5+rke2r1
rke2_channel: stable
rke2_install_script_url: https://get.rke2.io
rke2_config_dir: /etc/rancher/rke2
rke2_cluster_cidr: 10.42.0.0/16
rke2_service_cidr: 10.43.0.0/16
rke2_local_api_port: 16443

aws_lab_budget_amount_usd: "30"
